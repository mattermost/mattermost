# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for mattermost/mattermost

inheritance: true

reviews:
  # --- What to review ----------------------------------------------------------
  path_filters:
    - "!server/**/mocks/**"
    - "!webapp/**/mocks/**"
    - "!**/*_generated.go"
    - "!**/*_serial_gen.go"
    - "!server/channels/app/oembed/providers_gen.go"
    - "!server/channels/store/retrylayer/**"
    - "!server/channels/store/timerlayer/**"
    - "!**/__snapshots__/**"
    - "!i18n/glossary/**"

  # --- Repository context the reviewer was missing -----------------------------
  path_instructions:
    - path: "**/*"
      instructions: |
        Review scope rules for this repository:
        - Only raise issues introduced or made worse by this PR's diff. Code that predates
          the PR is out of scope; if it is truly severe, mention it once in the summary,
          not as an inline or outside-diff finding.
        - Do not re-raise a finding the author has answered with a reason. Accept the
          reason unless it is factually wrong, and if so say exactly why with a file:line.
        - On incremental reviews, comment only on lines changed since the last review.
          Do not introduce new findings on unchanged lines of earlier commits.
        - Before claiming a behavior (ordering, error propagation, caching), trace the
          callee. Several declined findings were wrong because the callee already handled it.
        - Prefer consistency with existing patterns in the same package over a "safer"
          one-off. Do not suggest try/catch, extra validation, or defensive checks that
          the equivalent existing code paths do not have.
        - Severity: Major means a user-visible bug, data loss, security issue, or a
          crash/hang. Edge cases with no realistic trigger are Minor at most.
        - Post a Minor finding only if it is a defect someone would hit: wrong behavior,
          a security or privacy gap, data loss, a crash or hang, a realistic race, a flaky
          or falsely passing test, a docs command or step that fails as written, a wrong
          fact, or a control unusable by keyboard or screen reader.
        - Do not post these (52% of sampled Minor findings were these, and agents fixed
          70% of them anyway): typos, grammar, hyphenation or wording; requests to
          qualify, clarify or expand statements that are already accurate; formatting
          or lint issues CI already checks; reminders to run i18n-extract or add a
          release note; extra or stronger test assertions where no gap lets a bug pass;
          defensive checks for inputs with no realistic trigger; log, error-message or
          comment polish; refactors for consistency; small layout tweaks.

    - path: "server/**/*.go"
      instructions: |
        - Local mode (`api4/*_local.go`, `localRouter`) is a trusted, socket-only admin
          interface. Do not raise requester-privilege findings for local-mode handlers.
        - Files ending in `_generated.go` and the store retry/timer layers are generated
          from `server/channels/store/layer_generators` and plugin API templates. If a fix
          belongs in generated code, point at the generator, and only if the PR touches it.
        - Store methods take `request.CTX`, not `context.Context` (see server/AGENTS.md).
        - Do not flag premature optimizations or allocation micro-tuning unless the code is
          on a hot path (post creation, websocket broadcast, permission checks).
        - `rctx.Session()` returns a pointer to an embedded value and is never nil, even for
          `request.EmptyContext`. Do not flag dereferences of it as possible nil panics.
        - `Config.IsValid` validates a non-empty `ServiceSettings.SiteURL` with
          `url.ParseRequestURI`. Do not ask for extra error handling when parsing it; only
          flag code that breaks when it is empty.
        - `new(expr)` (for example `new(false)` or `new(s.Field)`) is valid for the Go version
          in `go.mod`. Do not flag it or suggest a pointer helper instead.

    - path: "server/**/{go.mod,go.sum}"
      instructions: |
        Dependency-bump PRs: review only for breaking API changes and known CVEs, not
        upstream library design. The `go` and `toolchain` directives are upgraded
        separately; do not ask a dependency bump to change them. `go.sum` keeps `/go.mod`
        checksums for older versions of transitive dependencies; that is expected, not an
        incomplete upgrade.

    - path: "server/**/*_test.go"
      instructions: |
        Only flag tests that can pass while the code is broken, are flaky (timing, shared
        global state, ordering), or leak resources. Do not suggest extra assertions,
        table-driven refactors, or naming changes.
        - testify: `On("Method").Unset()` also removes expectations registered with
          `mock.Anything`. Do not flag it as leaving a stale expectation.
        - Packages using `testlib.NewMainHelper` run from a temp directory with `tests/`,
          `i18n/`, `templates/` and `fonts/` symlinked in, so relative paths such as
          `tests/test.png` are valid.
        - Server tests do not run on Windows. Do not request changes only for Windows.

    - path: "server/channels/app/*access_control*.go"
      instructions: |
        Access-control policy lookups fetch up to 1000 policies (the store's `MaxPerPage`)
        and then filter in memory where CEL expressions must be evaluated. Do not flag that
        cap as a pagination bug.

    - path: "server/public/model/permission.go"
      instructions: |
        Permission name and description IDs are rendered by the System Console from the
        webapp catalogue (`admin.permissions.permission.<id>.name/description`). Do not flag
        missing `server/i18n/en.json` entries for them.

    - path: "server/public/pluginapi/experimental/**"
      instructions: |
        Packages under `pluginapi/experimental` are not a stable API contract. Do not flag
        renamed or changed exported identifiers there as breaking changes.

    - path: "webapp/**/*.{ts,tsx}"
      instructions: |
        - Plugin registry and plugin component selectors should behave like the existing
          channel-header registrations. Do not request validation or error handling that
          those existing paths lack.
        - Formatting, import order, and lint rules are enforced by ESLint/Prettier in CI.
          Do not comment on them.
        - Fields in `@mattermost/types` that mirror a fixed server JSON type (for example an
          int64 serialized as a number) can be trusted. Do not suggest string coercion or
          type fallbacks for them; only free-form values such as `post.props` entries may
          need parsing.

    - path: "webapp/**/*.{scss,css,tsx}"
      instructions: |
        The webapp does not mirror layouts for right-to-left languages. Do not flag physical
        CSS properties (`left`, `margin-right`, ...) or suggest logical-property replacements.

    - path: "webapp/**/package.json"
      instructions: |
        ESLint scripts of the form `eslint ./src eslint.config.mjs` are intentional: the flat
        config is auto-detected and is passed positionally so it is linted too.

    - path: "e2e-tests/**"
      instructions: |
        Playwright runs one worker per server and CI parallelizes across servers (see
        e2e-tests/playwright/AGENTS.md). Do not flag test isolation or worker races as
        cross-test interference. Follow e2e-tests/playwright/AGENTS.md for whether tests
        must restore server config they change. Do not comment on formatting. Focus on flaky waits,
        missing assertions, and tests that can pass without exercising the feature.
        Test helpers and setup code do not need production-grade validation: do not ask for
        NaN or type guards on values read from the UI, or for per-error-type handling where a
        helper deliberately catches errors while fetching an optional resource. Credentials
        for generated test users (including in storage-state file names) are test data, not
        secrets.

    - path: "e2e-tests/playwright/**"
      instructions: |
        `locator.filter({hasText: name})` is the accepted way to find rows, cards and options
        for uniquely named test data; do not suggest exact text or new `data-testid`
        attributes for it. Where a page object asserts identity or result order, exact
        `data-testid` matching is correct; do not suggest replacing it with `hasText`.

    - path: "docs/**"
      instructions: |
        Documentation review. Flag only: technically wrong statements, commands or config
        that will fail or are unsafe as written, broken links, and missing steps that make a
        procedure fail. Do not expand the page's scope into adjacent systems (for example
        connection-pooler or proxy configuration a page does not set out to cover), do not
        reword for style, and do not request extra qualifications on accurate statements.

    - path: ".github/**"
      instructions: |
        CI and automation code. Flag only issues that would break the workflow, produce a
        wrong pass/fail result, or expose secrets/tokens (injection via untrusted
        `github.event` fields, over-broad permissions). Do not review edge-case text
        handling in helper scripts beyond that.
        Do not flag these valid patterns: status-check functions with a job-id argument
        (`success('job-name')`), and a workflow that manages only its own PR conversation
        comments with `pull-requests: write` and no `issues: write`.

    - path: "tools/**"
      instructions: |
        Internal developer tooling, not shipped to customers. Flag only data-destructive
        behavior and correctness bugs that would give wrong results. Skip robustness
        polish (timeouts, retries, logging) unless it can hang CI.

    - path: "api/**/*.yaml"
      instructions: |
        Check that the OpenAPI spec matches the server handler in this PR: parameters,
        response codes, and required fields. Ignore wording.

    - path: "api/v4/source/access_control.yaml"
      instructions: |
        `POST /api/v4/access_control/decisions/actions/search` never returns 501: when
        access control is inactive it returns 200 with every action allowed. Do not flag a
        missing 501 response.
