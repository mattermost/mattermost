services:
  mattermost:
    build:
      context: .
      dockerfile: Dockerfile
    image: mattermost-team-edition:latest
    container_name: mattermost-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8065:8065"
      - "8067:8067"
    environment:
      # Database connection configuration
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://mmuser:mostest_password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      # Metrics and Observability (Prometheus)
      - MM_METRICSSETTINGS_ENABLE=true
      - MM_METRICSSETTINGS_LISTENADDRESS=:8067
      # Service operational settings
      - MM_SERVICESETTINGS_SITEURL=http://localhost:8065
      - MM_SERVICESETTINGS_LISTENADDRESS=:8065
      - MM_FILESETTINGS_DRIVERNAME=local
      - MM_FILESETTINGS_DIRECTORY=/mattermost/data
    volumes:
      - mattermost_config:/mattermost/config
      - mattermost_data:/mattermost/data
      - mattermost_plugins:/mattermost/plugins
      - mattermost_client_plugins:/mattermost/client/plugins
    networks:
      - mattermost_network

  postgres:
    image: postgres:15-alpine
    container_name: mattermost-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mmuser
      - POSTGRES_PASSWORD=mostest_password
      - POSTGRES_DB=mattermost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mattermost_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mattermost_config:
    driver: local
  mattermost_data:
    driver: local
  mattermost_plugins:
    driver: local
  mattermost_client_plugins:
    driver: local
  postgres_data:
    driver: local

networks:
  mattermost_network:
    driver: bridge
