# Encoder ladder. Candidates are tried in order; the first one that clears
# `threshold` wins, so the list must be ordered smallest-expected-output first.
# Ordering is by output size, not by nominal quality -- see PLAN 0.5, quality is
# not monotonic in -q.
[defaults]
threshold = 85.0
ladder = ["q80s", "q90s", "q95s", "q98s", "nl40", "lossless"]
common = ["-m", "6", "-metadata", "icc"]

[candidates]
q80s     = ["-q", "80", "-sharp_yuv"]
q90s     = ["-q", "90", "-sharp_yuv"]
q95s     = ["-q", "95", "-sharp_yuv"]
q98s     = ["-q", "98", "-sharp_yuv"]
nl40     = ["-near_lossless", "40", "-q", "100"]
lossless = ["-lossless", "-z", "9", "-exact"]

