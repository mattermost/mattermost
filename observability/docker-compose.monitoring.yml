services:
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: mattermost-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - mattermost_network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: mattermost-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - mattermost_network

  # node-exporter: métricas del host (CPU, Memoria, Disco, Red)
  # Independiente de si Mattermost expone métricas de Enterprise.
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: mattermost-node-exporter
    restart: unless-stopped
    pid: "host"
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - mattermost_network

  # blackbox-exporter: verifica disponibilidad HTTP del servicio
  # Simula peticiones reales y mide latencia de respuesta.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: mattermost-blackbox
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    networks:
      - mattermost_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: mattermost-postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://mmuser:mostest_password@mattermost-db:5432/mattermost?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - mattermost_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: mattermost-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8085:8080"
    networks:
      - mattermost_network

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  mattermost_network:
    external: true
    name: mattermost_mattermost_network
