---
# Checks that the server image an E2E run needs is on Docker Hub before any of its lanes start.
# Callers run it once per edition, and that edition's lanes need it. An image still missing after
# 5 minutes fails this check, under its own name and commit status: the fix belongs in the pipeline
# that pushes the image, not in E2E, and waiting longer is deliberately not an option.
name: Server image check
on:
  workflow_call:
    inputs:
      commit_sha:
        type: string
        required: true
        description: "Tested commit; the server-image/<edition> status is published on it"
      server_edition:
        type: string
        required: true
        description: "enterprise, fips or team"
      server_image_repo:
        type: string
        required: false
        default: mattermostdevelopment
        description: "Docker Hub namespace: mattermostdevelopment (default) or mattermost"
      server_image_tag:
        type: string
        required: true
      report_type:
        type: string
        required: false
        default: PR
        description: "PR, MASTER, RELEASE or RELEASE_CUT; suffixes the status context as the E2E lanes do"

permissions: {}

jobs:
  check:
    name: Server image (${{ inputs.server_edition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      statuses: write
    steps:
      - name: ci/check-server-image
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          SERVER_EDITION: ${{ inputs.server_edition }}
          SERVER_IMAGE_REPO: ${{ inputs.server_image_repo }}
          SERVER_IMAGE_TAG: ${{ inputs.server_image_tag }}
          REPORT_TYPE: ${{ inputs.report_type }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          POLL_MINUTES: "5"
          INTERVAL_SECONDS: "30"
        run: |
          set -euo pipefail
          REGISTRY_URL="${REGISTRY_URL:-https://registry-1.docker.io}"
          AUTH_URL="${AUTH_URL:-https://auth.docker.io}"

          case "$SERVER_EDITION" in
            enterprise) NAME=mattermost-enterprise-edition ;;
            fips) NAME=mattermost-enterprise-fips-edition ;;
            team) NAME=mattermost-team-edition ;;
            *) echo "::error::server_edition must be enterprise, fips or team, not '${SERVER_EDITION}'"; exit 1 ;;
          esac
          if ! [[ "$SERVER_IMAGE_REPO" =~ ^[a-z0-9._-]+$ && "$SERVER_IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ && "$COMMIT_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Invalid image repository '${SERVER_IMAGE_REPO}', tag '${SERVER_IMAGE_TAG}' or commit '${COMMIT_SHA}'"
            exit 1
          fi
          case "$REPORT_TYPE" in
            MASTER) SUFFIX=/master ;;
            RELEASE) SUFFIX=/release ;;
            RELEASE_CUT) SUFFIX=/release-cut ;;
            *) SUFFIX="" ;;
          esac
          REPOSITORY_PATH="${SERVER_IMAGE_REPO}/${NAME}"
          IMAGE="${REPOSITORY_PATH}:${SERVER_IMAGE_TAG}"
          ACCEPT="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"

          # The registry's HTTP status for the manifest, or 000 when it cannot be reached.
          # A HEAD request does not count against Docker Hub's pull rate limit.
          probe() {
            local token code
            token=$(curl -fsS --max-time 20 "${AUTH_URL}/token?service=registry.docker.io&scope=repository:${REPOSITORY_PATH}:pull" | jq -er .token) || {
              echo 000
              return
            }
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -I \
              -H "Authorization: Bearer ${token}" -H "Accept: ${ACCEPT}" \
              "${REGISTRY_URL}/v2/${REPOSITORY_PATH}/manifests/${SERVER_IMAGE_TAG}") || code=000
            echo "$code"
          }

          # Best effort: the job's result, not this status, is what gates the lanes.
          publish() {
            timeout --kill-after=10s 30s gh api --method POST "repos/${REPOSITORY}/statuses/${COMMIT_SHA}" --silent \
              -f state="$1" -f context="server-image/${SERVER_EDITION}${SUFFIX}" \
              -f description="${2:0:140}" -f target_url="$RUN_URL" ||
              echo "::warning::Could not publish the server-image/${SERVER_EDITION}${SUFFIX} status"
          }

          start=$(date +%s)
          deadline=$((start + POLL_MINUTES * 60))
          checks=0
          last_answer=""
          while :; do
            code=$(probe)
            checks=$((checks + 1))
            case "$code" in
              200)
                echo "${IMAGE} is published."
                publish success "${IMAGE} is published"
                exit 0
                ;;
              404)
                last_answer=missing
                echo "${IMAGE} is not published."
                ;;
              *)
                last_answer=""
                echo "Docker Hub answered ${code} for ${IMAGE}."
                ;;
            esac
            now=$(date +%s)
            [ "$now" -lt "$deadline" ] || break
            sleep "$INTERVAL_SECONDS"
          done

          if [ "$last_answer" = missing ]; then
            waited="$(((now - start) / 60))m $(((now - start) % 60))s"
            message="${IMAGE} is not on Docker Hub: still missing after ${waited} (${checks} checks, limit ${POLL_MINUTES} min). No E2E lane for this edition started. The pipeline that builds and pushes this image has to deliver it on time; fix it there, then re-run. E2E will not wait longer."
            echo "::error title=Server image not available::${message}"
            echo "### Server image not available"$'\n\n'"${message}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            publish failure "Not available after ${waited}: ${IMAGE}; fix its image build, then re-run"
            exit 1
          fi
          # A Docker Hub outage is not a missing image: the lanes start and their own pulls report it.
          echo "::warning title=Server image not verified::Docker Hub could not be checked for ${IMAGE}; the E2E workers will try to pull it."
          publish success "Docker Hub unreachable; ${IMAGE} not verified"
