---
# Gate for an E2E lane whose server image may be pushed after the lane is dispatched (the FIPS image).
# It runs as its own job before the lane, so a missing image fails here, clearly, instead of every worker's pull.
name: Wait for server image
on:
  workflow_call:
    inputs:
      server_image:
        type: string
        required: true
        description: "Image reference, <namespace>/<name>:<tag> on Docker Hub"

permissions: {}

jobs:
  wait-for-server-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: ci/checkout-actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions/wait-for-server-image
          fetch-depth: 1
      - name: ci/wait-for-server-image
        uses: ./.github/actions/wait-for-server-image
        with:
          image: ${{ inputs.server_image }}
