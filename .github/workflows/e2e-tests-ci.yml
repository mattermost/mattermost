---
name: E2E Tests (pull request)
on:
  # Argo Events Trigger (automated):
  #   - Triggered by: Enterprise CI/docker-image status check (success)
  #   - Payload: { ref: "<branch>", inputs: { commit_sha: "<sha>" } }
  #   - Uses commit-specific docker image
  #   - Checks for relevant file changes before running tests
  #
  # Manual Trigger:
  #   - Enter PR number only - commit SHA is resolved automatically from PR head
  #   - Uses commit-specific docker image
  #   - E2E tests always run (no file change check)
  #
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test (for manual triggers)"
        type: string
        required: false
      commit_sha:
        description: "Commit SHA to test (for Argo Events)"
        type: string
        required: false

permissions: {}

jobs:
  # Shadow reports only. The existing check-changes and E2E dispatch jobs stay independent.
  impact-gate-advisory:
    needs: resolve-pr
    if: needs.resolve-pr.outputs.PR_NUMBER != ''
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: ci/freeze-advisory-inputs
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.PR_NUMBER }}
          EXPECTED_HEAD: ${{ needs.resolve-pr.outputs.COMMIT_SHA }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          PR_DATA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          HEAD_SHA=$(jq -er '.head.sha' <<< "$PR_DATA")
          BASE_SHA=$(jq -er '.base.sha' <<< "$PR_DATA")
          [[ "$HEAD_SHA" = "$EXPECTED_HEAD" ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: ci/checkout-reviewed-planner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: yasserfaraazkhan/impact-gate
          ref: 41657f86630a10ad048f0cf544cfdd109a1d3923
          path: impact-gate-planner
          persist-credentials: false

      - name: ci/checkout-advisory-source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.identity.outputs.head_sha }}
          fetch-depth: 0
          path: impact-gate-source
          persist-credentials: false

      - name: ci/setup-advisory-node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"

      - name: ci/build-reviewed-planner
        working-directory: impact-gate-planner
        run: |
          set -euo pipefail
          env -i PATH="$PATH" NPM_CONFIG_USERCONFIG=/dev/null NPM_CONFIG_CACHE="$RUNNER_TEMP/impact-gate-npm" \
            npm ci --ignore-scripts --no-audit --no-fund
          env -i PATH="$PATH" NPM_CONFIG_USERCONFIG=/dev/null npm run build:cjs

      - name: ci/plan-existing-specs
        env:
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          HEAD_SHA: ${{ steps.identity.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C impact-gate-source rev-parse HEAD)" = "$HEAD_SHA" ]]
          [[ "$(git -C impact-gate-planner rev-parse HEAD)" = "41657f86630a10ad048f0cf544cfdd109a1d3923" ]]
          mkdir -p impact-gate-reports
          for SUITE in cypress-full-enterprise playwright-full-enterprise; do
            REPORT="impact-gate-reports/${SUITE}.json"
            env -i PATH="$PATH" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
              node impact-gate-planner/dist/cli.js plan --advisory --json \
              --config impact-gate-planner/examples/mattermost/advisory.config.json \
              --path "$GITHUB_WORKSPACE/impact-gate-source" --since "$BASE_SHA" --suite "$SUITE" > "$REPORT"
            jq --arg sourceRunId "github:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
              '.sourceRunId = $sourceRunId' "$REPORT" > "${REPORT}.tmp"
            mv "${REPORT}.tmp" "$REPORT"
          done

      - name: ci/upload-advisory-plans
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: impact-gate-advisory-41657f8-${{ github.run_id }}-${{ github.run_attempt }}
          path: impact-gate-reports/*.json
          if-no-files-found: error
          retention-days: 30

  resolve-pr:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      PR_NUMBER: "${{ steps.resolve.outputs.PR_NUMBER }}"
      COMMIT_SHA: "${{ steps.resolve.outputs.COMMIT_SHA }}"
      BASE_SHA: "${{ steps.resolve.outputs.BASE_SHA }}"
      SERVER_IMAGE_TAG: "${{ steps.image-ref.outputs.image_tag }}"
      HEAD_REF: "${{ steps.resolve.outputs.HEAD_REF }}"
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0

      - name: ci/setup-scope-node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
      - name: ci/resolve-pr-and-commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: node .github/scripts/e2e-resolve-pr.mjs

      - name: ci/check-e2e-test-only
        if: steps.resolve.outputs.PR_NUMBER != ''
        id: e2e-check
        uses: ./.github/actions/check-e2e-test-only
        with:
          base_sha: ${{ steps.resolve.outputs.BASE_SHA }}
          head_sha: ${{ steps.resolve.outputs.COMMIT_SHA }}
          pr_number: ${{ steps.resolve.outputs.PR_NUMBER }}

      - name: ci/select-demo-image
        if: steps.resolve.outputs.PR_NUMBER != ''
        id: image-ref
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.PR_NUMBER }}
          COMMIT_SHA: ${{ steps.resolve.outputs.COMMIT_SHA }}
          DEFAULT_IMAGE_TAG: ${{ steps.e2e-check.outputs.image_tag }}
        run: |
          # PR 38356 demonstrates immutable failure evidence. Its image must
          # come from this resolved head's completed Enterprise CI build.
          if [ "$PR_NUMBER" = "38356" ]; then
            echo "image_tag=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${DEFAULT_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          fi


  check-changes:
    permissions:
      contents: read
      pull-requests: read
    needs: resolve-pr
    if: needs.resolve-pr.outputs.PR_NUMBER != ''
    runs-on: ubuntu-24.04
    outputs:
      should_run: "${{ steps.check.outputs.should_run }}"
      should_run_fips: "${{ steps.check.outputs.should_run_fips }}"
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Execute the policy from the workflow revision, never the tested PR.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: ci/setup-scope-node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
      - name: ci/check-relevant-changes
        id: check
        env:
          BASE_SHA: ${{ needs.resolve-pr.outputs.BASE_SHA }}
          COMMIT_SHA: ${{ needs.resolve-pr.outputs.COMMIT_SHA }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ needs.resolve-pr.outputs.HEAD_REF }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "$BASE_SHA" "$COMMIT_SHA"
          ARGS=(--base "$BASE_SHA" --head "$COMMIT_SHA" --head-ref "$HEAD_REF")
          if [ -n "$INPUT_PR_NUMBER" ]; then ARGS+=(--manual); fi
          node .github/scripts/e2e-change-scope.mjs "${ARGS[@]}"

  e2e-cypress:
    needs:
      - resolve-pr
      - check-changes
    if: needs.resolve-pr.outputs.PR_NUMBER != ''
    permissions:
      contents: read
      statuses: write
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/e2e-tests-cypress.yml
    with:
      commit_sha: "${{ needs.resolve-pr.outputs.COMMIT_SHA }}"
      server: "onprem"
      server_image_tag: "${{ needs.resolve-pr.outputs.SERVER_IMAGE_TAG }}"
      enable_reporting: true
      report_type: "PR"
      pr_number: "${{ needs.resolve-pr.outputs.PR_NUMBER }}"
      should_run: "${{ needs.check-changes.outputs.should_run }}"
    secrets:
      MM_LICENSE: "${{ secrets.MM_E2E_TEST_LICENSE_ONPREM_ENT }}"
      AUTOMATION_DASHBOARD_URL: "${{ secrets.MM_E2E_AUTOMATION_DASHBOARD_URL }}"
      AUTOMATION_DASHBOARD_TOKEN: "${{ secrets.MM_E2E_AUTOMATION_DASHBOARD_TOKEN }}"
      PUSH_NOTIFICATION_SERVER: "${{ secrets.MM_E2E_PUSH_NOTIFICATION_SERVER }}"
      REPORT_WEBHOOK_URL: "${{ secrets.MM_E2E_REPORT_WEBHOOK_URL }}"
      CWS_URL: "${{ secrets.MM_E2E_CWS_URL }}"
      CWS_EXTRA_HTTP_HEADERS: "${{ secrets.MM_E2E_CWS_EXTRA_HTTP_HEADERS }}"

  e2e-playwright:
    needs:
      - resolve-pr
      - check-changes
    if: needs.resolve-pr.outputs.PR_NUMBER != ''
    permissions:
      contents: read
      statuses: write
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/e2e-tests-playwright.yml
    with:
      commit_sha: "${{ needs.resolve-pr.outputs.COMMIT_SHA }}"
      server: "onprem"
      server_image_tag: "${{ needs.resolve-pr.outputs.SERVER_IMAGE_TAG }}"
      enable_reporting: true
      report_type: "PR"
      pr_number: "${{ needs.resolve-pr.outputs.PR_NUMBER }}"
      should_run: "${{ needs.check-changes.outputs.should_run }}"
    secrets:
      MM_LICENSE: "${{ secrets.MM_E2E_TEST_LICENSE_ONPREM_ENT }}"
      REPORT_WEBHOOK_URL: "${{ secrets.MM_E2E_REPORT_WEBHOOK_URL }}"

  # Enterprise FIPS Edition
  e2e-cypress-fips:
    needs:
      - resolve-pr
      - check-changes
    if: needs.resolve-pr.outputs.PR_NUMBER != '' && needs.check-changes.outputs.should_run_fips == 'true'
    permissions:
      contents: read
      statuses: write
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/e2e-tests-cypress.yml
    with:
      commit_sha: "${{ needs.resolve-pr.outputs.COMMIT_SHA }}"
      server: "onprem"
      server_edition: fips
      server_image_tag: "${{ needs.resolve-pr.outputs.SERVER_IMAGE_TAG }}"
      enable_reporting: true
      report_type: "PR"
      pr_number: "${{ needs.resolve-pr.outputs.PR_NUMBER }}"
    secrets:
      MM_LICENSE: "${{ secrets.MM_E2E_TEST_LICENSE_ONPREM_ENT }}"
      AUTOMATION_DASHBOARD_URL: "${{ secrets.MM_E2E_AUTOMATION_DASHBOARD_URL }}"
      AUTOMATION_DASHBOARD_TOKEN: "${{ secrets.MM_E2E_AUTOMATION_DASHBOARD_TOKEN }}"
      PUSH_NOTIFICATION_SERVER: "${{ secrets.MM_E2E_PUSH_NOTIFICATION_SERVER }}"
      REPORT_WEBHOOK_URL: "${{ secrets.MM_E2E_REPORT_WEBHOOK_URL }}"
      CWS_URL: "${{ secrets.MM_E2E_CWS_URL }}"
      CWS_EXTRA_HTTP_HEADERS: "${{ secrets.MM_E2E_CWS_EXTRA_HTTP_HEADERS }}"

  e2e-playwright-fips:
    needs:
      - resolve-pr
      - check-changes
    if: needs.resolve-pr.outputs.PR_NUMBER != '' && needs.check-changes.outputs.should_run_fips == 'true'
    permissions:
      contents: read
      statuses: write
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/e2e-tests-playwright.yml
    with:
      commit_sha: "${{ needs.resolve-pr.outputs.COMMIT_SHA }}"
      server: "onprem"
      server_edition: fips
      server_image_tag: "${{ needs.resolve-pr.outputs.SERVER_IMAGE_TAG }}"
      enable_reporting: true
      report_type: "PR"
      pr_number: "${{ needs.resolve-pr.outputs.PR_NUMBER }}"
    secrets:
      MM_LICENSE: "${{ secrets.MM_E2E_TEST_LICENSE_ONPREM_ENT }}"
      REPORT_WEBHOOK_URL: "${{ secrets.MM_E2E_REPORT_WEBHOOK_URL }}"
