---
# E2E autofix on merge. After each master E2E run, the toolkit's e2e-master-watch action
# decides what needs a fix: Playwright specs that keep failing (broken twice in a row, or
# flaky), and the agent's own open PRs that no longer merge into master. This workflow
# sends each request to the "E2E Autofix" Cursor automation, which reproduces the
# failure, fixes it, verifies the fix several times and opens one PR (or merges master
# into its PR). The agent's instructions are in .cursor/automations/e2e-autofix.md.
#
# Without the webhook secrets it only writes the job summary. Repository owners can turn
# it off by setting the variable E2E_ENABLE_AUTOFIX to "false".
name: E2E Tests (autofix on merge)
on:
  workflow_run:
    workflows: ["E2E Tests (master/release - merge)"]
    types: [completed]

permissions: {}

concurrency:
  group: e2e-tests-autofix-on-merge
  cancel-in-progress: false

jobs:
  autofix:
    if: github.event.workflow_run.conclusion != 'cancelled' && vars.E2E_ENABLE_AUTOFIX != 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      # Reads the run's server image tag from the commit statuses the E2E run posted.
      statuses: read
    steps:
      # The run reports which branch it tested; runs of release branches are ignored.
      - name: ci/e2e-autofix-plan
        id: plan
        uses: mattermost/mattermost-test-automation-toolkit/actions/e2e-master-watch@6d125810b8c391dbca2352010328e3f989424457 # actions/e2e-master-watch
        with:
          repository: ${{ github.repository }}
          gh-run-id: ${{ github.event.workflow_run.id }}
          gh-run-attempt: ${{ github.event.workflow_run.run_attempt }}
          # Playwright only: the agent's instructions cover reproducing Playwright specs, not Cypress.
          suites: >-
            [{"name": "playwright-full-enterprise-master", "test_root": "e2e-tests/playwright/specs"},
             {"name": "playwright-full-fips-master", "test_root": "e2e-tests/playwright/specs"}]
          github-token: ${{ github.token }}
          label: e2e-autofix
          extra-labels: AI/babysit
          instructions: .cursor/automations/e2e-autofix.md
          # Master stays red until a break is fixed: send every break at once (10 is a safety limit).
          # Flaky specs share a daily budget, most-flaky first.
          max-broken-per-run: 10
          max-flaky-per-day: 6
          # A break whose suspect commits overlap one already sent waits this long for that agent's PR.
          cause-hold-hours: 4

      # Requests carry test errors and commit titles: they go through env and stdin, never into the script.
      # Each fix request gets the server images the master run tested (server_images), read from the
      # "image_tag:<tag>" its Playwright commit statuses carry, so the agent reproduces on the same build.
      - name: ci/e2e-autofix-send
        id: send
        if: steps.plan.outputs.count != '0'
        env:
          REQUESTS: ${{ steps.plan.outputs.requests }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.CURSOR_E2E_AUTOFIX_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.CURSOR_E2E_AUTOFIX_WEBHOOK_KEY }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_KEY" ]; then
            echo "No webhook configured: the requests are only in the job summary."
            echo "results=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image_tag_of() {
            gh api "repos/$REPOSITORY/commits/$1/statuses?per_page=100" --jq \
              '[.[] | select(.context | startswith("e2e-test/playwright-full/")) | .description // ""
                | capture("image_tag:(?<t>[A-Za-z0-9._-]+)")?.t] | first // empty' 2>/dev/null || true
          }
          results='[]'
          while IFS= read -r request; do
            id=$(jq -r '.id' <<<"$request")
            payload=$(jq -c '.payload' <<<"$request")
            commit=$(jq -r '.commit // empty' <<<"$payload")
            tag=""
            if [[ "$commit" =~ ^[0-9a-f]{7,40}$ ]]; then
              tag=$(image_tag_of "$commit")
            fi
            # A per-commit build (<mattermost sha>_<enterprise sha>), never a moving tag such as master.
            if [[ "$tag" =~ ^[0-9a-f]{7}_[0-9a-f]{7}$ ]]; then
              payload=$(jq -c --arg tag "$tag" '. + {server_image_tag: $tag, server_images: {
                enterprise: "mattermostdevelopment/mattermost-enterprise-edition:\($tag)",
                fips: "mattermostdevelopment/mattermost-enterprise-fips-edition:\($tag)"}}' <<<"$payload")
            elif [ -n "$commit" ]; then
              echo "$id: no per-commit image_tag in the Playwright statuses of $commit (${tag:-none}); sent without server_images"
            fi
            status=$(printf '%s' "$payload" | curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -X POST "$WEBHOOK_URL" -H "Authorization: Bearer $WEBHOOK_KEY" -H 'Content-Type: application/json' \
              --data-binary @-) || true
            echo "$id: HTTP ${status:-000}"
            results=$(jq -c --arg id "$id" --arg status "${status:-0}" '. + [{id: $id, status: ($status | tonumber)}]' <<<"$results")
          done < <(jq -c '.[]' <<<"$REQUESTS")
          echo "results=$results" >> "$GITHUB_OUTPUT"

      # Runs on every trunk run, even one that sent nothing, to keep the record of sent requests alive.
      - name: ci/e2e-autofix-record
        if: always() && steps.plan.outcome == 'success'
        uses: mattermost/mattermost-test-automation-toolkit/actions/e2e-master-watch/record@6d125810b8c391dbca2352010328e3f989424457 # actions/e2e-master-watch/record
        with:
          results: ${{ steps.send.outputs.results || '[]' }}
