---
name: E2E Tests - Cypress Template (test system io dispatch)

# Delegates Cypress spec dispatch + reporting to test system io.
# Authenticates via GitHub Actions OIDC; calling job MUST grant
# `id-token: write`.

on:
  workflow_call:
    inputs:
      test_type:
        description: "Type of test run (smoke or full)"
        type: string
        required: true
      workers:
        description: "Number of parallel test system io dispatch workers"
        type: number
        required: false
        default: 40
      enabled_docker_services:
        description: "Space-separated list of docker services to enable"
        type: string
        required: false
        default: "postgres inbucket minio openldap elasticsearch keycloak"

      commit_sha:
        type: string
        required: true
      autofix_mode:
        type: string
        required: false
        default: ""
      branch:
        type: string
        required: true
      build_id:
        type: string
        required: true
      server_image_tag:
        description: "Server image tag (e.g., master or short SHA)"
        type: string
        required: true
      server:
        type: string
        required: false
        default: onprem
      server_edition:
        description: "Server edition: enterprise (default), fips, or team"
        type: string
        required: false
        default: enterprise
      server_image_repo:
        description: "Docker registry: mattermostdevelopment (default) or mattermost"
        type: string
        required: false
        default: mattermostdevelopment
      server_image_aliases:
        description: "Comma-separated alias tags for description"
        type: string
        required: false

      enable_reporting:
        type: boolean
        required: false
        default: false
      report_type:
        type: string
        required: false
      ref_branch:
        type: string
        required: false
      pr_number:
        type: string
        required: false
      context_name:
        description: "GitHub commit status context name"
        type: string
        required: true

      cypress_stage:
        description: "Comma-separated `// Stage:` tags; spec must share at least one. Empty disables filter."
        type: string
        required: false
        default: "@prod"
      cypress_include_group:
        description: "Comma-separated `// Group:` tags; spec must share at least one. Empty disables filter."
        type: string
        required: false
        default: ""
      cypress_exclude_group:
        description: "Comma-separated `// Group:` tags; spec dropped if it shares any."
        type: string
        required: false
        default: "@te_only,@cloud_only,@high_availability"
      cypress_skip_on:
        description: "Comma-separated active-env tag(s); spec dropped if its `// Skip:` line shares any."
        type: string
        required: false
        default: "@headless"
      cypress_sort_first:
        description: "Comma-separated `// Group:` tags; matching specs dispatch first."
        type: string
        required: false
        default: "@compliance_export,@elasticsearch,@ldap_group,@ldap"
      cypress_sort_last:
        description: "Comma-separated `// Group:` tags; matching specs dispatch last."
        type: string
        required: false
        default: "@saml,@keycloak,@plugin,@plugins_uninstall,@mfa,@license_removal"
      retest_on_fail:
        description: "Re-dispatch failed dispatch units once (whole-spec retry, on top of cypress.config retries)"
        type: boolean
        required: false
        default: true

    secrets:
      MM_LICENSE:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      AUTOMATION_DASHBOARD_URL:
        required: false
      AUTOMATION_DASHBOARD_TOKEN:
        required: false
      PUSH_NOTIFICATION_SERVER:
        required: false
      REPORT_WEBHOOK_URL:
        required: false
      CWS_URL:
        required: false
      CWS_EXTRA_HTTP_HEADERS:
        required: false
      GH_TOKEN:
        required: false

# Callers must grant: contents: read, statuses: write, id-token: write
permissions:
  contents: read
  statuses: write
  id-token: write

env:
  SERVER_IMAGE: "${{ inputs.server_image_repo }}/${{ inputs.server_edition == 'fips' && 'mattermost-enterprise-fips-edition' || inputs.server_edition == 'team' && 'mattermost-team-edition' || 'mattermost-enterprise-edition' }}:${{ inputs.server_image_tag }}"

jobs:
  prepare-run:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      statuses: write
    outputs:
      composite-identity-json: ${{ steps.composite-identity.outputs.composite-identity-json }}
      workers-matrix: ${{ steps.matrix.outputs.workers }}
      start_time: ${{ steps.matrix.outputs.start_time }}
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: ci/composite-identity
        id: composite-identity
        env:
          CONTEXT_NAME: ${{ inputs.context_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MM_BRANCH: ${{ inputs.branch }}
          MM_SHA: ${{ inputs.commit_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # Derive the test-system-io run name from the GitHub commit-status
          # context: drop the `e2e-test/` prefix (the framework name already
          # implies E2E in the dashboard) and swap remaining `/` for `-` so
          # the dashboard URL is path-safe. The commit-status context itself
          # stays unchanged elsewhere — branch protection rules depend on it.
          NAME="${CONTEXT_NAME#e2e-test/}"
          NAME="${NAME//\//-}"
          # gh_pr_number is optional; include it only when present.
          if [ -n "$PR_NUMBER" ]; then
            COMPOSITE_IDENTITY=$(jq -nc \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg sha "${MM_SHA}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg name "${NAME}" \
              --arg attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg branch "${MM_BRANCH}" \
              --arg pr "${PR_NUMBER}" \
              '{repository:$repo, commit_sha:$sha, gh_run_id:$run_id, name:$name, gh_run_attempt:$attempt, branch:$branch, gh_pr_number:$pr}')
          else
            COMPOSITE_IDENTITY=$(jq -nc \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg sha "${MM_SHA}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg name "${NAME}" \
              --arg attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg branch "${MM_BRANCH}" \
              '{repository:$repo, commit_sha:$sha, gh_run_id:$run_id, name:$name, gh_run_attempt:$attempt, branch:$branch}')
          fi
          echo "composite-identity-json=${COMPOSITE_IDENTITY}" >> $GITHUB_OUTPUT
      - name: ci/matrix
        id: matrix
        env:
          INPUT_WORKERS: ${{ inputs.workers }}
        run: |
          echo "workers=$(jq -nc --argjson n "${INPUT_WORKERS}" '[range(1; $n+1)]')" >> $GITHUB_OUTPUT
          echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

  # Build the Cypress deps once and hand them to the workers as a run-scoped
  # artifact.
  prep-deps:
    name: prep-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      # Provides the @mattermost/eslint-plugin target the cypress install
      # symlinks to.
      - name: ci/setup-webapp-node-modules
        uses: ./.github/actions/webapp-setup
      # Read-only restore of the registry cache warmed daily from master, so the
      # install below refetches as little as possible.
      - name: ci/restore-npm-cache
        uses: ./.github/actions/restore-e2e-npm-cache
      # The postinstall downloads the Cypress binary to ~/.cache/Cypress rather
      # than into node_modules, which is why the artifact carries both.
      - name: ci/install-cypress-deps
        working-directory: e2e-tests/cypress
        run: npm ci
      - name: ci/pack-cypress-deps
        uses: ./.github/actions/pack-cypress-deps
        with:
          fips: ${{ inputs.server_edition == 'fips' }}

  # Register the Test System IO run AFTER prep-deps so workers reach
  # dispatch-run within Test System IO's inactivity window.
  dispatch-begin:
    runs-on: ubuntu-24.04
    needs: [prepare-run, prep-deps]
    permissions:
      contents: read
      id-token: write
      statuses: write
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: ci/dispatch-begin
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-dispatch-begin@17daaac223e96e89ca82b9a7ee54f45e146a0967 # 2026-09-03, mattermost-test-system-io#101
        with:
          # Staging TSIO is opt-in via repo variable, so a demo cannot leave
          # production runs pointed at staging after the fact.
          use-staging: ${{ vars.E2E_TRIAGE_TSIO_PRODUCTION != 'true' }}
          framework: cypress
          repo-dir: ${{ github.workspace }}
          composite-identity: ${{ needs.prepare-run.outputs.composite-identity-json }}
          total-reports-expected: ${{ inputs.workers }}
          # W9 — see the playwright template for why this exists.
          environment-metadata: |
            {
              "server_edition": "${{ inputs.server_edition || 'enterprise' }}",
              "server": "${{ inputs.server }}",
              "server_image_tag": "${{ inputs.server_image_tag }}",
              "testcontainers": "false"
            }
          retest-on-fail: ${{ inputs.retest_on_fail }}
          cypress-stage: ${{ inputs.cypress_stage }}
          cypress-include-group: ${{ inputs.cypress_include_group }}
          cypress-exclude-group: ${{ inputs.cypress_exclude_group }}
          cypress-skip-on: ${{ inputs.cypress_skip_on }}
          cypress-sort-first: ${{ inputs.cypress_sort_first }}
          cypress-sort-last: ${{ inputs.cypress_sort_last }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-status-context: ${{ inputs.context_name }}
          image-tag: ${{ inputs.server_image_tag }}
          image-aliases: ${{ inputs.server_image_aliases }}

  workers:
    name: dispatch-run-${{ matrix.worker_index }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [prepare-run, dispatch-begin]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        worker_index: ${{ fromJSON(needs.prepare-run.outputs.workers-matrix) }}
    env:
      COMPOSITE_IDENTITY: ${{ needs.prepare-run.outputs.composite-identity-json }}
      SERVER: "${{ inputs.server }}"
      MM_LICENSE: "${{ secrets.MM_LICENSE }}"
      ENABLED_DOCKER_SERVICES: "${{ inputs.enabled_docker_services }}"
      TEST: cypress
      # The dispatch adapter invokes `npx cypress run` directly (no
      # cross-env), so pin TZ here — several specs assume UTC.
      TZ: Etc/UTC
      BRANCH: "${{ inputs.branch }}"
      BUILD_ID: "${{ inputs.build_id }}"
      CI_BASE_URL: "${{ inputs.test_type }}-test-${{ matrix.worker_index }}"
      CYPRESS_pushNotificationServer: "${{ secrets.PUSH_NOTIFICATION_SERVER }}"
      CWS_URL: "${{ secrets.CWS_URL }}"
      CWS_EXTRA_HTTP_HEADERS: "${{ secrets.CWS_EXTRA_HTTP_HEADERS }}"
    steps:
      - name: ci/checkout-actions
        # Sparse-checkout just .github/actions from the triggering ref (master)
        # so the composite action below is available before the full checkout
        # overwrites the workspace with inputs.commit_sha.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true
      - name: ci/runner-prep-for-openldap
        uses: ./.github/actions/runner-prep-openldap
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: ci/setup-webapp-node-modules
        uses: ./.github/actions/webapp-setup
        with:
          read-only: "true"
      # prep-deps built these; it is an ancestor of this job via dispatch-begin,
      # so the artifact is always present by now.
      - name: ci/reuse-cypress-deps
        uses: ./.github/actions/unpack-cypress-deps
        with:
          fips: ${{ inputs.server_edition == 'fips' }}
      - name: ci/cloud-init
        working-directory: e2e-tests
        run: make cloud-init
      - name: ci/start-server
        working-directory: e2e-tests
        run: make start-server
      - name: ci/dispatch-run
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-dispatch-run@1631d8fcea24f4545a0b3b7f77e41c2fe0be4418
        with:
          use-staging: ${{ vars.E2E_TRIAGE_TSIO_PRODUCTION != 'true' }}
          framework: cypress
          composite-identity: ${{ needs.prepare-run.outputs.composite-identity-json }}
          repo-dir: ${{ github.workspace }}
          artifacts-root: ${{ github.workspace }}/worker-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-job-name: dispatch-run-${{ matrix.worker_index }}
      - name: ci/cloud-teardown
        if: always()
        working-directory: e2e-tests
        run: make cloud-teardown
      - name: ci/upload-debug-artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cypress-${{ inputs.test_type }}-${{ inputs.server_edition }}-debug-${{ matrix.worker_index }}
          path: |
            e2e-tests/cypress/logs/
            e2e-tests/cypress/results/
            e2e-tests/cypress/tests/screenshots/
            worker-artifacts/
          retention-days: 5
          if-no-files-found: ignore

  report:
    runs-on: ubuntu-24.04
    needs: [prepare-run, dispatch-begin, workers]
    if: always()
    permissions:
      contents: read
      id-token: write
      statuses: write
    outputs:
      commit_status_description: ${{ steps.summary.outputs.commit_status_description }}
      webhook_payload: ${{ steps.summary.outputs.webhook_payload }}
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: ci/run-summary
        id: summary
        continue-on-error: true
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-summary@e2d5032cfa71a3ad11b0975b135cd221564f2787
        with:
          use-staging: ${{ vars.E2E_TRIAGE_TSIO_PRODUCTION != 'true' }}
          composite-identity: ${{ needs.prepare-run.outputs.composite-identity-json }}
          framework: cypress
          report-type: ${{ inputs.report_type }}
          image-tag: ${{ inputs.server_image_tag }}
          image-aliases: ${{ inputs.server_image_aliases }}
          server-image: ${{ env.SERVER_IMAGE }}
          pr-number: ${{ inputs.pr_number }}
          ref-branch: ${{ inputs.ref_branch }}
          commit-status-context: ${{ inputs.context_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: ci/publish-webhook
        if: inputs.enable_reporting && env.REPORT_WEBHOOK_URL != ''
        env:
          REPORT_WEBHOOK_URL: ${{ secrets.REPORT_WEBHOOK_URL }}
          PAYLOAD: ${{ steps.summary.outputs.webhook_payload }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$REPORT_WEBHOOK_URL"
      - name: ci/assert-results
        env:
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: |
          [ "$SUMMARY_OUTCOME" = "success" ]

  # Classify failed e2e-test/* checks as flake vs regression via Test System IO.
  # Runs after the summary (which owns the red/green platform check) and rewrites
  # that check: green when every failure cluster is a waived flake, otherwise it
  # stays red with a product-bug vs test-bug annotation. Never reruns tests —
  # cost scales with distinct error signatures, not failure count. Fail closed:
  # anything it cannot safely classify stays red.
  ai-triage:
    runs-on: ubuntu-24.04
    needs: [prepare-run, report]
    if: always() && !cancelled() && vars.E2E_AI_TRIAGE != 'false'
    permissions:
      contents: read
      id-token: write
      statuses: write
    outputs:
      fixable_clusters: ${{ steps.triage.outputs.fixable_clusters }}
      bisect_clusters: ${{ steps.triage.outputs.bisect_clusters }}
    steps:
      - name: ci/ai-flake-triage
        id: triage
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-ai-triage@17daaac223e96e89ca82b9a7ee54f45e146a0967 # 2026-09-03, mattermost-test-system-io#101
        with:
          use-staging: ${{ vars.E2E_TRIAGE_TSIO_PRODUCTION != 'true' }}
          composite-identity: ${{ needs.prepare-run.outputs.composite-identity-json }}
          # History is measured on the real default branch, not the synthetic
          # `pr-N` / `commit-*` dashboard branch this run reported under.
          baseline-branch: ${{ inputs.ref_branch || 'master' }}
          run-type: ${{ inputs.report_type == 'MASTER' && 'MAIN' || (startsWith(inputs.report_type, 'RELEASE') && 'RELEASE' || 'PR') }}
          # The kill switch. Gating is owned here, not by server state — the
          # rollout-phase ladder that used to cap this was removed, so this
          # input is the only thing that decides whether triage may turn a red
          # check green. Default is shadow: an unset or misspelled variable
          # observes rather than gates, and the action fails closed the same
          # way on anything it does not recognise.
          mode: ${{ vars.E2E_TRIAGE_MODE || 'shadow' }}
          # The platform row this template's summary step posted is the signal:
          # triage rewrites it instead of adding a separate ai-triage row.
          original-commit-status-contexts: ${{ inputs.context_name }}
          commit-status-context: e2e-test/ai-triage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-token: ${{ secrets.GH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  # MVP #2 — see e2e-tests-playwright-template.yml. Same-ref `uses:` call
  # (`gh workflow run` cannot resolve PR-only workflows); cypress clusters are
  # currently excluded from bisect targets, so this stays skipped in practice.
  ai-bisect:
    needs: [prepare-run, ai-triage]
    if: >-
      always() && !cancelled() &&
      needs.ai-triage.outputs.bisect_clusters != '' &&
      needs.ai-triage.outputs.bisect_clusters != '[]'
    uses: ./.github/workflows/e2e-tests-bisect.yml
    with:
      clusters: ${{ needs.ai-triage.outputs.bisect_clusters }}
      pr_number: ${{ fromJSON(needs.prepare-run.outputs.composite-identity-json).gh_pr_number }}
    secrets: inherit


  # AI test autofix (see e2e-tests-playwright-template.yml for the rationale):
  # repairs test-bug clusters, pushes to the PR branch with a PAT so the
  # standard pipeline validates the fix. Off unless E2E_AI_TEST_AUTOFIX=push.
  ai-autofix:
    runs-on: ubuntu-24.04
    needs: [prepare-run, ai-triage]
    if: >-
      always() && !cancelled() &&
      inputs.autofix_mode == 'push' &&
      needs.ai-triage.outputs.fixable_clusters != '' &&
      needs.ai-triage.outputs.fixable_clusters != '[]'
    # The fixer pushes and comments with the GH_TOKEN PAT, and records every
    # attempt against the stabilization queue over OIDC — see the playwright
    # template for the permission rationale.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ci/checkout-for-autofix
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: ci/ai-test-autofix
        id: autofix
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-ai-triage@17daaac223e96e89ca82b9a7ee54f45e146a0967 # 2026-09-03, mattermost-test-system-io#101
        with:
          use-staging: ${{ vars.E2E_TRIAGE_TSIO_PRODUCTION != 'true' }}
          composite-identity: ${{ needs.prepare-run.outputs.composite-identity-json }}
          fix-clusters: ${{ needs.ai-triage.outputs.fixable_clusters }}
          pr-branch: ${{ inputs.branch }}
          # A PAT, not GITHUB_TOKEN: GITHUB_TOKEN pushes do not trigger new
          # workflow runs, and the follow-up E2E run IS the fix's validation.
          github-token: ${{ secrets.GH_TOKEN || github.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      # Tests the agent has already failed on three times are not attempted
      # again — they are a human's now, and the per-attempt notes are on the
      # stabilization queue entry. Surfaced here so the run says so out loud
      # rather than leaving it to whoever reads the queue next.
      - name: ci/report-handover
        if: steps.autofix.outputs.needs_human_tests != ''
        env:
          HANDED_OVER: ${{ steps.autofix.outputs.needs_human_tests }}
        run: |
          echo "::notice::handed to a human after repeated agent failures: ${HANDED_OVER}"
          {
            echo "### Handed to a human"
            echo
            echo "The agent has failed three times on each of these; it did not try again."
            echo
            for t in ${HANDED_OVER//,/ }; do echo "- \`${t}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
