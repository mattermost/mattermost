---
name: E2E Tests - Cypress Template (test system io dispatch)

# Delegates Cypress spec dispatch + reporting to test system io.
# Authenticates via GitHub Actions OIDC; calling job MUST grant
# `id-token: write`.

on:
  workflow_call:
    inputs:
      server_image_digest:
        description: 'Optional immutable server image recorded by the clearance policy'
        type: string
        required: false
      verification_only:
        description: 'Preserve original PR statuses while collecting verification evidence'
        type: boolean
        required: false
        default: false
      test_type:
        description: "Type of test run (smoke or full)"
        type: string
        required: true
      workers:
        description: "Number of parallel test system io dispatch workers"
        type: number
        required: false
        default: 40
      enabled_docker_services:
        description: "Space-separated list of docker services to enable"
        type: string
        required: false
        default: "postgres inbucket minio openldap elasticsearch keycloak"

      commit_sha:
        type: string
        required: true
      branch:
        type: string
        required: true
      build_id:
        type: string
        required: true
      server_image_tag:
        description: "Server image tag (e.g., master or short SHA)"
        type: string
        required: true
      server:
        type: string
        required: false
        default: onprem
      server_edition:
        description: "Server edition: enterprise (default), fips, or team"
        type: string
        required: false
        default: enterprise
      server_image_repo:
        description: "Docker registry: mattermostdevelopment (default) or mattermost"
        type: string
        required: false
        default: mattermostdevelopment
      server_image_aliases:
        description: "Comma-separated alias tags for description"
        type: string
        required: false

      enable_reporting:
        type: boolean
        required: false
        default: false
      report_type:
        type: string
        required: false
      ref_branch:
        type: string
        required: false
      pr_number:
        type: string
        required: false
      context_name:
        description: "GitHub commit status context name"
        type: string
        required: true

      cypress_stage:
        description: "Comma-separated `// Stage:` tags; spec must share at least one. Empty disables filter."
        type: string
        required: false
        default: "@prod"
      cypress_include_group:
        description: "Comma-separated `// Group:` tags; spec must share at least one. Empty disables filter."
        type: string
        required: false
        default: ""
      cypress_exclude_group:
        description: "Comma-separated `// Group:` tags; spec dropped if it shares any."
        type: string
        required: false
        default: "@te_only,@cloud_only,@high_availability"
      cypress_skip_on:
        description: "Comma-separated active-env tag(s); spec dropped if its `// Skip:` line shares any."
        type: string
        required: false
        default: "@headless"
      cypress_sort_first:
        description: "Comma-separated `// Group:` tags; matching specs dispatch first."
        type: string
        required: false
        default: "@compliance_export,@elasticsearch,@ldap_group,@ldap"
      cypress_sort_last:
        description: "Comma-separated `// Group:` tags; matching specs dispatch last."
        type: string
        required: false
        default: "@saml,@keycloak,@plugin,@plugins_uninstall,@mfa,@license_removal"
      retest_on_fail:
        description: "Re-dispatch failed dispatch units once (whole-spec retry, on top of cypress.config retries)"
        type: boolean
        required: false
        default: true

    secrets:
      MM_LICENSE:
        required: false
      AUTOMATION_DASHBOARD_URL:
        required: false
      AUTOMATION_DASHBOARD_TOKEN:
        required: false
      PUSH_NOTIFICATION_SERVER:
        required: false
      REPORT_WEBHOOK_URL:
        required: false
      CWS_URL:
        required: false
      CWS_EXTRA_HTTP_HEADERS:
        required: false

# Callers must grant: contents: read, statuses: write, id-token: write
permissions:
  contents: read
  statuses: write
  id-token: write

env:
  SERVER_IMAGE: ${{ inputs.server_image_digest || format('{0}/{1}:{2}', inputs.server_image_repo, inputs.server_edition == 'fips' && 'mattermost-enterprise-fips-edition' || inputs.server_edition == 'team' && 'mattermost-team-edition' || 'mattermost-enterprise-edition', inputs.server_image_tag) }}

jobs:
  prepare-run:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      statuses: write
    outputs:
      composite-identity-json: ${{ steps.composite-identity.outputs.composite-identity-json }}
      workers-matrix: ${{ steps.matrix.outputs.workers }}
      start_time: ${{ steps.matrix.outputs.start_time }}
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: ci/composite-identity
        id: composite-identity
        env:
          CONTEXT_NAME: ${{ inputs.context_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MM_BRANCH: ${{ inputs.branch }}
          MM_SHA: ${{ inputs.commit_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # Derive the test-system-io run name from the GitHub commit-status
          # context: drop the `e2e-test/` prefix (the framework name already
          # implies E2E in the dashboard) and swap remaining `/` for `-` so
          # the dashboard URL is path-safe. The commit-status context itself
          # stays unchanged elsewhere — branch protection rules depend on it.
          NAME="${CONTEXT_NAME#e2e-test/}"
          NAME="${NAME//\//-}"
          # gh_pr_number is optional; include it only when present.
          if [ -n "$PR_NUMBER" ]; then
            COMPOSITE_IDENTITY=$(jq -nc \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg sha "${MM_SHA}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg name "${NAME}" \
              --arg attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg branch "${MM_BRANCH}" \
              --arg pr "${PR_NUMBER}" \
              '{repository:$repo, commit_sha:$sha, gh_run_id:$run_id, name:$name, gh_run_attempt:$attempt, branch:$branch, gh_pr_number:$pr}')
          else
            COMPOSITE_IDENTITY=$(jq -nc \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg sha "${MM_SHA}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg name "${NAME}" \
              --arg attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg branch "${MM_BRANCH}" \
              '{repository:$repo, commit_sha:$sha, gh_run_id:$run_id, name:$name, gh_run_attempt:$attempt, branch:$branch}')
          fi
          echo "composite-identity-json=${COMPOSITE_IDENTITY}" >> $GITHUB_OUTPUT
      - name: ci/matrix
        id: matrix
        env:
          INPUT_WORKERS: ${{ inputs.workers }}
        run: |
          echo "workers=$(jq -nc --argjson n "${INPUT_WORKERS}" '[range(1; $n+1)]')" >> $GITHUB_OUTPUT
          echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

  # Decide how the workers get their deps, and bridge the gap when they can't use
  # the cache. On a hit this job is a checkout and a metadata lookup, and the
  # workers restore the warmed entry directly. On a miss — a PR that changes the
  # cypress lockfile, or a master commit that landed before the warm workflow ran
  # — it builds the deps once and ships them as a run-scoped artifact, until the
  # next warm populates the key.
  prep-deps:
    name: prep-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      cache-hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      # lookup-only: asking whether the key exists costs a metadata call rather
      # than a ~275 MB download. The workers do the real restore.
      - name: ci/probe-cypress-deps
        id: probe
        uses: ./.github/actions/restore-cypress-deps
        with:
          lookup-only: "true"
      # Which transport a run took is otherwise only legible from which steps
      # below were skipped. Reporting the key alongside the verdict is what makes
      # a miss diagnosable: a lockfile or path drift reads as an unexpected key
      # rather than an unexplained miss.
      - name: ci/report-cypress-deps-transport
        env:
          CACHE_HIT: ${{ steps.probe.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.probe.outputs.key }}
        run: |
          if [ "${CACHE_HIT}" = "true" ]; then
            echo "Cypress deps: cache **hit** on \`${CACHE_KEY}\` — workers restore it directly from the Actions cache." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Cypress deps: cache **miss** on \`${CACHE_KEY}\` — installing once and shipping the run-scoped artifact." >> "${GITHUB_STEP_SUMMARY}"
          fi
      # Everything below is the cache-miss path.
      #
      # Provides the @mattermost/eslint-plugin target the cypress install
      # symlinks to.
      - name: ci/setup-webapp-node-modules
        if: steps.probe.outputs.cache-hit != 'true'
        uses: ./.github/actions/webapp-setup
      # Read-only restore of the registry cache warmed daily from master, so the
      # install below refetches as little as possible.
      - name: ci/restore-npm-cache
        if: steps.probe.outputs.cache-hit != 'true'
        uses: ./.github/actions/restore-e2e-npm-cache
      # The postinstall downloads the Cypress binary to ~/.cache/Cypress rather
      # than into node_modules, which is why the artifact carries both.
      - name: ci/install-cypress-deps
        if: steps.probe.outputs.cache-hit != 'true'
        working-directory: e2e-tests/cypress
        run: npm ci
      - name: ci/pack-cypress-deps
        if: steps.probe.outputs.cache-hit != 'true'
        uses: ./.github/actions/pack-cypress-deps
        with:
          fips: ${{ inputs.server_edition == 'fips' }}

  # Register the Test System IO run AFTER prep-deps so workers reach
  # dispatch-run within Test System IO's inactivity window.
  dispatch-begin:
    runs-on: ubuntu-24.04
    needs: [prepare-run, prep-deps]
    permissions:
      contents: read
      id-token: write
      statuses: write
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: ci/dispatch-begin
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-dispatch-begin@d5b2bde060dca0e93091ebc6bd2870dd3f0a26d3 # 2026-09-08, mattermost-test-system-io#114
        with:
          # Keep the evidence/override demo isolated from production TSIO.
          use-staging: ${{ inputs.pr_number == '38356' || vars.E2E_USE_STAGING_TEST_IO_URL != 'false' }}
          framework: cypress
          repo-dir: ${{ github.workspace }}
          post-pending-commit-status: ${{ !inputs.verification_only }}
          composite-identity: ${{ needs.prepare-run.outputs.composite-identity-json }}
          total-reports-expected: ${{ inputs.workers }}
          retest-on-fail: ${{ inputs.retest_on_fail }}
          cypress-stage: ${{ inputs.cypress_stage }}
          cypress-include-group: ${{ inputs.cypress_include_group }}
          cypress-exclude-group: ${{ inputs.cypress_exclude_group }}
          cypress-skip-on: ${{ inputs.cypress_skip_on }}
          cypress-sort-first: ${{ inputs.cypress_sort_first }}
          cypress-sort-last: ${{ inputs.cypress_sort_last }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-status-context: ${{ inputs.context_name }}
          image-tag: ${{ inputs.server_image_tag }}
          image-aliases: ${{ inputs.server_image_aliases }}

  workers:
    name: dispatch-run-${{ matrix.worker_index }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # prep-deps is already an ancestor via dispatch-begin; naming it directly
    # makes its cache-hit output readable here.
    needs: [prepare-run, prep-deps, dispatch-begin]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        worker_index: ${{ fromJSON(needs.prepare-run.outputs.workers-matrix) }}
    env:
      COMPOSITE_IDENTITY: ${{ needs.prepare-run.outputs.composite-identity-json }}
      SERVER: "${{ inputs.server }}"
      MM_LICENSE: "${{ secrets.MM_LICENSE }}"
      ENABLED_DOCKER_SERVICES: "${{ inputs.enabled_docker_services }}"
      TEST: cypress
      # The dispatch adapter invokes `npx cypress run` directly (no
      # cross-env), so pin TZ here — several specs assume UTC.
      TZ: Etc/UTC
      BRANCH: "${{ inputs.branch }}"
      BUILD_ID: "${{ inputs.build_id }}"
      CI_BASE_URL: "${{ inputs.test_type }}-test-${{ matrix.worker_index }}"
      CYPRESS_pushNotificationServer: "${{ secrets.PUSH_NOTIFICATION_SERVER }}"
      CWS_URL: "${{ secrets.CWS_URL }}"
      CWS_EXTRA_HTTP_HEADERS: "${{ secrets.CWS_EXTRA_HTTP_HEADERS }}"
    steps:
      - name: ci/checkout-actions
        # Sparse-checkout just .github/actions from the triggering ref (master)
        # so the composite action below is available before the full checkout
        # overwrites the workspace with inputs.commit_sha.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true
      - name: ci/runner-prep-for-openldap
        uses: ./.github/actions/runner-prep-openldap
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: ci/setup-webapp-node-modules
        uses: ./.github/actions/webapp-setup
        with:
          read-only: "true"
      # Exactly one of the next two steps runs, per prep-deps' probe. The warmed
      # cache is the normal path; the artifact exists only when the probe missed.
      - name: ci/restore-cypress-deps
        if: needs.prep-deps.outputs.cache-hit == 'true'
        uses: ./.github/actions/restore-cypress-deps
        with:
          fail-on-cache-miss: "true"
      - name: ci/reuse-cypress-deps
        if: needs.prep-deps.outputs.cache-hit != 'true'
        uses: ./.github/actions/unpack-cypress-deps
        with:
          fips: ${{ inputs.server_edition == 'fips' }}
      - name: ci/cloud-init
        working-directory: e2e-tests
        run: make cloud-init
      - name: ci/start-server
        working-directory: e2e-tests
        run: make start-server
      # Builds environment_metadata with jq rather than by interpolating into a
      # JSON string literal. See the identical step in
      # e2e-tests-playwright-template.yml for the full rationale: a
      # workflow_call default does not apply to an empty input, and an unquoted
      # interpolation of one produces a document that does not parse — taking
      # every other field down with it rather than degrading to "".
      #
      # Never put MM_LICENSE itself here — this lands in
      # report_groups.environment_metadata, which /api/v1/tests/evidence serves
      # back unauthenticated. license_secret_present is a boolean and says only
      # whether the secret was configured on this runner; it is deliberately
      # NOT named "licensed", because it does not report whether the server was
      # actually licensed.
      - name: ci/resolve-environment-metadata
        id: environment-metadata
        working-directory: e2e-tests/cypress
        env:
          SERVER_EDITION: ${{ inputs.server_edition || 'enterprise' }}
          SERVER: ${{ inputs.server }}
          SERVER_IMAGE: ${{ env.SERVER_IMAGE }}
          SERVER_IMAGE_TAG: ${{ inputs.server_image_tag }}
          SERVER_IMAGE_REPO: ${{ inputs.server_image_repo }}
          ENABLED_DOCKER_SERVICES: ${{ inputs.enabled_docker_services }}
          TEST_TYPE: ${{ inputs.test_type }}
          RETEST_ON_FAIL: ${{ inputs.retest_on_fail }}
          WORKER_INDEX: ${{ matrix.worker_index }}
          LICENSE_SECRET_PRESENT: ${{ secrets.MM_LICENSE != '' }}
        run: |
          set -euo pipefail

          # The digest of the image that actually ran. server_image_tag is very
          # often the mutable "master", and SERVER_IMAGE is computed by a
          # ternary the consumer never sees (server_edition 'fips' resolves to
          # mattermost-enterprise-fips-edition, 'team' to
          # mattermost-team-edition). Without the resolved name and its digest,
          # a reproduction can run against a different binary than the one that
          # failed while believing it matched.
          #
          # Read after ci/start-server, so the image has been pulled.
          # Best-effort throughout: metadata is diagnostic, and losing a whole
          # E2E run over a missing digest is the worse outcome.
          SERVER_IMAGE_DIGEST=""
          if docker image inspect "$SERVER_IMAGE" >/dev/null 2>&1; then
            SERVER_IMAGE_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "$SERVER_IMAGE" 2>/dev/null || true)"
            if [ -z "$SERVER_IMAGE_DIGEST" ]; then
              SERVER_IMAGE_DIGEST="$(docker image inspect --format '{{.Id}}' "$SERVER_IMAGE" 2>/dev/null || true)"
            fi
          fi

          CYPRESS_VERSION="$(npx --no-install cypress --version --component package 2>/dev/null | head -1 || true)"

          METADATA="$(jq -n -c             --arg server_edition "$SERVER_EDITION"             --arg server "$SERVER"             --arg server_image "$SERVER_IMAGE"             --arg server_image_digest "$SERVER_IMAGE_DIGEST"             --arg server_image_tag "$SERVER_IMAGE_TAG"             --arg server_image_repo "$SERVER_IMAGE_REPO"             --arg enabled_docker_services "$ENABLED_DOCKER_SERVICES"             --arg test_type "$TEST_TYPE"             --arg cypress_version "$CYPRESS_VERSION"             --argjson retest_on_fail "${RETEST_ON_FAIL:-null}"             --argjson worker_index "${WORKER_INDEX:-null}"             --argjson license_secret_present "${LICENSE_SECRET_PRESENT:-false}"             '$ARGS.named')"

          echo "metadata=$METADATA" >> "$GITHUB_OUTPUT"
      - name: ci/dispatch-run
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-dispatch-run@d5b2bde060dca0e93091ebc6bd2870dd3f0a26d3 # 2026-09-08, mattermost-test-system-io#114
        with:
          # Keep the evidence/override demo isolated from production TSIO.
          use-staging: ${{ inputs.pr_number == '38356' || vars.E2E_USE_STAGING_TEST_IO_URL != 'false' }}
          framework: cypress
          composite-identity: ${{ needs.prepare-run.outputs.composite-identity-json }}
          repo-dir: ${{ github.workspace }}
          artifacts-root: ${{ github.workspace }}/worker-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-job-name: dispatch-run-${{ matrix.worker_index }}
          # Lets a consumer reproducing a failure (human or automation) start
          # its own server the same way this one ran, instead of guessing at
          # defaults that may not match. Built by ci/resolve-environment-metadata
          # above; see that step for why it is not a JSON string literal.
          environment-metadata: ${{ steps.environment-metadata.outputs.metadata }}
      - name: ci/cloud-teardown
        if: always()
        working-directory: e2e-tests
        run: make cloud-teardown
      - name: ci/upload-debug-artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cypress-${{ inputs.test_type }}-${{ inputs.server_edition }}-debug-${{ matrix.worker_index }}
          path: |
            e2e-tests/cypress/logs/
            e2e-tests/cypress/results/
            e2e-tests/cypress/tests/screenshots/
            worker-artifacts/
          retention-days: 5
          if-no-files-found: ignore

  report:
    runs-on: ubuntu-24.04
    needs: [prepare-run, dispatch-begin, workers]
    if: always()
    permissions:
      contents: read
      id-token: write
      statuses: write
    outputs:
      commit_status_description: ${{ steps.summary.outputs.commit_status_description }}
      webhook_payload: ${{ steps.summary.outputs.webhook_payload }}
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: ci/run-summary
        id: summary
        continue-on-error: true
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-summary@d5b2bde060dca0e93091ebc6bd2870dd3f0a26d3 # 2026-09-08, mattermost-test-system-io#114
        with:
          # Keep the evidence/override demo isolated from production TSIO.
          use-staging: ${{ inputs.pr_number == '38356' || vars.E2E_USE_STAGING_TEST_IO_URL != 'false' }}
          composite-identity: ${{ needs.prepare-run.outputs.composite-identity-json }}
          framework: cypress
          report-type: ${{ inputs.report_type }}
          update-commit-status: ${{ !inputs.verification_only }}
          image-tag: ${{ inputs.server_image_tag }}
          image-aliases: ${{ inputs.server_image_aliases }}
          server-image: ${{ env.SERVER_IMAGE }}
          pr-number: ${{ inputs.pr_number }}
          ref-branch: ${{ inputs.ref_branch }}
          commit-status-context: ${{ inputs.context_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: ci/publish-webhook
        if: inputs.enable_reporting && !inputs.verification_only && env.REPORT_WEBHOOK_URL != ''
        env:
          REPORT_WEBHOOK_URL: ${{ secrets.REPORT_WEBHOOK_URL }}
          PAYLOAD: ${{ steps.summary.outputs.webhook_payload }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$REPORT_WEBHOOK_URL"
      - name: ci/assert-results
        env:
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: |
          [ "$SUMMARY_OUTCOME" = "success" ]
