name: Release Docs - Docker env.example

# Playbook T-5, ESRs only: a draft PR in mattermost/docker setting MATTERMOST_IMAGE_TAG in
# env.example to a new release on an ESR line (CHANGELOG_ESR_VERSIONS), vX.Y.0 or a dot
# release. Never lowers the version. See release-docs-task.yml for modes and settings.

# A release event run's ref is the tag, which can't use the write key in `release-write`, so the
# `trigger` job (release-docs-trigger.yml, no secrets) checks it and starts this workflow on master;
# the task job runs only on master.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v11.7.15'
        required: true
        type: string
      mode:
        description: 'default uses PHASE3_MODE (dry_run unless set to live). dry_run changes nothing; live publishes.'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - dry_run
          - live
      source_event:
        description: 'Set by release-docs-trigger.yml for a release, tag or PR edit; leave empty'
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  trigger:
    if: github.event_name == 'release'
    uses: ./.github/workflows/release-docs-trigger.yml
    with:
      task: docker-env
      workflow: release-docs-docker-env.yml
    permissions:
      contents: read
      actions: write # start this workflow on master

  docker-env:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    concurrency:
      group: release-docs-docker-env-${{ inputs.version }}
      cancel-in-progress: false
    uses: ./.github/workflows/release-docs-task.yml
    with:
      task: docker-env
      version: ${{ inputs.version }}
      mode: ${{ inputs.mode }}
      source_event: ${{ inputs.source_event }}
    secrets: inherit
    permissions:
      contents: read
      actions: read # the changelog runs' sections.json (release-docs)
      issues: read # the vX.Y.0 milestones' due dates (release-docs)
