name: Release Docs PR Check

# Checks the release docs PR (branch release-agent/vX.Y.0/release-docs): the Important Upgrade
# Notes and Deprecated Features pages must not keep their release-agent placeholder or a
# TODO(release-agent) marker, which they do until the confirmed breaking changes are known (the
# release-automation:confirmed-breaking marker in the PR description) and each has wording.
#
# The check fails for that only from T-2: two working days (Monday to Friday) before Release Day,
# the due date of the vX.Y.0 milestone. Before T-2 it passes, with a notice saying when it will
# fail. With no due date on the milestone it fails, since T-2 can't be known.
#
# It runs on every change to the PR (pushes and description edits). A PR that doesn't change still
# has to start failing at T-2, so every weekday the recheck job reruns, for each open release docs
# PR, the latest pull_request run of this workflow for the PR's head commit: a rerun updates the
# check the PR (and a required check) shows, which a workflow_dispatch run would not. Only when
# there is no such run (or it can't be rerun) does it start this workflow on the PR's branch
# (workflow_dispatch, also kept for manual runs) and say so in its summary.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    paths:
      - "docs/main/administration-guide/upgrade/important-upgrade-notes.mdx"
      - "docs/main/product-overview/deprecated-features.mdx"
  schedule:
    - cron: '23 6 * * 1-5'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-docs-pr-check-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Check release docs
    if: >-
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-agent/') && endsWith(github.head_ref, '/release-docs')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release-agent/') && endsWith(github.ref_name, '/release-docs'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read # the vX.Y.0 milestone's due date
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Check
        working-directory: .github/scripts
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m release_docs check release-docs

  recheck:
    name: Recheck open release docs PRs
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write # rerun this workflow's runs, or start it on a PR's branch
      pull-requests: read
    steps:
      - name: Rerun the check on each open release docs PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: release-docs-release-pr-check.yml
        run: |
          # "branch sha" per open release docs PR from this repo; anything else is dropped by the pattern.
          prs="$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq ".[] | select(.head.repo.full_name == \"$REPO\") | \"\(.head.ref) \(.head.sha)\"" \
            | grep -E '^release-agent/v[0-9]+\.[0-9]+\.0/release-docs [0-9a-f]{40}$' || true)"
          if [ -z "$prs" ]; then
            echo "No open release docs PR." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while read -r branch sha; do
            run_id="$(gh api "repos/$REPO/actions/workflows/$WORKFLOW/runs?event=pull_request&head_sha=$sha&per_page=1" \
              --jq '.workflow_runs[0].id // empty' || true)"
            if [ -n "$run_id" ] && gh run rerun "$run_id" --repo "$REPO"; then
              echo "$branch: reran the check's pull_request run $run_id for $sha." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$branch: no pull_request run of the check for $sha could be rerun; started it on the branch" \
                "instead (workflow_dispatch: its result is not shown in the PR's checks)." | tee -a "$GITHUB_STEP_SUMMARY"
              gh workflow run "$WORKFLOW" --repo "$REPO" --ref "$branch"
            fi
          done <<< "$prs"
