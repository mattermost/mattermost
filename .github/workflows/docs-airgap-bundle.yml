name: Docs airgapped bundle

# Builds the offline documentation bundle and smoke-tests it through the real
# `mattermost docs` server, then uploads it so a reviewer can try both entry
# points without installing Node or building the docs themselves.
#
# Scoped to the airgap machinery rather than all of docs/** so ordinary content
# PRs do not pay for a second Docusaurus build; Docs CI already builds the site.

on:
  pull_request:
    paths:
      - "docs/scripts/build-offline-bundle.py"
      - "docs/site/docusaurus.config.ts"
      - "docs/site/package.json"
      - "docs/site/package-lock.json"
      - "docs/site/src/**"
      - "docs/site/static/**"
      - "docs/site/scripts/**"
      - "server/build/release.mk"
      - "server/channels/web/static.go"
      - "server/cmd/mattermost/commands/docs.go"
      - ".github/workflows/docs-airgap-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: docs/site/.nvmrc
          cache: "npm"
          cache-dependency-path: docs/site/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: server/go.mod

      - name: Install docs dependencies
        working-directory: docs/site
        run: npm ci

      - name: Build docs site for /_documentation
        working-directory: docs/site
        run: npm run build
        env:
          BASE_URL: /_documentation/

      - name: Check the bundle loads no external resources
        working-directory: docs/site
        run: npm run check:egress

      - name: Build the bundle
        run: python3 docs/scripts/build-offline-bundle.py docs/site/build mattermost-documentation.tar.gz

      - name: Smoke-test the bundle through `mattermost docs`
        working-directory: server
        run: |
          set -euo pipefail
          # The server builds against the in-tree public module, not the
          # published one, so the workspace has to exist first.
          make setup-go-work
          go build -o ./bin/mattermost ./cmd/mattermost
          ./bin/mattermost docs --dir ../docs/site/build --port 8066 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8066/_documentation/; then
              break
            fi
            sleep 1
          done

          check() {
            local path="$1" want="$2"
            local got
            # --path-as-is so curl does not collapse dot segments for us.
            got=$(curl -s --path-as-is -o /dev/null -w '%{http_code}' "http://127.0.0.1:8066${path}")
            if [ "${got}" != "${want}" ]; then
              echo "FAIL ${path}: expected ${want}, got ${got}"
              exit 1
            fi
            echo "ok   ${path} -> ${got}"
          }

          # An extensionless deep link whose flat <name>.html sits beside a
          # same-named directory. That is the case clean-URL resolution exists
          # for, and the one that breaks if the directory index is tried first.
          build=../docs/site/build
          candidates=$(cd "${build}" && find . -name '*.html' ! -name 'index.html')
          deep=""
          while read -r f; do
            stem="${f#./}"
            stem="${stem%.html}"
            if [ -d "${build}/${stem}" ]; then
              deep="/_documentation/${stem}"
              break
            fi
          done <<< "${candidates}"
          if [ -z "${deep}" ]; then
            echo "FAIL: no flat page shadowed by a sibling directory in the build"
            exit 1
          fi
          echo "discovered clean-URL case: ${deep}"

          check /_documentation/ 200
          check "${deep}" 200

          # Nothing outside the bundle may ever be served. This is a backstop,
          # not the real test of the guard in docsFileSystem: the CLI's
          # ServeMux collapses dot segments before the handler sees them, so
          # containment is asserted directly in static_docs_test.go.
          got=$(curl -s --path-as-is -L -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:8066/_documentation/../../config/config.json")
          if [ "${got}" = "200" ]; then
            echo "FAIL traversal served a file from outside the bundle"
            exit 1
          fi
          echo "ok   traversal contained -> ${got}"

      - name: Upload the bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mattermost-documentation-bundle
          path: mattermost-documentation.tar.gz
          retention-days: 7
          compression-level: 0
