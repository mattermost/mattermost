name: Release cherry-pick labels test

on:
  pull_request:
    paths:
      - '.github/scripts/release_cherrypick/**'
      - '.github/workflows/release-cherry-pick-labels.yml'
      - '.github/workflows/release-cherry-pick-labels-test.yml'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        working-directory: .github/scripts
        run: python3 -m unittest discover -s release_cherrypick/tests -t . -v
