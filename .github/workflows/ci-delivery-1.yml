name: Continuous Integration & Artifact Delivery

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    name: 1. Lint & Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Validate Docker Compose Configuration
        run: docker compose -f docker-compose.yml config

  build:
    name: 2. Build Container Image
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.prep.outputs.image_ref }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image reference (lowercase)
        id: prep
        run: echo "image_ref=${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}:test" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image (local for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.prep.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image as artifact
        run: docker save "${{ steps.prep.outputs.image_ref }}" -o image-test.tar

      - name: Upload image artifact for security scanning
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: image-test.tar
          retention-days: 1

  scan:
    name: 3. Vulnerability Security Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load Docker image
        run: docker load -i image-test.tar

      - name: Scan image with Aqua Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image_ref }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish:
    name: 4. Publish Container Artifact
    needs: [build, scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase image name
        id: prep
        run: echo "image_name=${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image_name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Build & Publish container to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: 5. Deploy to AWS EC2
    needs: publish
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    environment: mattermost-app-production

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::506305355048:role/MattermostGitHubDeploy
          aws-region: us-east-1

      - name: Deploy Mattermost to EC2
        env:
          INSTANCE_ID: i-0931fe9de23859d52
          COMMIT_SHA: ${{ github.sha }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MM_SITE_URL: ${{ vars.MM_SITE_URL }}
          
        run: |
          set -euo pipefail

          # 1. Calculate the image tag published by the previous job
          SHORT_SHA="${COMMIT_SHA:0:7}"
          MATTERMOST_IMAGE="ghcr.io/sespinosab/mattermost:sha-${SHORT_SHA}"

          echo "Deploying image: ${MATTERMOST_IMAGE}"

          # 2. Prepare safely quoted environment variables for the remote script
          printf -v Q_COMMIT_SHA '%q' "$COMMIT_SHA"
          printf -v Q_DB_HOST '%q' "$DB_HOST"
          printf -v Q_DB_PORT '%q' "$DB_PORT"
          printf -v Q_DB_NAME '%q' "$DB_NAME"
          printf -v Q_DB_USER '%q' "$DB_USER"
          printf -v Q_DB_PASSWORD '%q' "$DB_PASSWORD"
          printf -v Q_MM_SITE_URL '%q' "$MM_SITE_URL"
          printf -v Q_MATTERMOST_IMAGE '%q' "$MATTERMOST_IMAGE"

          # 3. Build the script that EC2 will execute
          REMOTE_SCRIPT=$(cat <<EOF
          set -euo pipefail

          mkdir -p /opt/mattermost

          # Prepare the application repository
          if ! git -C /opt/mattermost rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C /opt/mattermost init
            git -C /opt/mattermost remote add origin https://github.com/sespinosab/mattermost.git
          fi

          # Retrieve the exact commit that triggered this deployment
          git -C /opt/mattermost fetch --depth=1 origin ${Q_COMMIT_SHA}
          git -C /opt/mattermost checkout -f --detach FETCH_HEAD

          # Pass configuration to deploy.sh
          export DB_HOST=${Q_DB_HOST}
          export DB_PORT=${Q_DB_PORT}
          export DB_NAME=${Q_DB_NAME}
          export DB_USER=${Q_DB_USER}
          export DB_PASSWORD=${Q_DB_PASSWORD}
          export MM_SITE_URL=${Q_MM_SITE_URL}
          export MATTERMOST_IMAGE=${Q_MATTERMOST_IMAGE}

          # Execute the deployment script
          bash /opt/mattermost/scripts/deploy.sh
          EOF
          )

          # 4. Encode the remote script for transport
          REMOTE_SCRIPT_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w 0)

          REMOTE_COMMAND="printf '%s' '${REMOTE_SCRIPT_B64}' | base64 -d > /tmp/mattermost-deploy.sh && chmod 700 /tmp/mattermost-deploy.sh && bash /tmp/mattermost-deploy.sh; STATUS=\$?; rm -f /tmp/mattermost-deploy.sh; exit \$STATUS"

          # 5. Send the deployment command through SSM
          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --comment "Deploy Mattermost ${SHORT_SHA}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: ${COMMAND_ID}"

          # 6. Wait for deployment completion
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "Deployment completed."

          # Display remote output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
