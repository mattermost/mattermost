# Re-runs an E2E run's failed jobs when a lane's triage asked for it: the lane was red only on
# infrastructure (a dead worker, missing reports), never on a test. Triage decides and leaves a marker
# artifact in the run (see rerun-attempts in e2e-tests-lane-result.yml); the toolkit's e2e-test-rerun
# action reads it and re-runs the failed jobs once, so the new attempt is triaged on its own results.
# It checks out and runs no code from the run it re-runs.
name: E2E Tests (re-run on infrastructure failure)
on:
  workflow_run:
    workflows:
      - "E2E Tests (pull request)"
      - "E2E Tests (master/release - merge)"
      - "E2E Tests (release cut)"
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: ci/e2e-rerun
        uses: mattermost/mattermost-test-automation-toolkit/actions/e2e-test-rerun@86070f7fe08b27ebb0c6f4885fa3f4b72ef9a4d7 # actions/e2e-test-rerun 2026-11-03
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          run-attempt: ${{ github.event.workflow_run.run_attempt }}
