# Base CI template which is called from i18n-ci-pr.yml

name: i18n CI Template
on:
  workflow_call:

permissions:
  contents: read

# Translations used to arrive exclusively through Weblate, so this workflow's
# only job was to reject any PR that touched a non-English file. They are now
# authored in-repo and land in the same PR as the English string, so the job
# is to check them instead of to block them.
#
# Missing keys are reported as warnings rather than errors for now: the gate
# is only fair once contributors have a documented way to generate the other
# 21 locales for a string they are adding, which does not exist yet. Every
# other check here is a hard failure.
jobs:
  verify-webapp:
    name: Verify webapp translation files
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: ci/setup
        uses: ./.github/actions/webapp-setup
        with:
          read-only: "true"

      - name: ci/i18n-verify-translations
        working-directory: webapp/channels
        run: |
          npm run i18n-verify-translations -- --warn-missing-keys

      # en.json lives under the paths that trigger this workflow, so an edit
      # that puts the authoring catalog out of lockstep is caught here.
      - name: ci/i18n-extract-authoring
        working-directory: webapp/channels
        run: |
          npm run i18n-extract-authoring:check

  verify-server:
    name: Verify server translation files
    runs-on: ubuntu-24.04
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: ci/setup-go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: tools/mmgotool/go.mod

      - name: ci/i18n-verify
        working-directory: tools/mmgotool
        run: |
          go run . i18n verify --server-dir=../../server --warn-missing-ids

      - name: ci/i18n-extract-authoring
        working-directory: tools/mmgotool
        run: |
          go run . i18n extract-authoring --server-dir=../../server --check
