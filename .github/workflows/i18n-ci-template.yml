# Base CI template which is called from i18n-ci-pr.yml

name: i18n CI Template
on:
  workflow_call:

permissions:
  contents: read

# Translations used to arrive exclusively through Weblate, so this workflow's
# only job failed any PR that touched a non-English file unless it came from the
# weblate account. Translations may now be authored in-repo and land in the same
# PR as the English string, so the change is reported instead of rejected -- and,
# below, actually checked.
#
# Missing keys are reported as warnings rather than errors: the catalogs are tens
# of thousands of entries short of parity, and a hard gate is only fair once a
# contributor adding a string has a documented way to produce the other 21
# locales. Everything else here is a hard failure.
jobs:
  check-files:
    name: Report non-English translation file changes
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
        with:
          files: |
            server/i18n/*.json
            webapp/channels/src/i18n/*.json
            !server/i18n/en.json
            !webapp/channels/src/i18n/en.json

      - name: Check changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "::warning title=Non-English i18n files changed::This PR modifies non-English translation files directly. Ensure the changes are intentional and will not be overwritten by Weblate."

  verify-webapp:
    name: Verify webapp translation files
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: ci/setup
        uses: ./.github/actions/webapp-setup
        with:
          read-only: "true"

      - name: ci/i18n-verify-translations
        working-directory: webapp/channels
        run: |
          npm run i18n-verify-translations -- --warn-missing-keys

  verify-server:
    name: Verify server translation files
    runs-on: ubuntu-24.04
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: ci/setup-go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: tools/mmgotool/go.mod

      - name: ci/i18n-verify
        working-directory: tools/mmgotool
        run: |
          go run . i18n verify --server-dir=../../server --warn-missing-ids
