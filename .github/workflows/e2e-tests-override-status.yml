---
name: E2E Tests - Override Status

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number whose diagnosis the maintainer reviewed"
        required: true
        type: string
      assessed_sha:
        description: "Exact 40-character PR commit SHA assessed by Cursor"
        required: true
        type: string
      diagnosis_kind:
        description: "Type of durable Cursor diagnosis"
        required: true
        type: choice
        default: review
        options: [review, comment]
      diagnosis_id:
        description: "Cursor PR review ID (or issue comment ID)"
        required: true
        type: string
      diagnosis_sha256:
        description: "SHA-256 of the complete diagnosis body reviewed by the maintainer"
        required: true
        type: string
      contexts_json:
        description: "JSON array: context, numeric status_id, string gh_run_id and gh_run_attempt"
        required: true
        type: string
      approval_reason:
        description: "Why the maintainer approves these exact failures despite the diagnosis limitations"
        required: true
        type: string

permissions: {}

jobs:
  override-status:
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    runs-on: ubuntu-24.04
    steps:
      # The maintainer dispatches the reviewed workflow revision. Check out only
      # its verifier; no product, test, npm or other PR code runs with this token.
      - name: Check out the reviewed verification helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/manual-e2e-verification.mjs
            .github/scripts/manual-e2e-verification.test.mjs
      - name: Verify status guard tests without the writer token
        run: node --test .github/scripts/manual-e2e-verification.test.mjs
      - name: Record maintainer approval and verify exact statuses
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ASSESSED_SHA: ${{ inputs.assessed_sha }}
          DIAGNOSIS_KIND: ${{ inputs.diagnosis_kind }}
          DIAGNOSIS_ID: ${{ inputs.diagnosis_id }}
          DIAGNOSIS_SHA256: ${{ inputs.diagnosis_sha256 }}
          CONTEXTS_JSON: ${{ inputs.contexts_json }}
          APPROVAL_REASON: ${{ inputs.approval_reason }}
        run: node .github/scripts/manual-e2e-verification.mjs
