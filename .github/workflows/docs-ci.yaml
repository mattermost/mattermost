name: Docs CI

on:
  pull_request:
    paths:
      - ".github/workflows/docs-ci.yaml"
      - "docs/**"
      - "api/v4/source/**"
      - "api/playbooks/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/docs-ci.yaml"
      - "docs/**"
      - "api/v4/source/**"
      - "api/playbooks/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: docs/site/.nvmrc
          cache: "npm"
          cache-dependency-path: docs/site/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: api/server/go.mod

      - name: Install docs dependencies
        working-directory: docs/site
        run: npm ci

      - name: Typecheck
        working-directory: docs/site
        run: npm run typecheck

      - name: Egress-check unit tests
        working-directory: docs/site
        run: npm run test:egress

      - name: Build docs site (includes OpenAPI prebuild)
        working-directory: docs/site
        run: npm run build
        env:
          ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ vars.ALGOLIA_SEARCH_API_KEY }}

      - name: Check absolute docs.mattermost.com links
        working-directory: docs/site
        run: npm run check:absolute-links

      # Hosted Algolia injects SearchBar preconnects; do not scan that artifact.
      # Rebuild without ALGOLIA_* (prebuild already ran) for the offline shape.
      # BASE_URL matches the offline bundle the server ships (mattermost/delivery-platform
      # builds it with BASE_URL=/_documentation/), so links that only break under that
      # base URL fail here instead of in the release pipeline.
      - name: Rebuild offline bundle shape for egress scan
        working-directory: docs/site
        run: npx docusaurus build && npm run postbuild
        env:
          BASE_URL: /_documentation/

      - name: Scan built site for egress
        working-directory: docs/site
        run: npm run check:egress
