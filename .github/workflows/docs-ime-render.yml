name: docs-ime-render

# Regenerates the rendered PNG snapshot of the IME diagram
# (`docs/site/static/img/ime/entadv.png`) whenever a PR touches the
# component, its content, its render script, or the assets it uses.
# The fresh PNG is committed back to the PR's own branch, so the author
# sees it in their diff and it lands via the same merge as the code.

on:
  pull_request:
    paths:
      - "docs/site/src/components/IMEDiagram/**"
      - "docs/site/scripts/render-ime.mjs"
      - "docs/site/static/img/ime/logos/**"
      - "docs/site/static/img/ime/banner-bg.jpg"
      - ".github/workflows/docs-ime-render.yml"

# One render per PR at a time. Newer pushes cancel the in-flight run
# so we don't queue up stale renders behind a rapid succession of
# force-pushes.
concurrency:
  group: docs-ime-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    name: Render IME diagram PNG
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: render/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # Don't leave GITHUB_TOKEN in .git/config where later steps
          # (npm ci, postinstall scripts from PR-controlled deps) can
          # read it. The push step below sets its own remote URL with
          # the token scoped to that single command.
          persist-credentials: false
          submodules: true

      - name: render/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: docs/site/.nvmrc
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: render/setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/server/go.mod

      - name: render/install-docs-dependencies
        working-directory: docs/site
        run: npm ci

      - name: render/start-docusaurus
        working-directory: docs/site
        run: |
          nohup npm start -- --port 3000 --no-open > /tmp/docusaurus.log 2>&1 &
          echo "docusaurus pid $!"

      - name: render/wait-for-server
        run: |
          npx --yes wait-on --timeout 600000 --httpTimeout 5000 http://localhost:3000

      - name: render/render-ime
        working-directory: docs/site
        run: npm run render:ime

      - name: render/commit-if-changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDERED_PNG: docs/site/static/img/ime/entadv.png
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Stage first, then diff `--staged`. `git diff` alone only sees
          # tracked changes, so on the first-ever render (no PNG in the
          # repo yet) the file is untracked and would be missed.
          git add "$RENDERED_PNG"
          if git diff --staged --quiet -- "$RENDERED_PNG"; then
            echo "No change to $RENDERED_PNG; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(docs): refresh rendered IME diagram

          Auto-generated by .github/workflows/docs-ime-render.yml."
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$HEAD_REF"

      - name: render/dump-server-log-on-failure
        if: failure()
        run: |
          echo "::group::docusaurus log tail"
          tail -n 200 /tmp/docusaurus.log || true
          echo "::endgroup::"
