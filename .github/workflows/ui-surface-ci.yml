name: UI Surface CI

on:
  pull_request:
    paths:
      - "webapp/**"
      - "api/v4/source/**"
      - "e2e-tests/playwright/ui-surface/**"
      - "e2e-tests/playwright/lib/src/**"
      - "e2e-tests/playwright/specs/**"
      - "e2e-tests/playwright/upgrade-specs/**"
      - "e2e-tests/playwright/eslint.config.mjs"
      - ".github/workflows/ui-surface-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tier A: fast syntactic gate on every matching PR. Builds the tool, runs its unit tests, and checks only the files
  # changed since the PR base with the incremental cache. Target < 30s of real work.
  fast:
    name: Fast syntactic gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e-tests/playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: e2e-tests/playwright/package-lock.json

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build and unit-test @mattermost/ui-surface
        run: |
          npm run build --workspace @mattermost/ui-surface
          npm test --workspace @mattermost/ui-surface

      - name: Restore incremental scan cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: e2e-tests/playwright/.ui-surface-cache
          key: ui-surface-scan-${{ github.sha }}
          restore-keys: |
            ui-surface-scan-

      - name: Check files changed since base (incremental)
        run: node ui-surface/bin/ui-surface.mjs check --incremental --changed-since "origin/${{ github.base_ref }}"

  # Tier B: cached full check, baseline/drift/role-fit over the whole webapp, plus typecheck and the host-contract diff.
  full:
    name: Full check, typecheck & host-contract diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e-tests/playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: e2e-tests/playwright/package-lock.json

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build and test @mattermost/ui-surface
        run: |
          npm run build --workspace @mattermost/ui-surface
          npm test --workspace @mattermost/ui-surface

      - name: Restore incremental scan cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: e2e-tests/playwright/.ui-surface-cache
          key: ui-surface-scan-${{ github.sha }}
          restore-keys: |
            ui-surface-scan-

      - name: Scan webapp, check stale references and testid ratchet (cached)
        run: node ui-surface/bin/ui-surface.mjs check --incremental

      - name: Save incremental scan cache
        if: always()
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: e2e-tests/playwright/.ui-surface-cache
          key: ui-surface-scan-${{ github.sha }}

      - name: Build @mattermost/playwright-lib and typecheck workspaces
        run: |
          npm run build --workspace @mattermost/playwright-lib
          npm run tsc --workspaces

      - name: Typecheck Playwright specs and surface types against the regenerated surface
        run: npx tsc -b

      - name: Host-contract diff against the committed baseline (fails on breaking removals)
        run: |
          node ui-surface/bin/ui-surface.mjs host-contract --out host-contract.head.json
          node ui-surface/bin/ui-surface.mjs host-contract diff ui-surface/host-contract.baseline.json host-contract.head.json

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mattermost-host-contract
          path: e2e-tests/playwright/host-contract.head.json
          retention-days: 30
