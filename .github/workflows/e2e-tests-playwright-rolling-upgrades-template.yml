---
name: E2E Tests - Playwright Rolling Upgrades Template

# One matrix job per resolved from-version: upgrade-from → upgrade-to.
# Post-upgrade full Playwright dispatch is omitted (single runner cannot finish
# the full suite within the job timeout); coverage is the upgrade-path harness.

on:
  workflow_call:
    inputs:
      commit_sha:
        type: string
        required: true
      branch:
        type: string
        required: true
      build_id:
        type: string
        required: true
      server_image_tag:
        description: "Server image tag (e.g., master or short SHA)"
        type: string
        required: true
      server_edition:
        description: "Server edition: enterprise (default), fips, or team"
        type: string
        required: false
        default: enterprise
      server_image_repo:
        description: "Docker registry: mattermostdevelopment (default) or mattermost"
        type: string
        required: false
        default: mattermostdevelopment
      server_image_aliases:
        description: "Comma-separated alias tags for description"
        type: string
        required: false
      context_suffix:
        description: "Suffix appended to commit-status context (e.g. /master, /release)"
        type: string
        required: false
        default: ""

      enable_reporting:
        type: boolean
        required: false
        default: false
      report_type:
        type: string
        required: false
      ref_branch:
        type: string
        required: false
      pr_number:
        type: string
        required: false

      playwright_project:
        description: "Playwright project name passed to dispatch-begin and dispatch-run."
        type: string
        required: false
        default: chrome
      playwright_retries:
        description: "Playwright --retries=N (per-spec, in-process retry of flaky tests)"
        type: number
        required: false
        default: 1
      retest_on_fail:
        description: "Re-dispatch failed dispatch units once (whole-spec retry, on top of Playwright --retries)"
        type: boolean
        required: false
        default: true

    secrets:
      MM_LICENSE:
        required: false
      REPORT_WEBHOOK_URL:
        required: false

permissions:
  contents: read
  statuses: write
  id-token: write

env:
  SERVER_IMAGE: "${{ inputs.server_image_repo }}/${{ inputs.server_edition == 'fips' && 'mattermost-enterprise-fips-edition' || inputs.server_edition == 'team' && 'mattermost-team-edition' || 'mattermost-enterprise-edition' }}:${{ inputs.server_image_tag }}"

jobs:
  prepare-run:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    outputs:
      upgrade-matrix: ${{ steps.upgrade-matrix.outputs.matrix }}
      matrix_empty: ${{ steps.upgrade-matrix.outputs.matrix_empty }}
      start_time: ${{ steps.matrix.outputs.start_time }}
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: ci/resolve-upgrade-matrix
        id: upgrade-matrix
        working-directory: e2e-tests/playwright
        run: |
          MATRIX=$(node script/resolve_upgrade_matrix.mjs)
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$MATRIX" | jq 'length')" -eq 0 ]; then
            echo "matrix_empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "matrix_empty=false" >> "$GITHUB_OUTPUT"
          fi
      - name: ci/post-empty-matrix-status
        if: steps.upgrade-matrix.outputs.matrix_empty == 'true'
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CONTEXT_NAME: "e2e-test/playwright-full/${{ inputs.server_edition || 'enterprise' }}/upgrade-from-none${{ inputs.context_suffix }}"
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -f state=success \
            -f context="${CONTEXT_NAME}" \
            -f description="No supported from-versions — rolling upgrade coverage skipped" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Posted success for ${CONTEXT_NAME}"
      - name: ci/matrix
        id: matrix
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

  prep-deps:
    name: prep-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: ci/setup-webapp-node-modules
        uses: ./.github/actions/webapp-setup
      - name: ci/cache-playwright-deps
        id: cache-playwright
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            e2e-tests/playwright/node_modules
            e2e-tests/playwright/lib/dist
            e2e-tests/playwright/lib/node_modules
          key: e2e-playwright-deps-${{ runner.os }}-${{ hashFiles('e2e-tests/playwright/package-lock.json', 'e2e-tests/playwright/lib/src/**', 'e2e-tests/playwright/lib/package.json', 'e2e-tests/playwright/lib/rollup.config.js', 'e2e-tests/playwright/lib/tsconfig.json') }}
      - name: ci/install-playwright-deps
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: e2e-tests/playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: ci/cache-playwright-browsers
        id: cache-pw-browsers
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('e2e-tests/playwright/package-lock.json') }}
      - name: ci/install-playwright-chromium
        if: steps.cache-pw-browsers.outputs.cache-hit != 'true'
        working-directory: e2e-tests/playwright
        run: npx playwright install chromium

  workers:
    name: rolling-upgrade-from-${{ matrix.contextLabel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [prepare-run, prep-deps]
    if: needs.prepare-run.outputs.matrix_empty != 'true'
    permissions:
      contents: read
      id-token: write
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-run.outputs.upgrade-matrix) }}
    env:
      MM_LICENSE: "${{ secrets.MM_LICENSE }}"
      TEST: playwright
      BRANCH: "${{ inputs.branch }}"
      BUILD_ID: "${{ inputs.build_id }}"
      CI_BASE_URL: "rolling-upgrade-from-${{ matrix.contextLabel }}"
      PW_USE_TESTCONTAINERS: "true"
      PW_TESTCONTAINERS_SERVICES: "openldap,keycloak,elasticsearch,minio"
      PW_TESTCONTAINERS_REUSE: "true"
      UPGRADE_FROM_DOCKER_TAG: "${{ matrix.dockerTag }}"
      UPGRADE_FROM_CONTEXT_LABEL: "${{ matrix.contextLabel }}"
      UPGRADE_FROM_IS_ESR: "${{ matrix.isESR }}"
    steps:
      - name: ci/checkout-actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true
      - name: ci/runner-prep-for-openldap
        uses: ./.github/actions/runner-prep-openldap
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: ci/setup-webapp-node-modules
        uses: ./.github/actions/webapp-setup
        with:
          read-only: "true"
      - name: ci/restore-playwright-deps
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            e2e-tests/playwright/node_modules
            e2e-tests/playwright/lib/dist
            e2e-tests/playwright/lib/node_modules
          key: e2e-playwright-deps-${{ runner.os }}-${{ hashFiles('e2e-tests/playwright/package-lock.json', 'e2e-tests/playwright/lib/src/**', 'e2e-tests/playwright/lib/package.json', 'e2e-tests/playwright/lib/rollup.config.js', 'e2e-tests/playwright/lib/tsconfig.json') }}
          fail-on-cache-miss: true
      - name: ci/restore-playwright-browsers
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('e2e-tests/playwright/package-lock.json') }}
          fail-on-cache-miss: true
      - name: ci/commit-status-context
        id: composite-identity
        env:
          CONTEXT_NAME: "e2e-test/playwright-full/${{ inputs.server_edition || 'enterprise' }}/upgrade-from-${{ matrix.contextLabel }}${{ inputs.context_suffix }}"
        run: echo "commit-status-context=${CONTEXT_NAME}" >> $GITHUB_OUTPUT
      - name: ci/testcontainers-down
        working-directory: e2e-tests/playwright
        run: npm run testcontainers:down
      - name: ci/upgrade-from
        id: upgrade_from
        working-directory: e2e-tests/playwright
        run: |
          IMAGE_REPO="${SERVER_IMAGE%:*}"
          PW_UPGRADE_FROM_SERVER_IMAGE="${IMAGE_REPO}:${UPGRADE_FROM_DOCKER_TAG}" \
            npx playwright test --project=upgrade-from
      - name: ci/save-upgrade-from-results
        if: always()
        working-directory: e2e-tests/playwright
        run: |
          mkdir -p /tmp/upgrade-results
          if [ -f results/reporter/results.json ]; then
            cp results/reporter/results.json /tmp/upgrade-results/from.json
          fi
      - name: ci/upgrade-to
        id: upgrade_to
        working-directory: e2e-tests/playwright
        run: npx playwright test --project=upgrade-to
      - name: ci/save-upgrade-to-results
        if: always()
        working-directory: e2e-tests/playwright
        run: |
          mkdir -p /tmp/upgrade-results
          if [ -f results/reporter/results.json ]; then
            cp results/reporter/results.json /tmp/upgrade-results/to.json
          fi
      # Post-upgrade full-suite dispatch is intentionally omitted: one runner cannot drain
      # ~280 specs within the job timeout. Upgrade-path coverage is upgrade-from → upgrade-to.
      - name: ci/post-commit-status
        if: always()
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CONTEXT_NAME: ${{ steps.composite-identity.outputs.commit-status-context }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          IMAGE_TAG: ${{ inputs.server_image_tag }}
          IMAGE_ALIASES: ${{ inputs.server_image_aliases }}
          FROM_OUTCOME: ${{ steps.upgrade_from.outcome }}
          TO_OUTCOME: ${{ steps.upgrade_to.outcome }}
        run: |
          # Same shape as Test System IO summaries, plus from:<contextLabel>.
          # Examples:
          #   100% passed (12), 2 specs, image_tag:master, from:release-11.9
          #   91.7% passed (11/12), 1 failed, 2 specs, image_tag:abc1234, from:release-11.7-esr
          #   100% passed (12), 2 specs, image_tag:11.4.0 (release-11.4, release-11), from:release-11.9
          parse_pw_stats() {
            local file="$1"
            if [ ! -f "$file" ]; then
              echo "0 0 0"
              return
            fi
            jq -r '
              def spec_files:
                [.. | objects | select(has("file") and (.file | type == "string") and (.file | length > 0)) | .file]
                | unique | length;
              [
                ((.stats.expected // 0) + (.stats.flaky // 0)),
                (.stats.unexpected // 0),
                spec_files
              ] | @tsv
            ' "$file" | tr '\t' ' '
          }

          PASSED=0
          FAILED=0
          SPECS=0
          for RESULT_FILE in /tmp/upgrade-results/from.json /tmp/upgrade-results/to.json; do
            read -r P F S <<< "$(parse_pw_stats "$RESULT_FILE")"
            PASSED=$((PASSED + P))
            FAILED=$((FAILED + F))
            SPECS=$((SPECS + S))
          done
          TOTAL=$((PASSED + FAILED))

          IMAGE_PART="image_tag:${IMAGE_TAG}"
          if [ -n "${IMAGE_ALIASES:-}" ]; then
            IMAGE_PART="${IMAGE_PART} (${IMAGE_ALIASES//,/, })"
          fi
          FROM_PART="from:${UPGRADE_FROM_CONTEXT_LABEL}"

          if [ "$TOTAL" -gt 0 ] && [ "$FAILED" -eq 0 ]; then
            DESC="100% passed (${PASSED}), ${SPECS} specs, ${IMAGE_PART}, ${FROM_PART}"
          elif [ "$TOTAL" -gt 0 ]; then
            RATE=$(awk -v p="$PASSED" -v t="$TOTAL" 'BEGIN { printf "%.1f", 100.0 * p / t }')
            DESC="${RATE}% passed (${PASSED}/${TOTAL}), ${FAILED} failed, ${SPECS} specs, ${IMAGE_PART}, ${FROM_PART}"
          elif [ "$FROM_OUTCOME" = "success" ] && [ "$TO_OUTCOME" = "success" ]; then
            DESC="100% passed, ${IMAGE_PART}, ${FROM_PART}"
          else
            DESC="0% passed, ${IMAGE_PART}, ${FROM_PART}"
          fi

          if [ "$FROM_OUTCOME" = "success" ] && [ "$TO_OUTCOME" = "success" ] && [ "$FAILED" -eq 0 ]; then
            STATE=success
          else
            STATE=failure
          fi

          # GitHub commit-status description max length is 140.
          DESC="${DESC:0:140}"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -f state="${STATE}" \
            -f context="${CONTEXT_NAME}" \
            -f description="${DESC}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Posted ${STATE} for ${CONTEXT_NAME}: ${DESC}"
      - name: ci/upload-debug-artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-rolling-upgrades-${{ inputs.server_edition }}-from-${{ matrix.contextLabel }}-debug
          path: |
            e2e-tests/playwright/logs/
            e2e-tests/playwright/results/
          retention-days: 5
          if-no-files-found: ignore
