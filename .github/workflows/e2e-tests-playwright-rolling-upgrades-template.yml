---
name: E2E Tests - Playwright Rolling Upgrades Template (test system io dispatch)

# One matrix job per resolved from-version: upgrade-from → upgrade-to → full Playwright dispatch
# against the upgraded server (no setup project — upgrade-from already ran setup).

on:
  workflow_call:
    inputs:
      commit_sha:
        type: string
        required: true
      branch:
        type: string
        required: true
      build_id:
        type: string
        required: true
      server_image_tag:
        description: "Server image tag (e.g., master or short SHA)"
        type: string
        required: true
      server_edition:
        description: "Server edition: enterprise (default), fips, or team"
        type: string
        required: false
        default: enterprise
      server_image_repo:
        description: "Docker registry: mattermostdevelopment (default) or mattermost"
        type: string
        required: false
        default: mattermostdevelopment
      server_image_aliases:
        description: "Comma-separated alias tags for description"
        type: string
        required: false
      context_suffix:
        description: "Suffix appended to commit-status context (e.g. /master, /release)"
        type: string
        required: false
        default: ""

      enable_reporting:
        type: boolean
        required: false
        default: false
      report_type:
        type: string
        required: false
      ref_branch:
        type: string
        required: false
      pr_number:
        type: string
        required: false

      playwright_project:
        description: "Playwright project name passed to dispatch-begin and dispatch-run."
        type: string
        required: false
        default: chrome
      playwright_retries:
        description: "Playwright --retries=N (per-spec, in-process retry of flaky tests)"
        type: number
        required: false
        default: 1
      retest_on_fail:
        description: "Re-dispatch failed dispatch units once (whole-spec retry, on top of Playwright --retries)"
        type: boolean
        required: false
        default: true

    secrets:
      MM_LICENSE:
        required: false
      REPORT_WEBHOOK_URL:
        required: false

permissions:
  contents: read
  statuses: write
  id-token: write

env:
  SERVER_IMAGE: "${{ inputs.server_image_repo }}/${{ inputs.server_edition == 'fips' && 'mattermost-enterprise-fips-edition' || inputs.server_edition == 'team' && 'mattermost-team-edition' || 'mattermost-enterprise-edition' }}:${{ inputs.server_image_tag }}"

jobs:
  prepare-run:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    outputs:
      upgrade-matrix: ${{ steps.upgrade-matrix.outputs.matrix }}
      matrix_empty: ${{ steps.upgrade-matrix.outputs.matrix_empty }}
      start_time: ${{ steps.matrix.outputs.start_time }}
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: ci/resolve-upgrade-matrix
        id: upgrade-matrix
        working-directory: e2e-tests/playwright
        run: |
          MATRIX=$(node script/resolve_upgrade_matrix.mjs)
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$MATRIX" | jq 'length')" -eq 0 ]; then
            echo "matrix_empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "matrix_empty=false" >> "$GITHUB_OUTPUT"
          fi
      - name: ci/post-empty-matrix-status
        if: steps.upgrade-matrix.outputs.matrix_empty == 'true'
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CONTEXT_NAME: "e2e-test/playwright-rolling-upgrades/none${{ inputs.context_suffix }}"
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -f state=success \
            -f context="${CONTEXT_NAME}" \
            -f description="No supported from-versions — rolling upgrade coverage skipped" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Posted success for ${CONTEXT_NAME}"
      - name: ci/matrix
        id: matrix
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

  prep-deps:
    name: prep-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: ci/setup-webapp-node-modules
        uses: ./.github/actions/webapp-setup
      - name: ci/cache-playwright-deps
        id: cache-playwright
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            e2e-tests/playwright/node_modules
            e2e-tests/playwright/lib/dist
            e2e-tests/playwright/lib/node_modules
          key: e2e-playwright-deps-${{ runner.os }}-${{ hashFiles('e2e-tests/playwright/package-lock.json', 'e2e-tests/playwright/lib/src/**', 'e2e-tests/playwright/lib/package.json', 'e2e-tests/playwright/lib/rollup.config.js', 'e2e-tests/playwright/lib/tsconfig.json') }}
      - name: ci/install-playwright-deps
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: e2e-tests/playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: ci/cache-playwright-browsers
        id: cache-pw-browsers
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('e2e-tests/playwright/package-lock.json') }}
      - name: ci/install-playwright-chromium
        if: steps.cache-pw-browsers.outputs.cache-hit != 'true'
        working-directory: e2e-tests/playwright
        run: npx playwright install chromium

  workers:
    name: rolling-upgrade-from-${{ matrix.contextLabel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [prepare-run, prep-deps]
    if: needs.prepare-run.outputs.matrix_empty != 'true'
    permissions:
      contents: read
      id-token: write
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-run.outputs.upgrade-matrix) }}
    env:
      MM_LICENSE: "${{ secrets.MM_LICENSE }}"
      TEST: playwright
      BRANCH: "${{ inputs.branch }}"
      BUILD_ID: "${{ inputs.build_id }}"
      CI_BASE_URL: "rolling-upgrade-from-${{ matrix.contextLabel }}"
      PW_USE_TESTCONTAINERS: "true"
      PW_TESTCONTAINERS_SERVICES: "openldap,keycloak,elasticsearch,minio"
      PW_TESTCONTAINERS_REUSE: "true"
      UPGRADE_FROM_DOCKER_TAG: "${{ matrix.dockerTag }}"
      UPGRADE_FROM_CONTEXT_LABEL: "${{ matrix.contextLabel }}"
      UPGRADE_FROM_IS_ESR: "${{ matrix.isESR }}"
    steps:
      - name: ci/checkout-actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true
      - name: ci/runner-prep-for-openldap
        uses: ./.github/actions/runner-prep-openldap
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: ci/setup-webapp-node-modules
        uses: ./.github/actions/webapp-setup
        with:
          read-only: "true"
      - name: ci/restore-playwright-deps
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            e2e-tests/playwright/node_modules
            e2e-tests/playwright/lib/dist
            e2e-tests/playwright/lib/node_modules
          key: e2e-playwright-deps-${{ runner.os }}-${{ hashFiles('e2e-tests/playwright/package-lock.json', 'e2e-tests/playwright/lib/src/**', 'e2e-tests/playwright/lib/package.json', 'e2e-tests/playwright/lib/rollup.config.js', 'e2e-tests/playwright/lib/tsconfig.json') }}
          fail-on-cache-miss: true
      - name: ci/restore-playwright-browsers
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('e2e-tests/playwright/package-lock.json') }}
          fail-on-cache-miss: true
      - name: ci/composite-identity
        id: composite-identity
        env:
          CONTEXT_NAME: "e2e-test/playwright-rolling-upgrades/${{ inputs.server_edition || 'enterprise' }}/from-${{ matrix.contextLabel }}${{ inputs.context_suffix }}"
          GITHUB_REPOSITORY: ${{ github.repository }}
          MM_BRANCH: ${{ inputs.branch }}
          MM_SHA: ${{ inputs.commit_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          NAME="${CONTEXT_NAME#e2e-test/}"
          NAME="${NAME//\//-}"
          if [ -n "$PR_NUMBER" ]; then
            COMPOSITE_IDENTITY=$(jq -nc \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg sha "${MM_SHA}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg name "${NAME}" \
              --arg attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg branch "${MM_BRANCH}" \
              --arg pr "${PR_NUMBER}" \
              --arg from "${UPGRADE_FROM_CONTEXT_LABEL}" \
              --argjson esr ${UPGRADE_FROM_IS_ESR} \
              '{repository:$repo, commit_sha:$sha, gh_run_id:$run_id, name:$name, gh_run_attempt:$attempt, branch:$branch, gh_pr_number:$pr, upgrade_from:$from, upgrade_from_esr:$esr}')
          else
            COMPOSITE_IDENTITY=$(jq -nc \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg sha "${MM_SHA}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg name "${NAME}" \
              --arg attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg branch "${MM_BRANCH}" \
              --arg from "${UPGRADE_FROM_CONTEXT_LABEL}" \
              --argjson esr ${UPGRADE_FROM_IS_ESR} \
              '{repository:$repo, commit_sha:$sha, gh_run_id:$run_id, name:$name, gh_run_attempt:$attempt, branch:$branch, upgrade_from:$from, upgrade_from_esr:$esr}')
          fi
          echo "composite-identity-json=${COMPOSITE_IDENTITY}" >> $GITHUB_OUTPUT
          echo "commit-status-context=${CONTEXT_NAME}" >> $GITHUB_OUTPUT
      - name: ci/testcontainers-down
        working-directory: e2e-tests/playwright
        run: npm run testcontainers:down
      - name: ci/upgrade-from
        working-directory: e2e-tests/playwright
        run: |
          IMAGE_REPO="${SERVER_IMAGE%:*}"
          PW_UPGRADE_FROM_SERVER_IMAGE="${IMAGE_REPO}:${UPGRADE_FROM_DOCKER_TAG}" \
            npx playwright test --project=upgrade-from
      - name: ci/upgrade-to
        working-directory: e2e-tests/playwright
        run: npx playwright test --project=upgrade-to
      - name: ci/dispatch-begin
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-dispatch-begin@1631d8fcea24f4545a0b3b7f77e41c2fe0be4418 # 2026-07-28
        with:
          use-staging: ${{ vars.E2E_USE_STAGING_TEST_IO_URL != 'false' }}
          framework: playwright
          repo-dir: ${{ github.workspace }}
          composite-identity: ${{ steps.composite-identity.outputs.composite-identity-json }}
          total-reports-expected: 1
          retest-on-fail: ${{ inputs.retest_on_fail }}
          playwright-project: ${{ inputs.playwright_project }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-status-context: ${{ steps.composite-identity.outputs.commit-status-context }}
          image-tag: ${{ inputs.server_image_tag }}
          image-aliases: ${{ inputs.server_image_aliases }}
      - name: ci/dispatch-run
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-dispatch-run@1631d8fcea24f4545a0b3b7f77e41c2fe0be4418 # 2026-07-28
        with:
          use-staging: ${{ vars.E2E_USE_STAGING_TEST_IO_URL != 'false' }}
          framework: playwright
          composite-identity: ${{ steps.composite-identity.outputs.composite-identity-json }}
          repo-dir: ${{ github.workspace }}
          artifacts-root: ${{ github.workspace }}/worker-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-job-name: rolling-upgrade-from-${{ matrix.contextLabel }}
          playwright-retries: ${{ inputs.playwright_retries }}
          playwright-project: ${{ inputs.playwright_project }}
      - name: ci/upload-debug-artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-rolling-upgrades-${{ inputs.server_edition }}-from-${{ matrix.contextLabel }}-debug
          path: |
            e2e-tests/playwright/logs/
            e2e-tests/playwright/results/
            worker-artifacts/
          retention-days: 5
          if-no-files-found: ignore

  report:
    runs-on: ubuntu-24.04
    needs: [prepare-run, workers]
    if: always() && needs.prepare-run.outputs.matrix_empty != 'true'
    permissions:
      contents: read
      id-token: write
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-run.outputs.upgrade-matrix) }}
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: ci/composite-identity
        id: composite-identity
        env:
          CONTEXT_NAME: "e2e-test/playwright-rolling-upgrades/${{ inputs.server_edition || 'enterprise' }}/from-${{ matrix.contextLabel }}${{ inputs.context_suffix }}"
          GITHUB_REPOSITORY: ${{ github.repository }}
          MM_BRANCH: ${{ inputs.branch }}
          MM_SHA: ${{ inputs.commit_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          NAME="${CONTEXT_NAME#e2e-test/}"
          NAME="${NAME//\//-}"
          if [ -n "$PR_NUMBER" ]; then
            COMPOSITE_IDENTITY=$(jq -nc \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg sha "${MM_SHA}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg name "${NAME}" \
              --arg attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg branch "${MM_BRANCH}" \
              --arg pr "${PR_NUMBER}" \
              --arg from "${{ matrix.contextLabel }}" \
              --argjson esr ${{ matrix.isESR }} \
              '{repository:$repo, commit_sha:$sha, gh_run_id:$run_id, name:$name, gh_run_attempt:$attempt, branch:$branch, gh_pr_number:$pr, upgrade_from:$from, upgrade_from_esr:$esr}')
          else
            COMPOSITE_IDENTITY=$(jq -nc \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg sha "${MM_SHA}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg name "${NAME}" \
              --arg attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg branch "${MM_BRANCH}" \
              --arg from "${{ matrix.contextLabel }}" \
              --argjson esr ${{ matrix.isESR }} \
              '{repository:$repo, commit_sha:$sha, gh_run_id:$run_id, name:$name, gh_run_attempt:$attempt, branch:$branch, upgrade_from:$from, upgrade_from_esr:$esr}')
          fi
          echo "composite-identity-json=${COMPOSITE_IDENTITY}" >> $GITHUB_OUTPUT
      - name: ci/run-summary
        id: summary
        continue-on-error: true
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-summary@e2d5032cfa71a3ad11b0975b135cd221564f2787 # 2026-08-06
        with:
          use-staging: ${{ vars.E2E_USE_STAGING_TEST_IO_URL != 'false' }}
          composite-identity: ${{ steps.composite-identity.outputs.composite-identity-json }}
          framework: playwright
          report-type: ${{ inputs.report_type }}
          image-tag: ${{ inputs.server_image_tag }}
          image-aliases: ${{ inputs.server_image_aliases }}
          server-image: ${{ env.SERVER_IMAGE }}
          pr-number: ${{ inputs.pr_number }}
          ref-branch: ${{ inputs.ref_branch }}
          commit-status-context: "e2e-test/playwright-rolling-upgrades/${{ inputs.server_edition || 'enterprise' }}/from-${{ matrix.contextLabel }}${{ inputs.context_suffix }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: ci/publish-webhook
        if: inputs.enable_reporting && env.REPORT_WEBHOOK_URL != ''
        env:
          REPORT_WEBHOOK_URL: ${{ secrets.REPORT_WEBHOOK_URL }}
          PAYLOAD: ${{ steps.summary.outputs.webhook_payload }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$REPORT_WEBHOOK_URL"
      - name: ci/assert-results
        env:
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
          WORKERS_OUTCOME: ${{ needs.workers.result }}
        run: |
          [ "$WORKERS_OUTCOME" = "success" ]
          [ "$SUMMARY_OUTCOME" = "success" ]
