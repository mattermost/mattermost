name: Release Docs - Drafts

# Drafts for the release manager to review and share; nothing is sent or written. They name
# Jira epics and mattermost/enterprise PRs, so the full output (with the email.md and slide
# files attached) is posted to the review channel in Hub, also in a dry run; the run summary
# and the release-docs-<task> artifact keep only counts and mattermost/mattermost PRs. See
# release-docs-task.yml for settings.
#
#   drafts              Playbook T-16 and T-15. Claude drafts the blog outline and the
#                       announcement email from the changelog's Improvements section, the
#                       milestone's merged PRs and the release's Jira epics; every point
#                       cites its PR or ticket. The email follows the monthly one (August
#                       2026): the release with its pre-packaged plugins, the server security
#                       releases and mobile and desktop patch releases since the last email,
#                       the Extended Support Release Updates section in an ESR comms month,
#                       the confirmed breaking changes, and the Responsible Disclosure footer.
#                       The email.md artifact is the email without sources; the marketing
#                       task (release-docs-hub.yml) posts it on Release Day. Manual only.
#   release-highlights  Playbook T-0, "Update the Release Highlights deck". The month's slide:
#                       the server and mobile Jira epics, internal ones left out with a reason,
#                       each with a docs link and a one-sentence description, plus a
#                       paste-ready HTML file attached to the Hub post. Runs when a
#                       feature release becomes the latest release, and by hand. To check it against a past slide,
#                       dispatch it with v12.0.0 (October 2026) or v11.7.0 (May 2026).

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      task:
        description: 'Which draft'
        required: false
        default: drafts
        type: choice
        options:
          - drafts
          - release-highlights
      version:
        description: 'Release version, e.g. v12.2.0'
        required: true
        type: string
      milestone:
        description: 'drafts: milestone title. Defaults to vX.Y.0.'
        required: false
        type: string
      jira_fix_version:
        description: 'drafts: Jira fix version, e.g. "v12.2 (December 2026)". Defaults to the version and the month of its Release Day on the calendar.'
        required: false
        type: string
      confirmed:
        description: 'drafts: breaking changes confirmed in the breaking-change list, e.g. 39001, mattermost/enterprise#1234'
        required: false
        type: string

permissions: {}

jobs:
  drafts:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'drafts'
    uses: ./.github/workflows/release-docs-task.yml
    with:
      task: drafts
      version: ${{ inputs.version }}
      mode: dry_run
      milestone: ${{ inputs.milestone }}
      jira_fix_version: ${{ inputs.jira_fix_version }}
      confirmed: ${{ inputs.confirmed }}
    secrets: inherit
    permissions:
      contents: read

  release-highlights:
    if: github.event_name == 'release' || inputs.task == 'release-highlights'
    uses: ./.github/workflows/release-docs-task.yml
    with:
      task: release-highlights
      version: ${{ inputs.version }}
      mode: dry_run
    secrets: inherit
    permissions:
      contents: read
