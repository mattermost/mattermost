name: Release Docs - Version Archive

# Playbook T-3: a draft PR adding a feature release to the version archive (download
# links, SHA-256 from the published .sha256 files, GPG signature and SBOM). Runs when a
# vX.Y.0 GitHub release is published, which the delivery pipeline does as a pre-release at
# the final build cut; RC tags are ignored. Waits for the files. Dot releases (Z > 0) are
# skipped: their archive entries are in the dot release docs PR
# (release-docs-dot-release.yml). See release-docs-task.yml for modes and settings.

# A release event run's ref is the tag, which can't use the write key in `release-write`, so the
# `trigger` job (release-docs-trigger.yml, no secrets) checks it and starts this workflow on master;
# the task job runs only on master.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Feature release version, e.g. v12.2.0 (dot releases are in the dot release docs PR)'
        required: true
        type: string
      mode:
        description: 'default uses PHASE3_MODE (dry_run unless set to live). dry_run changes nothing; live publishes.'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - dry_run
          - live
      source_event:
        description: 'Set by release-docs-trigger.yml for a release, tag or PR edit; leave empty'
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  trigger:
    if: github.event_name == 'release'
    uses: ./.github/workflows/release-docs-trigger.yml
    with:
      task: version-archive
      workflow: release-docs-version-archive.yml
    permissions:
      contents: read
      actions: write # start this workflow on master

  version-archive:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    concurrency:
      group: release-docs-version-archive-${{ inputs.version }}
      cancel-in-progress: false
    uses: ./.github/workflows/release-docs-task.yml
    with:
      task: version-archive
      version: ${{ inputs.version }}
      mode: ${{ inputs.mode }}
      source_event: ${{ inputs.source_event }}
    secrets: inherit
    permissions:
      contents: read
      actions: read # the changelog runs' sections.json (release-docs)
      issues: read # the vX.Y.0 milestones' due dates (release-docs)
