name: Release Docs - Version Archive

# Playbook T-3: a draft PR adding a feature release to the version archive (download
# links, SHA-256 from the published .sha256 files, GPG signature and SBOM). Runs when a
# vX.Y.0 GitHub release is published, which the delivery pipeline does as a pre-release at
# the final build cut; RC tags are ignored. Waits for the files. Dot releases (Z > 0) are
# skipped: their archive entries are in the dot release docs PR
# (release-docs-dot-release.yml). See release-docs-task.yml for modes and settings.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Feature release version, e.g. v12.2.0 (dot releases are in the dot release docs PR)'
        required: true
        type: string
      mode:
        description: 'default uses PHASE3_MODE (dry_run unless set to live). dry_run changes nothing; live publishes.'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - dry_run
          - live

permissions: {}

concurrency:
  group: release-docs-version-archive-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  version-archive:
    uses: ./.github/workflows/release-docs-task.yml
    with:
      task: version-archive
      version: ${{ inputs.version }}
      mode: ${{ inputs.mode }}
    secrets: inherit
    permissions:
      contents: read
