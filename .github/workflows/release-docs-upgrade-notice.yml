name: Release Docs - Upgrade Notice

# Playbook T-0: a draft PR in mattermost/notices replacing the server upgrade notice with
# the new feature release, its highlights picked from the changelog. Runs when the release
# becomes a full release (the Latest pipeline); skipped unless it is the latest release.
# Dot releases are skipped: their notice states a security severity. See release-docs-task.yml.

# A release event run's ref is the tag, which can't use the write key in `release-write`, so the
# `trigger` job (release-docs-trigger.yml, no secrets) checks it and starts this workflow on master;
# the task job runs only on master.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v12.2.0'
        required: true
        type: string
      release_date:
        description: 'First day to show the notice (YYYY-MM-DD). Defaults to today.'
        required: false
        type: string
      mode:
        description: 'default uses PHASE3_MODE (dry_run unless set to live). dry_run changes nothing; live publishes.'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - dry_run
          - live
      source_event:
        description: 'Set by release-docs-trigger.yml for a release, tag or PR edit; leave empty'
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  trigger:
    if: github.event_name == 'release'
    uses: ./.github/workflows/release-docs-trigger.yml
    with:
      task: upgrade-notice
      workflow: release-docs-upgrade-notice.yml
    permissions:
      contents: read
      actions: write # start this workflow on master

  upgrade-notice:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    concurrency:
      group: release-docs-upgrade-notice-${{ inputs.version }}
      cancel-in-progress: false
    uses: ./.github/workflows/release-docs-task.yml
    with:
      task: upgrade-notice
      version: ${{ inputs.version }}
      mode: ${{ inputs.mode }}
      source_event: ${{ inputs.source_event }}
      release_date: ${{ inputs.release_date }}
    secrets: inherit
    permissions:
      contents: read
      actions: read # the changelog runs' sections.json (release-docs)
      issues: read # the vX.Y.0 milestones' due dates (release-docs)
