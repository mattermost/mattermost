name: Release Docs - Breaking Change Notices

# Developers are asked nothing. From the release branch cut (a release-X.Y branch is created)
# until the final release is cut (the vX.Y.0 tag exists), this lists the milestone's possible
# breaking changes: once when the branch is created, then every weekday, so PRs cherry-picked
# into the release are picked up. Other pushes to a release branch (cherry-picks) start nothing:
# the weekday run covers them. It is not tied to code freeze, which has no GitHub event.
# Each candidate comes with its source PR and why: breaking-change or deprecation labels on
# the PR or its Jira ticket, removals config-change-checker.yml wrote into the release note,
# release-note wording, removed WebSocket events and destructive migrations
# in the release diff, and a Claude review of the milestone's release notes.
# A person keeps or removes items, then runs this by hand with `confirmed` set to the PRs kept,
# and Claude drafts one notice per confirmed PR, citing it. Output goes to the run summary and
# the release-docs-breaking-changes artifact; nothing is published. See release-docs-task.yml.

on:
  push:
    # Only the push that creates the branch runs (see the job's if); cherry-picks are skipped.
    branches:
      - 'release-*'
  schedule:
    # Weekdays. Skips itself when no release-X.Y branch is waiting for its vX.Y.0 tag.
    - cron: '17 14 * * 1-5'
  workflow_dispatch:
    inputs:
      version:
        description: 'Milestone title, e.g. v12.2.0'
        required: true
        type: string
      confirmed:
        description: 'PRs to draft notices for, e.g. "39001, mattermost/enterprise#1234", or "none". Empty lists the candidates.'
        required: false
        type: string

permissions: {}

jobs:
  breaking-changes:
    # A push runs only when it created the release branch (the branch cut), so the cherry-picks
    # merged to the branch afterwards start no job and no Claude run.
    if: github.event_name != 'push' || github.event.created
    uses: ./.github/workflows/release-docs-task.yml
    with:
      task: breaking-changes
      version: ${{ inputs.version }}
      confirmed: ${{ inputs.confirmed || '' }}
      mode: dry_run
    secrets: inherit
    permissions:
      contents: read
