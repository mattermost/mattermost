name: Generate Changelog

# Runs on its own every weekday between the release branch cut and the changelog being
# merged on release day, and on demand. The scheduled run works out the release itself
# (see the resolve job); its mode comes from the CHANGELOG_SCHEDULE_MODE repository
# variable and defaults to dry_run, so it previews into the run summary until that
# variable is set to auto.
#
# Every run's summary is also the changelog-status report: preflight, merged PRs missing
# a release note (by owner), notes that will need rewriting, the status of the sections
# no developer note fills (WebSocket events, schema changes, plugins, Go version,
# benchmarking), bullets the release branch has moved past, and the docs page each
# feature links to: the one its release note names on a Docs: line, else the one found
# by following its PR to the docs files it, or a docs PR naming its Jira key or linking
# it, changed. Every docs link in the generated text is checked against the docs
# sources; changelog-link-check.yml does the same for each changelog PR.
#
# Repository variables read here, all optional:
#   CHANGELOG_SCHEDULE_MODE     — auto | dry_run (default) for scheduled runs
#   CHANGELOG_ESR_VERSIONS      — releases that are ESRs, e.g. "v11.7, v12.4"; other
#                                 X.0 releases are major and the rest feature releases
#   CHANGELOG_SECTION_REVIEWERS — JSON mapping a section pattern to reviewers, e.g.
#                                 {"Upgrade Impact/*": ["org/team"], "API Changes": ["login"]};
#                                 requested on the changelog PR for the sections a run adds to
on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for changelog entry (e.g. v11.9.0)'
        required: true
        type: string
      milestone:
        description: 'Milestone title in the server repo — defaults to the version'
        required: false
        type: string
      server_repos:
        description: 'Comma-separated repos to pull PRs from'
        required: true
        default: 'mattermost/mattermost,mattermost/enterprise'
        type: string
      release_type:
        description: 'Release type: "auto" (major for vX.0, esr if listed in CHANGELOG_ESR_VERSIONS, otherwise feature), "feature", "major", or "esr"'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - feature
          - major
          - esr
      release_date:
        description: 'Release day date (e.g. 2026-07-16) — defaults to today if omitted'
        required: false
        type: string
      go_version:
        description: 'Go version used in this release (e.g. go1.26.4) — if omitted, read from the release branch''s server/build/Dockerfile.buildenv'
        required: false
        type: string
      blog_post_url:
        description: 'Blog post URL for the Improvements section — if omitted, auto-constructed from version (e.g. https://mattermost.com/blog/mattermost-v11-9-is-now-available/)'
        required: false
        type: string
      mode:
        description: 'auto: add notes from newly merged PRs to the open changelog PR without touching existing lines, or open a draft PR if there is none. regenerate: rebuild the entry from scratch, discarding edits made in the PR. dry_run: generate only, into the run summary and an artifact; nothing is pushed.'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - regenerate
          - dry_run

jobs:
  # Decides what the run is for. A scheduled run picks the release between its
  # release-X.Y branch cut and its entry being merged to master: the newest tagged
  # release until its entry lands (the tag is pushed about five working days before
  # release day), else the oldest cut branch with no vX.Y.0 tag. It also fails a dispatch whose version and
  # milestone disagree on the major version, which would file one release's notes
  # under another's.
  resolve:
    if: github.repository == 'mattermost/mattermost'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.release.outputs.run }}
      version: ${{ steps.release.outputs.version }}
      milestone: ${{ steps.release.outputs.milestone }}
      release_type: ${{ steps.release.outputs.release_type }}
      mode: ${{ steps.release.outputs.mode }}
      changelog: ${{ steps.release.outputs.changelog }}
      head_ref: ${{ steps.release.outputs.head_ref }}
      head_fetch: ${{ steps.release.outputs.head_fetch }}
      base_ref: ${{ steps.release.outputs.base_ref }}
      base_fetch: ${{ steps.release.outputs.base_fetch }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_MILESTONE: ${{ inputs.milestone }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          INPUT_MODE: ${{ inputs.mode }}
          SCHEDULE_MODE: ${{ vars.CHANGELOG_SCHEDULE_MODE }}
          ESR_VERSIONS: ${{ vars.CHANGELOG_ESR_VERSIONS }}
        run: python3 .github/scripts/changelog_release.py resolve

      - name: Explain skipped run
        if: steps.release.outputs.run != 'true'
        env:
          REASON: ${{ steps.release.outputs.reason }}
        run: |
          echo "Nothing to generate: $REASON" | tee -a "$GITHUB_STEP_SUMMARY"

  generate-changelog:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Two runs for the same release would both push to its changelog branch.
    concurrency:
      group: generate-changelog-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read

    steps:
      # App 1: Read-only access to mattermost/mattermost and mattermost/enterprise.
      # Used by the Python script to fetch merged PRs and their release notes.
      # The built-in GITHUB_TOKEN is not sufficient because mattermost/enterprise
      # is a separate private repository.
      # Credentials needed in Settings → Secrets and variables → Actions:
      #   CHANGELOG_READ_CLIENT_ID   (variable)  — Client ID from the mattermost+enterprise GitHub App
      #   CHANGELOG_READ_PRIVATE_KEY (secret)    — Private key from the mattermost+enterprise GitHub App
      - name: Get read token (source repos)
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: readToken
        with:
          client-id: ${{ vars.CHANGELOG_READ_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_READ_PRIVATE_KEY }}
          owner: mattermost

      # App 2: Read/write access to this repo (mattermost/mattermost).
      # Used to check out the repo, push the changelog branch, and open the PR.
      # NOTE: the built-in GITHUB_TOKEN could technically do this now that the changelog
      # lives in this repo, but PRs opened with GITHUB_TOKEN do not trigger other
      # workflows — so CI would not run on the generated changelog PR. Using a GitHub
      # App token keeps CI working and preserves the bot identity used for the CLA
      # exemption.
      # Credentials needed in Settings → Secrets and variables → Actions:
      #   CHANGELOG_WRITE_CLIENT_ID   (variable) — Client ID from the write GitHub App
      #   CHANGELOG_WRITE_PRIVATE_KEY (secret)   — Private key from the write GitHub App
      - name: Get write token (this repo)
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: writeToken
        with:
          client-id: ${{ vars.CHANGELOG_WRITE_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_WRITE_PRIVATE_KEY }}
          owner: mattermost

      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.writeToken.outputs.token }}

      # This release's branch (or master before it is cut) and the previous release's
      # vX.Y.0 tag. The generator reads the Go version from the first, and plugin
      # versions, WebSocket events and schema migrations from the diff between them.
      - name: Fetch release refs
        env:
          HEAD_FETCH: ${{ needs.resolve.outputs.head_fetch }}
          BASE_FETCH: ${{ needs.resolve.outputs.base_fetch }}
        run: git fetch --no-tags --depth=1 origin "$HEAD_FETCH" ${BASE_FETCH:+"$BASE_FETCH"}

      # Reviewers edit the changelog PR directly, so a rerun must not overwrite it. In
      # auto mode an open PR is updated in place: the script adds only the notes from PRs
      # its body does not list yet, and every existing line is kept.
      - name: Find open changelog PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.writeToken.outputs.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          MODE: ${{ needs.resolve.outputs.mode }}
        run: |
          # Run the generator from this checkout even after the PR branch is checked out
          # below: that branch was cut when the PR was opened and may carry an older copy.
          cp .github/scripts/generate_changelog.py .github/scripts/changelog_release.py "$RUNNER_TEMP/"

          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "changelog/$VERSION" --state open --json number --jq '.[0].number // empty')"
          BODY_FILE=""
          UPDATED_AT=""
          if [ -n "$PR_NUMBER" ]; then
            BODY_FILE="$RUNNER_TEMP/changelog-pr-body.md"
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$BODY_FILE"
            UPDATED_AT="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json commits --jq '.commits[-1].committedDate')"
            echo "Open changelog PR: #$PR_NUMBER (branch last updated $UPDATED_AT)"
          fi
          case "$MODE" in
            dry_run)    SCRIPT_MODE=create; PUBLISH=none; BODY_FILE="" ;;
            regenerate) SCRIPT_MODE=create; PUBLISH=regenerate ;;
            *)
              if [ -n "$PR_NUMBER" ]; then SCRIPT_MODE=update; PUBLISH=update
              else SCRIPT_MODE=create; PUBLISH=create; fi ;;
          esac
          echo "Script mode: $SCRIPT_MODE, publish: $PUBLISH"
          {
            echo "number=$PR_NUMBER"
            echo "body_file=$BODY_FILE"
            echo "updated_at=$UPDATED_AT"
            echo "script_mode=$SCRIPT_MODE"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

      - name: Check out changelog PR branch
        if: steps.pr.outputs.script_mode == 'update'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          git fetch origin "changelog/$VERSION"
          git checkout -B "changelog/$VERSION" FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Generate changelog
        id: generate
        env:
          GITHUB_TOKEN: ${{ steps.readToken.outputs.token }} # Read-only token for fetching PRs from source repos
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # Enables AI categorization and formatting — add under Settings → Secrets and variables → Actions
          MILESTONE: ${{ needs.resolve.outputs.milestone }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REPOS: ${{ inputs.server_repos || 'mattermost/mattermost,mattermost/enterprise' }}
          RELEASE_TYPE: ${{ needs.resolve.outputs.release_type }}
          RELEASE_DATE: ${{ inputs.release_date }}
          GO_VERSION: ${{ inputs.go_version }}
          BLOG_POST_URL: ${{ inputs.blog_post_url }}
          CHANGELOG_PATH: ${{ needs.resolve.outputs.changelog }}
          RELEASE_HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
          RELEASE_BASE_REF: ${{ needs.resolve.outputs.base_ref }}
          # Docs pages linked from the entry are read as they are in the commit this run
          # checked out first, not on the changelog PR's older branch.
          DOCS_REF: ${{ github.sha }}
          MODE: ${{ steps.pr.outputs.script_mode }}
          PR_BODY_FILE: ${{ steps.pr.outputs.body_file }}
          # A PR opened before changelog-sources existed has no list. The run then proposes
          # one (PRs merged before the branch's last commit) for a reviewer to confirm.
          SOURCES_SEED_BEFORE: ${{ steps.pr.outputs.updated_at }}
          DRY_RUN: ${{ needs.resolve.outputs.mode == 'dry_run' }}
          OUTPUT_DIR: ${{ runner.temp }}/changelog-output
        run: python "$RUNNER_TEMP/generate_changelog.py"

      - name: Write run summary
        if: ${{ !cancelled() }}
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          SUMMARY="$RUNNER_TEMP/changelog-output/summary.md"
          [ -f "$SUMMARY" ] || exit 0
          {
            echo "Workflow mode: \`$MODE\` ($EVENT_NAME)"
            echo
            cat "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload changelog output
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: changelog-output
          path: ${{ runner.temp }}/changelog-output/
          if-no-files-found: error

      # Dispatch inputs and repo variables are bound to environment variables rather than
      # interpolated directly into the script body. Interpolated ${{ }} expressions are
      # substituted before bash runs, so a value containing shell metacharacters would be
      # executed as code alongside the write-scoped app token.
      - name: Create or update Pull Request
        id: publish
        if: steps.pr.outputs.publish != 'none'
        env:
          GH_TOKEN: ${{ steps.writeToken.outputs.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT_USER_NAME: ${{ vars.CHANGELOG_GIT_USERNAME }}
          COMMIT_USER_EMAIL: ${{ vars.CHANGELOG_GIT_EMAIL }}
          CHANGELOG_FILE: ${{ needs.resolve.outputs.changelog }}
          PUBLISH: ${{ steps.pr.outputs.publish }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CHANGED: ${{ steps.generate.outputs.changed }}
          ADDED_PRS: ${{ steps.generate.outputs.added_prs }}
          ADDED_DERIVED: ${{ steps.generate.outputs.added_derived }}
          CORRECTED: ${{ steps.generate.outputs.corrected }}
        run: |
          BODY_FILE="$RUNNER_TEMP/changelog-output/pr_body.md"
          git config user.name "$COMMIT_USER_NAME"
          git config user.email "$COMMIT_USER_EMAIL"

          if [ "$PUBLISH" = "update" ]; then
            # Already on the PR branch. New commits only, never a force-push, so every
            # edit made in the PR survives.
            if [ "$CHANGED" != "true" ]; then
              echo "No new release notes — changelog PR #$PR_NUMBER left unchanged"
              exit 0
            fi
            git add "$CHANGELOG_FILE"
            git diff --staged --quiet && echo "No changes to commit" && exit 0
            git commit -m "docs: add release notes from $ADDED_PRS newly merged PR(s) and $ADDED_DERIVED release change(s) to the $VERSION changelog, and correct ${CORRECTED:-0} bullet(s)"
            git push origin "HEAD:changelog/$VERSION"
            gh pr edit "$PR_NUMBER" --repo mattermost/mattermost --body-file "$BODY_FILE"
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # create or regenerate: a fresh branch from master, replacing any previous one.
          git checkout -B "changelog/$VERSION"
          git add "$CHANGELOG_FILE"
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: add changelog for $VERSION"
          git push origin "changelog/$VERSION" --force
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --repo mattermost/mattermost --body-file "$BODY_FILE"
          else
            PR_URL="$(gh pr create \
              --repo mattermost/mattermost \
              --draft \
              --title "$VERSION Changelog" \
              --body-file "$BODY_FILE" \
              --base master \
              --head "changelog/$VERSION")"
            PR_NUMBER="${PR_URL##*/}"
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Request reviewers by section
        if: steps.publish.outputs.number != '' && vars.CHANGELOG_SECTION_REVIEWERS != ''
        env:
          GH_TOKEN: ${{ steps.writeToken.outputs.token }}
          PR_NUMBER: ${{ steps.publish.outputs.number }}
          SECTION_REVIEWERS: ${{ vars.CHANGELOG_SECTION_REVIEWERS }}
        run: |
          REVIEWERS="$(python3 "$RUNNER_TEMP/changelog_release.py" reviewers "$RUNNER_TEMP/changelog-output/sections.json")"
          if [ -z "$REVIEWERS" ]; then
            echo "No reviewers configured for the sections this run added to"
            exit 0
          fi
          echo "Requesting review from $REVIEWERS"
          gh pr edit "$PR_NUMBER" --repo mattermost/mattermost --add-reviewer "$REVIEWERS" \
            || echo "::warning::Could not request review from $REVIEWERS on #$PR_NUMBER"
