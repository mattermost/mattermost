name: Generate Changelog
# Merge-only runs are named apart so changelog_automation.py can skip them when it looks for
# the generator's sections.json.
run-name: ${{ (github.event_name == 'release' || github.event.schedule == '37 * * * *' || inputs.mode == 'merge') && 'Changelog Release Day' || 'Generate Changelog' }}

# Runs on its own every weekday from the release's RC-1 (the vX.Y.0-rc1 tag) until the
# changelog is merged on release day, and on demand. The scheduled run works out the release itself
# (see the resolve job); its mode comes from the CHANGELOG_SCHEDULE_MODE repository
# variable and defaults to dry_run, so it previews into the run summary until that
# variable is set to auto.
#
# Every run's summary is also the changelog-status report: preflight, merged PRs missing
# a release note (by owner), notes that will need rewriting, the status of the sections
# no developer note fills (WebSocket events, schema changes, plugins, Go version,
# benchmarking), bullets the release branch has moved past, and the docs page each
# feature links to: the one its release note names on a Docs: line, else the one found
# by following its PR to the docs files it, or a docs PR naming its Jira key or linking
# it, changed. Every docs link in the generated text is checked against the docs
# sources; changelog-link-check.yml does the same for each changelog PR.
#
# Repository variables read here, all optional:
#   CHANGELOG_SCHEDULE_MODE     — auto | dry_run (default; dryrun also accepted) for
#                                 scheduled runs; anything else fails the run
#   CHANGELOG_SCHEDULE_FROM     — the first release scheduled runs take on (default
#                                 v12.2.0); earlier ones are finished by hand
#   CHANGELOG_ESR_VERSIONS      — releases that are ESRs, e.g. "v11.7, v12.4"; other
#                                 X.0 releases are major and the rest feature releases
#   CHANGELOG_SECTION_REVIEWERS — JSON mapping a section pattern to reviewers, e.g.
#                                 {"Upgrade Impact/*": ["org/team"], "API Changes": ["login"]};
#                                 requested on the changelog PR for the sections a run adds to
#   CHANGELOG_DEFAULT_REVIEWERS — logins or org/team slugs (comma or space separated)
#                                 requested, besides the section reviewers, when the PR is
#                                 marked ready for review
#   CHANGELOG_RELEASE_MANAGER   — GitHub login (or org/team) asked to review the blog link fix
#                                 PR; unset, no review is requested
#   CHANGELOG_AUTO_MERGE        — true to add the AutoMerge label to the changelog PR on Release
#                                 Day when every condition holds; anything else (the default,
#                                 false) only reports what would happen
#
# After the changelog PR is written, an auto run (CHANGELOG_SCHEDULE_MODE=auto, or a
# dispatch in auto mode) also:
#   - suggests a rewrite for each weak note the readiness report flags (machine-generated,
#     under six words, a bare ticket reference), as a review comment with a suggestion
#     block on that bullet, once per bullet, built from the PR's title, description and the
#     files it changes (PRs in this public repo only). It never edits the text. Suggestions
#     accepted, dismissed and pending are counted in sections.json's metrics;
#   - on the first scheduled run on or after RC-1 + 1 working day (T-15; weekends skipped),
#     marks the draft PR ready for review and requests the section and default reviewers,
#     unless the preflight has a blocking failure. A PR that was ready once is not marked again;
#   - sets the changelog labels on the source PRs in mattermost/mattermost and
#     mattermost/enterprise, so developers don't have to: Changelog/Done on each PR whose
#     note is in the entry, Changelog/Not Needed on each merged milestone PR skipped as
#     having no note (NONE or an opt-out label). A PR with the right label is skipped, one
#     with the other label (a person's choice) is left alone, and no label is removed.
#     Never in dry_run or regenerate. The run summary has counts per repo; a PR the token
#     can't label is listed in sections.json, which the release automation's status post reads.
#
# Release Day is the day the vX.Y.0 GitHub release is published (not as a pre-release). The
# hourly merge cron and a dispatch in merge mode run the merge job; the release's `released`
# event runs only merge-on-release, which starts that dispatch on master (see below). It
# never merges: it adds the team's AutoMerge label to the changelog PR, once, when the PR
# targets master, no "Release day: TBD" is left, the generator's report is clean (benchmarking
# ready, every note placed, no blocking preflight failure) and the blog link is set; the
# AutoMerge automation then merges after reviews and checks. A label someone took off is not
# added again. Otherwise the run summary lists what is missing. The report is the newest one
# from a run that published the PR (never a dry run's preview), and the PR is read again just
# before the label is added. When benchmarking needs a person (a supported-user Delta outside
# [-5%, +5%], or a report whose table can't be read), the generator writes no Performance
# bullet: a reviewer writes it in the PR ("Benchmarking test results ..."), with the
# performance team for a large Delta, and that bullet clears the condition.
#
# The blog link is found on the public releases category page only (a post whose slug starts
# with mattermost-vX-Y- or whose title names vX.Y), and committed to the changelog PR's branch.
# A link a person sets in the PR instead is the override, and is kept. If the post isn't listed by 23:00 UTC on Release
# Day, the releases category page is linked and the label added anyway. After the merge, until
# 10 working days after Release Day, once the post is listed and master links anything else,
# the job opens one PR (branch changelog/vX.Y.0-blog-link) changing only that link and requests
# review from CHANGELOG_RELEASE_MANAGER. It never pushes to master, and never opens a second fix
# PR for a release. Once the changelog PR is merged, it also swaps Changelog/Done for
# Changelog/Not Needed on each PR whose bullet a reviewer deleted, only where this workflow's
# app added Changelog/Done; a dispatch in merge mode does the same after a hand-merge.
#
# Every write-app token names its permissions: contents: write, pull-requests: write,
# checks: read and statuses: read, for mattermost/mattermost only. The labelling steps mint
# their own token for mattermost/mattermost and mattermost/enterprise with Pull requests:
# write only. No token here ever asks for actions or for any other repo.
#
# The write app's key (CHANGELOG_WRITE_PRIVATE_KEY) is a secret of the environment
# `release-write`, which only the master branch can use, so only reviewed, merged workflows can
# mint write tokens. Environment rules check the run's ref, so the jobs that mint
# (generate-changelog and merge) declare that environment and run only with ref master: on the
# schedule, or a workflow_dispatch on master. The `released` event's ref is the tag, so
# merge-on-release holds no secret: it checks the tag is a vX.Y.0 feature release and starts
# this workflow on master in merge mode with GITHUB_TOKEN (actions: write).
on:
  schedule:
    - cron: '0 6 * * 1-5'
    # The merge job only: on Release Day, until the changelog PR has the AutoMerge label, and for
    # 10 working days after it, until its blog link is the published post. Weekends too, so a
    # Friday release linked to the category page at 23:00 UTC is labelled that night.
    - cron: '37 * * * *'
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for changelog entry (e.g. v11.9.0)'
        required: true
        type: string
      milestone:
        description: 'Milestone title in the server repo — defaults to the version'
        required: false
        type: string
      server_repos:
        description: 'Comma-separated repos to pull PRs from'
        required: true
        default: 'mattermost/mattermost,mattermost/enterprise'
        type: string
      release_type:
        description: 'Release type: "auto" (major for vX.0, esr if listed in CHANGELOG_ESR_VERSIONS, otherwise feature), "feature", "major", or "esr"'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - feature
          - major
          - esr
      release_date:
        description: 'Release day date (e.g. 2026-07-16) — defaults to today if omitted'
        required: false
        type: string
      go_version:
        description: 'Go version used in this release (e.g. go1.26.4) — if omitted, read from the release branch''s server/build/Dockerfile.buildenv'
        required: false
        type: string
      blog_post_url:
        description: 'Blog post URL for the Improvements section — if omitted, auto-constructed from version (e.g. https://mattermost.com/blog/mattermost-v11-9-is-now-available/); set to the published post on Release Day'
        required: false
        type: string
      mode:
        description: 'auto: add notes from newly merged PRs to the open changelog PR without touching existing lines, or open a draft PR if there is none. regenerate: rebuild the entry from scratch, discarding edits made in the PR. dry_run: generate only, into the run summary and an artifact; nothing is pushed. merge: Release Day for the version: set the blog link and add the AutoMerge label if every condition holds and CHANGELOG_AUTO_MERGE is true; after a merge, reconcile the changelog labels.'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - regenerate
          - dry_run
          - merge

jobs:
  # Decides what the run is for. A scheduled run picks the release between its RC-1
  # and its entry being merged to master: the newest tagged release until its entry
  # lands (the tag is pushed about five working days before release day), else the
  # oldest cut branch with a vX.Y.0-rcN tag and no vX.Y.0 tag, from
  # CHANGELOG_SCHEDULE_FROM on. A cut branch without an RC yet is skipped. The diff base is the previous release's vX.Y.0 tag, or
  # its release branch until that is tagged. It also fails a dispatch whose version and
  # milestone disagree on the major version, which would file one release's notes
  # under another's.
  resolve:
    if: github.repository == 'mattermost/mattermost' && github.event_name != 'release' && inputs.mode != 'merge' && github.event.schedule != '37 * * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.release.outputs.run }}
      version: ${{ steps.release.outputs.version }}
      milestone: ${{ steps.release.outputs.milestone }}
      release_type: ${{ steps.release.outputs.release_type }}
      mode: ${{ steps.release.outputs.mode }}
      changelog: ${{ steps.release.outputs.changelog }}
      head_ref: ${{ steps.release.outputs.head_ref }}
      head_fetch: ${{ steps.release.outputs.head_fetch }}
      base_ref: ${{ steps.release.outputs.base_ref }}
      base_fetch: ${{ steps.release.outputs.base_fetch }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_MILESTONE: ${{ inputs.milestone }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          INPUT_MODE: ${{ inputs.mode }}
          SCHEDULE_MODE: ${{ vars.CHANGELOG_SCHEDULE_MODE }}
          SCHEDULE_FROM: ${{ vars.CHANGELOG_SCHEDULE_FROM || 'v12.2.0' }}
          ESR_VERSIONS: ${{ vars.CHANGELOG_ESR_VERSIONS }}
        run: python3 .github/scripts/changelog_release.py resolve

      - name: Explain skipped run
        if: steps.release.outputs.run != 'true'
        env:
          REASON: ${{ steps.release.outputs.reason }}
        run: |
          echo "Nothing to generate: $REASON" | tee -a "$GITHUB_STEP_SUMMARY"

  generate-changelog:
    needs: resolve
    # The write key is in `release-write`, which only master can use (see the top of this file).
    if: needs.resolve.outputs.run == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release-write
    # Two runs for the same release would both push to its changelog branch.
    concurrency:
      group: generate-changelog-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read

    steps:
      # App 1: Read-only access to mattermost/mattermost and mattermost/enterprise.
      # Used by the Python script to fetch merged PRs and their release notes.
      # The built-in GITHUB_TOKEN is not sufficient because mattermost/enterprise
      # is a separate private repository.
      # Credentials needed in Settings → Secrets and variables → Actions:
      #   CHANGELOG_READ_CLIENT_ID   (variable)  — Client ID from the mattermost+enterprise GitHub App
      #   CHANGELOG_READ_PRIVATE_KEY (secret)    — Private key from the mattermost+enterprise GitHub App
      - name: Get read token (source repos)
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: readToken
        with:
          client-id: ${{ vars.CHANGELOG_READ_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_READ_PRIVATE_KEY }}
          owner: mattermost

      # App 2: Read/write access to this repo (mattermost/mattermost).
      # Used to check out the repo, push the changelog branch, and open the PR.
      # NOTE: the built-in GITHUB_TOKEN could technically do this now that the changelog
      # lives in this repo, but PRs opened with GITHUB_TOKEN do not trigger other
      # workflows — so CI would not run on the generated changelog PR. Using a GitHub
      # App token keeps CI working and preserves the bot identity used for the CLA
      # exemption.
      # Credentials needed in Settings → Secrets and variables → Actions:
      #   CHANGELOG_WRITE_CLIENT_ID   (variable) — Client ID from the write GitHub App
      #   CHANGELOG_WRITE_PRIVATE_KEY (secret)   — Private key from the write GitHub App
      - name: Get write token (this repo)
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: writeToken
        with:
          client-id: ${{ vars.CHANGELOG_WRITE_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_WRITE_PRIVATE_KEY }}
          owner: mattermost
          repositories: mattermost
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.writeToken.outputs.token }}

      # This release's branch (or master before it is cut) and the previous release's
      # vX.Y.0 tag. The generator reads the Go version from the first, and plugin
      # versions, WebSocket events and schema migrations from the diff between them.
      - name: Fetch release refs
        env:
          HEAD_FETCH: ${{ needs.resolve.outputs.head_fetch }}
          BASE_FETCH: ${{ needs.resolve.outputs.base_fetch }}
        run: git fetch --no-tags --depth=1 origin "$HEAD_FETCH" ${BASE_FETCH:+"$BASE_FETCH"}

      # Reviewers edit the changelog PR directly, so a rerun must not overwrite it. In
      # auto mode an open PR is updated in place: the script adds only the notes from PRs
      # its body does not list yet, and every existing line is kept.
      - name: Find open changelog PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.writeToken.outputs.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          MODE: ${{ needs.resolve.outputs.mode }}
        run: |
          # Run the generator from this checkout even after the PR branch is checked out
          # below: that branch was cut when the PR was opened and may carry an older copy.
          cp .github/scripts/generate_changelog.py .github/scripts/changelog_release.py .github/scripts/check_config_changes_ci.py .github/scripts/changelog_automation.py "$RUNNER_TEMP/"

          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "changelog/$VERSION" --state open --json number --jq '.[0].number // empty')"
          BODY_FILE=""
          UPDATED_AT=""
          if [ -n "$PR_NUMBER" ]; then
            BODY_FILE="$RUNNER_TEMP/changelog-pr-body.md"
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$BODY_FILE"
            UPDATED_AT="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json commits --jq '.commits[-1].committedDate')"
            echo "Open changelog PR: #$PR_NUMBER (branch last updated $UPDATED_AT)"
          fi
          case "$MODE" in
            dry_run)    SCRIPT_MODE=create; PUBLISH=none; BODY_FILE="" ;;
            regenerate) SCRIPT_MODE=create; PUBLISH=regenerate ;;
            *)
              if [ -n "$PR_NUMBER" ]; then SCRIPT_MODE=update; PUBLISH=update
              else SCRIPT_MODE=create; PUBLISH=create; fi ;;
          esac
          echo "Script mode: $SCRIPT_MODE, publish: $PUBLISH"
          {
            echo "number=$PR_NUMBER"
            echo "body_file=$BODY_FILE"
            echo "updated_at=$UPDATED_AT"
            echo "script_mode=$SCRIPT_MODE"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

      - name: Check out changelog PR branch
        if: steps.pr.outputs.script_mode == 'update'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          git fetch origin "changelog/$VERSION"
          git checkout -B "changelog/$VERSION" FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Generate changelog
        id: generate
        env:
          GITHUB_TOKEN: ${{ steps.readToken.outputs.token }} # Read-only token for fetching PRs from source repos
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # Enables AI categorization and formatting — add under Settings → Secrets and variables → Actions
          MILESTONE: ${{ needs.resolve.outputs.milestone }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REPOS: ${{ inputs.server_repos || 'mattermost/mattermost,mattermost/enterprise' }}
          RELEASE_TYPE: ${{ needs.resolve.outputs.release_type }}
          RELEASE_DATE: ${{ inputs.release_date }}
          EVENT_NAME: ${{ github.event_name }} # a scheduled run writes the release day as TBD
          GO_VERSION: ${{ inputs.go_version }}
          BLOG_POST_URL: ${{ inputs.blog_post_url }}
          CHANGELOG_PATH: ${{ needs.resolve.outputs.changelog }}
          RELEASE_HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
          RELEASE_BASE_REF: ${{ needs.resolve.outputs.base_ref }}
          # Docs pages linked from the entry are read as they are in the commit this run
          # checked out first, not on the changelog PR's older branch.
          DOCS_REF: ${{ github.sha }}
          MODE: ${{ steps.pr.outputs.script_mode }}
          PR_BODY_FILE: ${{ steps.pr.outputs.body_file }}
          # A PR opened before changelog-sources existed has no list. The run then proposes
          # one (PRs merged before the branch's last commit) for a reviewer to confirm.
          SOURCES_SEED_BEFORE: ${{ steps.pr.outputs.updated_at }}
          DRY_RUN: ${{ needs.resolve.outputs.mode == 'dry_run' }}
          OUTPUT_DIR: ${{ runner.temp }}/changelog-output
        run: python "$RUNNER_TEMP/generate_changelog.py"

      - name: Write run summary
        if: ${{ !cancelled() }}
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          SUMMARY="$RUNNER_TEMP/changelog-output/summary.md"
          [ -f "$SUMMARY" ] || exit 0
          {
            echo "Workflow mode: \`$MODE\` ($EVENT_NAME)"
            echo
            cat "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"
          # A dry run's output is only read here and in the artifact; the log keeps a copy
          # that can be read without downloading it.
          if [ "$MODE" = "dry_run" ]; then
            echo "::group::Run summary"
            cat "$SUMMARY"
            echo "::endgroup::"
          fi

      # Dispatch inputs and repo variables are bound to environment variables rather than
      # interpolated directly into the script body. Interpolated ${{ }} expressions are
      # substituted before bash runs, so a value containing shell metacharacters would be
      # executed as code alongside the write-scoped app token.
      - name: Create or update Pull Request
        id: publish
        if: steps.pr.outputs.publish != 'none'
        env:
          GH_TOKEN: ${{ steps.writeToken.outputs.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT_USER_NAME: ${{ vars.CHANGELOG_GIT_USERNAME }}
          COMMIT_USER_EMAIL: ${{ vars.CHANGELOG_GIT_EMAIL }}
          CHANGELOG_FILE: ${{ needs.resolve.outputs.changelog }}
          PUBLISH: ${{ steps.pr.outputs.publish }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CHANGED: ${{ steps.generate.outputs.changed }}
          BODY_CHANGED: ${{ steps.generate.outputs.body_changed }}
          ADDED_PRS: ${{ steps.generate.outputs.added_prs }}
          ADDED_DERIVED: ${{ steps.generate.outputs.added_derived }}
          CORRECTED: ${{ steps.generate.outputs.corrected }}
        run: |
          BODY_FILE="$RUNNER_TEMP/changelog-output/pr_body.md"
          git config user.name "$COMMIT_USER_NAME"
          git config user.email "$COMMIT_USER_EMAIL"

          if [ "$PUBLISH" = "update" ]; then
            # Already on the PR branch. New commits only, never a force-push, so every
            # edit made in the PR survives.
            if [ "$CHANGED" != "true" ]; then
              # The text is unchanged, but the body may list notes the model left out.
              if [ "$BODY_CHANGED" = "true" ]; then
                gh api --method PATCH "repos/mattermost/mattermost/pulls/$PR_NUMBER" -F "body=@$BODY_FILE" --silent
                echo "No new release notes in the text — updated the body of changelog PR #$PR_NUMBER"
              else
                echo "No new release notes — changelog PR #$PR_NUMBER left unchanged"
              fi
              exit 0
            fi
            git add "$CHANGELOG_FILE"
            git diff --staged --quiet && echo "No changes to commit" && exit 0
            git commit -m "docs: add release notes from $ADDED_PRS newly merged PR(s) and $ADDED_DERIVED release change(s) to the $VERSION changelog, and correct ${CORRECTED:-0} bullet(s)"
            git push origin "HEAD:changelog/$VERSION"
            gh api --method PATCH "repos/mattermost/mattermost/pulls/$PR_NUMBER" -F "body=@$BODY_FILE" --silent
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # create or regenerate: a fresh branch from master, replacing any previous one.
          git checkout -B "changelog/$VERSION"
          git add "$CHANGELOG_FILE"
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: add changelog for $VERSION"
          git push origin "changelog/$VERSION" --force
          if [ -n "$PR_NUMBER" ]; then
            gh api --method PATCH "repos/mattermost/mattermost/pulls/$PR_NUMBER" -F "body=@$BODY_FILE" --silent
          else
            PR_URL="$(gh pr create \
              --repo mattermost/mattermost \
              --draft \
              --title "$VERSION Changelog" \
              --body-file "$BODY_FILE" \
              --base master \
              --head "changelog/$VERSION")"
            PR_NUMBER="${PR_URL##*/}"
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # The report says which PR it describes. A dry run never gets here, so its preview is never
      # read as the PR's report on Release Day or by the label reconcile.
      - name: Record the published PR in the report
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && (steps.publish.outputs.number != '' || steps.pr.outputs.number != '') }}
        env:
          PR_NUMBER: ${{ steps.publish.outputs.number || steps.pr.outputs.number }}
          MODE: ${{ needs.resolve.outputs.mode }}
          OUTPUT_DIR: ${{ runner.temp }}/changelog-output
        run: HEAD_SHA="$(git rev-parse HEAD)" python3 "$RUNNER_TEMP/changelog_automation.py" published

      # Reviewers are requested with REST (changelog_automation.py request-reviewers), which the
      # write token's Pull requests: write is enough for, teams included.
      - name: Request reviewers by section
        if: steps.publish.outputs.number != '' && vars.CHANGELOG_SECTION_REVIEWERS != ''
        env:
          GH_TOKEN: ${{ steps.writeToken.outputs.token }}
          PR_NUMBER: ${{ steps.publish.outputs.number }}
          SECTION_REVIEWERS: ${{ vars.CHANGELOG_SECTION_REVIEWERS }}
        run: |
          REVIEWERS="$(python3 "$RUNNER_TEMP/changelog_release.py" reviewers "$RUNNER_TEMP/changelog-output/sections.json")"
          if [ -z "$REVIEWERS" ]; then
            echo "No reviewers configured for the sections this run added to"
            exit 0
          fi
          echo "Requesting review from $REVIEWERS"
          REVIEWERS="$REVIEWERS" python3 "$RUNNER_TEMP/changelog_automation.py" request-reviewers

      # An auto run only; the scripts are the copies made from this checkout above.
      # Marks the draft PR ready on the first scheduled run on or after RC-1 + 1 working
      # day (T-15), unless the preflight has a blocking failure or the PR was ready once before.
      - name: Decide whether to mark the PR ready
        id: ready
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && github.event_name == 'schedule' && needs.resolve.outputs.mode == 'auto' && (steps.publish.outputs.number != '' || steps.pr.outputs.number != '') }}
        env:
          GH_TOKEN: ${{ steps.writeToken.outputs.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PR_NUMBER: ${{ steps.publish.outputs.number || steps.pr.outputs.number }}
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ needs.resolve.outputs.mode }}
          OUTPUT_DIR: ${{ runner.temp }}/changelog-output
          SECTION_REVIEWERS: ${{ vars.CHANGELOG_SECTION_REVIEWERS }}
          DEFAULT_REVIEWERS: ${{ vars.CHANGELOG_DEFAULT_REVIEWERS }}
        run: python3 "$RUNNER_TEMP/changelog_automation.py" ready

      - name: Mark the PR ready for review
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.writeToken.outputs.token }}
          PR_NUMBER: ${{ steps.publish.outputs.number || steps.pr.outputs.number }}
          REVIEWERS: ${{ steps.ready.outputs.reviewers }}
        run: |
          gh pr ready "$PR_NUMBER" --repo mattermost/mattermost
          python3 "$RUNNER_TEMP/changelog_automation.py" request-reviewers

      # A PR marked ready on an earlier run whose reviewer request failed: nobody is asked to
      # review it and nobody has, so the request is made again (the PR is not marked ready again).
      - name: Request reviewers again
        if: steps.ready.outputs.request == 'true'
        env:
          GH_TOKEN: ${{ steps.writeToken.outputs.token }}
          PR_NUMBER: ${{ steps.publish.outputs.number || steps.pr.outputs.number }}
          REVIEWERS: ${{ steps.ready.outputs.reviewers }}
        run: python3 "$RUNNER_TEMP/changelog_automation.py" request-reviewers

      # A review comment with a suggestion block on each weak bullet, once per bullet.
      # Comments only: the changelog text is never edited. The counts of suggestions
      # accepted, dismissed and pending go into sections.json's metrics.
      # Optional: a failure here must not fail the run, or Release Day, which reads only
      # successful runs' reports, would read an older report than the one just published.
      - name: Suggest rewrites for weak notes
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && needs.resolve.outputs.mode == 'auto' && (steps.publish.outputs.number != '' || steps.pr.outputs.number != '') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.writeToken.outputs.token }}
          SOURCE_TOKEN: ${{ steps.readToken.outputs.token }} # reads the source PRs; only this repo's get a rewrite
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PR_NUMBER: ${{ steps.publish.outputs.number || steps.pr.outputs.number }}
          OUTPUT_DIR: ${{ runner.temp }}/changelog-output
        run: python3 "$RUNNER_TEMP/changelog_automation.py" suggest

      # Changelog/Done and Changelog/Not Needed on the source PRs, after the PR is updated.
      # An auto run only: never dry_run or regenerate. Writes what it did into sections.json;
      # the summary has counts only. The source PRs are in mattermost/mattermost and
      # mattermost/enterprise: a token for those two repos with Pull requests: write only.
      # Labels are best effort: a token that can't be minted skips labelling (with a
      # warning), never the rest of the run.
      - name: Get labels token (source repos)
        id: labelToken
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && needs.resolve.outputs.mode == 'auto' }}
        continue-on-error: true
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ vars.CHANGELOG_WRITE_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_WRITE_PRIVATE_KEY }}
          owner: mattermost
          repositories: mattermost,enterprise
          permission-pull-requests: write

      - name: Explain a failed labels token
        if: ${{ !cancelled() && steps.labelToken.outcome == 'failure' }}
        run: echo "::warning title=Changelog labels not set::Could not get a changelog write app token for mattermost/mattermost and mattermost/enterprise with Pull requests write, so no labels were set this run."

      - name: Set changelog labels on the source PRs
        if: ${{ !cancelled() && steps.labelToken.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.labelToken.outputs.token }}
          MODE: ${{ needs.resolve.outputs.mode }}
          OUTPUT_DIR: ${{ runner.temp }}/changelog-output
        run: python3 "$RUNNER_TEMP/changelog_automation.py" label

      # Last, so the artifact carries the suggestion metrics and labels written to sections.json.
      # The release automation's daily status post reads it from here.
      - name: Upload changelog output
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: changelog-output
          path: ${{ runner.temp }}/changelog-output/
          if-no-files-found: error

  # Release Day: the `released` event of the vX.Y.0 GitHub release, the hourly cron, or a
  # dispatch in merge mode. Sets the blog link and adds the AutoMerge label when
  # CHANGELOG_AUTO_MERGE is true and nothing is missing; the AutoMerge automation merges.
  # Otherwise the run summary lists what is missing. It never merges itself.
  # The `released` event's run has the tag as its ref, so it can't use `release-write`: this job
  # holds no secret and only starts the merge job on master, for a vX.Y.0 feature release.
  merge-on-release:
    if: github.repository == 'mattermost/mattermost' && github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write # start this workflow on master
    steps:
      - name: Start the Release Day merge on master
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            echo "Not a feature release (vX.Y.0), so the changelog PR is left as it is." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run generate-changelog.yml --repo "$GITHUB_REPOSITORY" --ref master -f version="$TAG" -f mode=merge
          echo "Started the Release Day merge for $TAG on master." | tee -a "$GITHUB_STEP_SUMMARY"

  merge:
    if: github.repository == 'mattermost/mattermost' && github.ref == 'refs/heads/master' && (github.event.schedule == '37 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'merge'))
    runs-on: ubuntu-latest
    environment: release-write
    concurrency:
      group: generate-changelog-merge
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # the generator's report is read from its last run's artifact
    steps:
      - name: Get write token (this repo)
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: writeToken
        with:
          client-id: ${{ vars.CHANGELOG_WRITE_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_WRITE_PRIVATE_KEY }}
          owner: mattermost
          repositories: mattermost
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      # Only for swapping the changelog labels on the source PRs in both repos after the merge:
      # Pull requests: write only. It never blocks the AutoMerge label: without it, only the
      # swap is skipped (the summary says so).
      - name: Get labels token (source repos)
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: labelToken
        continue-on-error: true
        with:
          client-id: ${{ vars.CHANGELOG_WRITE_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_WRITE_PRIVATE_KEY }}
          owner: mattermost
          repositories: mattermost,enterprise
          permission-pull-requests: write

      # master, not the release tag a `released` event would check out: the tag may have been
      # cut before changelog_automation.py existed.
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          persist-credentials: false

      - name: Label the changelog PR for AutoMerge if it is ready
        env:
          GH_TOKEN: ${{ steps.writeToken.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          AUTO_MERGE: ${{ vars.CHANGELOG_AUTO_MERGE }}
          # GitHub login (or org/team) asked to review the blog link fix PR.
          RELEASE_MANAGER: ${{ vars.CHANGELOG_RELEASE_MANAGER }}
          LABEL_TOKEN: ${{ steps.labelToken.outputs.token }}
          # Changelog/Done is swapped only on PRs this app labelled.
          LABEL_ACTOR: ${{ steps.labelToken.outputs.app-slug }}[bot]
        run: python3 .github/scripts/changelog_automation.py merge
