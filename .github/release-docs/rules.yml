# Rules the release docs tasks read. Edit by PR; the tests load this file.

breaking_changes:
  # Release-note phrases that are strong evidence of a breaking change, matched case-insensitively
  # as whole words. Other wording ("removed", "no longer", "must now") stays a weak signal.
  strong_phrases:
    - breaking change
    - no longer supported
    - will fail to start
    - must be re-signed
    - before upgrading
    - is removed
    - deprecated
