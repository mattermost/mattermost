---
name: Wait for server image
description: >-
  Polls Docker Hub until the server image under test has a manifest, so a lane whose image is
  pushed late waits once instead of failing every worker's pull, and a lane whose image is never
  pushed fails once with a clear error. A registry that cannot be reached is not read as a
  missing image: the action warns and passes.
inputs:
  image:
    description: Image reference, <namespace>/<name>:<tag> on Docker Hub
    required: true
  timeout-minutes:
    description: How long to keep polling while the registry answers "not found"
    required: false
    default: "5"
  interval-seconds:
    description: Seconds between polls
    required: false
    default: "30"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        INTERVAL_SECONDS: ${{ inputs.interval-seconds }}
      run: bash "${GITHUB_ACTION_PATH}/wait.sh"
