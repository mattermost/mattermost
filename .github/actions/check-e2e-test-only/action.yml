---
name: Check E2E Test Only
description: Check if PR contains only E2E test changes and determine the appropriate docker image tag

inputs:
  base_sha:
    description: Base commit SHA (PR base)
    required: false
  head_sha:
    description: Head commit SHA (PR head)
    required: false
  pr_number:
    description: PR number (used to fetch SHAs via API if base_sha/head_sha not provided)
    required: false

outputs:
  e2e_test_only:
    description: Whether the PR contains only E2E test changes (true/false)
    value: ${{ steps.check.outputs.e2e_test_only }}
  image_tag:
    description: Docker image tag to use (base branch ref for E2E-only, short SHA for mixed)
    value: ${{ steps.check.outputs.image_tag }}

runs:
  using: composite
  steps:
    - name: ci/check-e2e-test-only
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        INPUT_BASE_SHA: ${{ inputs.base_sha }}
        INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        INPUT_PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        set -euo pipefail
        BASE_REF="master"
        if [ -n "$INPUT_PR_NUMBER" ]; then
          [[ "$INPUT_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          PR_DATA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${INPUT_PR_NUMBER}")
          CURRENT_HEAD=$(jq -er '.head.sha' <<< "$PR_DATA")
          [[ "$(jq -r '.state' <<< "$PR_DATA")" = "open" ]]
          BASE_REF=$(jq -er '.base.ref' <<< "$PR_DATA")
          if [ -z "$INPUT_BASE_SHA" ] && [ -z "$INPUT_HEAD_SHA" ]; then
            INPUT_BASE_SHA=$(jq -er '.base.sha' <<< "$PR_DATA")
            INPUT_HEAD_SHA="$CURRENT_HEAD"
          else
            # Never switch a frozen test/image identity to a later PR head.
            [[ "$INPUT_HEAD_SHA" = "$CURRENT_HEAD" ]]
          fi
        fi
        [[ "$INPUT_BASE_SHA" =~ ^[a-f0-9]{40}$ && "$INPUT_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
        git fetch --no-tags origin "$INPUT_BASE_SHA" "$INPUT_HEAD_SHA"
        # The immutable Git diff includes deletions and both sides of renames.
        # A Git failure cannot become a truncated API page or an empty diff.
        SCOPE=$(node "${GITHUB_ACTION_PATH}/../../scripts/e2e-change-scope.mjs" --base "$INPUT_BASE_SHA" --head "$INPUT_HEAD_SHA")
        E2E_TEST_ONLY=$(jq -er '.e2e_test_only | tostring' <<< "$SCOPE")
        printf '%s\n' "$SCOPE"
        if [ "$E2E_TEST_ONLY" = "true" ] && { [ "$BASE_REF" = "master" ] || [[ "$BASE_REF" =~ ^release-[0-9]+\.[0-9]+$ ]]; }; then
          echo "image_tag=${BASE_REF}" >> "$GITHUB_OUTPUT"
        else
          echo "image_tag=${INPUT_HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
        fi
