        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/api/v4/bots/{bot_user_id}/events":
    get:
      tags:
        - bots
      summary: Pull the events of a bot
      description: |
        Get the events waiting for a bot with a `pull` event subscription, oldest first.

        Delivery is at-least-once. Events are ordered by `(created_at, event_id)`, and an event only
        becomes readable about one second after it was created, so that events from concurrently
        running servers are never skipped. Expect a latency of roughly one second. This relies on
        every event being committed within one second of its creation, which holds under normal
        database load.

        Passing the `next_cursor` of a previous response as `cursor` acknowledges every event up
        to it; acknowledged events are never returned again. Without a `cursor` nothing is acknowledged
        and the same events are returned again. Events that are not acknowledged are deleted after
        7 days. A reverse proxy in front of the server must allow requests to last as long as `wait`.

        With `wait`, the request is held until events are available or the wait elapses, whichever
        comes first, and responds with an empty list in the latter case. The wait is limited to 60 seconds
        and to the server's write timeout minus 5 seconds.

        ##### Permissions
        The request must be made with a session of the bot itself, for example one of its personal
        access tokens.

        __Minimum server version__: 12.2
      operationId: GetBotEvents
      parameters:
        - name: bot_user_id
          in: path
          description: Bot user ID
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          description: >
            The `next_cursor` of a previous response. Acknowledges all events up to it.
            A cursor more than 60 seconds ahead of the server clock is rejected.
          schema:
            type: string
        - name: limit
          in: query
          description: The maximum number of events to return. Values above 500 are reduced to 500.
          schema:
            type: integer
            default: 100
        - name: wait
          in: query
          description: >
            The number of seconds to wait for events when there are none. Values above 60 are
            reduced to 60.
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Events retrieval successful. The list is empty when there are none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotEventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
