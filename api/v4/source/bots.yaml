      summary: Enable a bot event subscription
      description: |
        Re-enable a disabled event subscription and reset its delivery failure state. Enabling a
        subscription that is already enabled has no effect, including on its failure state. In `push` mode, delivery resumes from the
        first event that was not acknowledged.

        ##### Permissions
        Must have `manage_bots` permission for bots you own, and `manage_others_bots` permission for bots
        others own.

        __Minimum server version__: 12.2
      operationId: EnableBotEventSubscription
      parameters:
