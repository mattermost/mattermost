                              `attrs.options` don't include `parents`.
                    value_type:
                      type: string
                      description: "Type of text value"
                      enum: ["email", "url", "phone"]
                    ldap:
                      type: string
                      description: >
                        AD/LDAP attribute to sync the value from. `text` fields
                        only; cleared on other types.
                    saml:
                      type: string
                      description: >
                        SAML attribute to sync the value from. `text` fields
                        only; cleared on other types.
                    managed:
                      type: string
                      description: >
                        `admin` lets only system administrators set the
                        attribute's values. Only system administrators can set `managed`.
                      enum: ["", "admin"]
                      default: ""
                    protected:
                      type: boolean
                      description: "If true, the field is read-only and cannot be modified."
                    source_plugin_id:
                      type: string
                      description: "The ID of the plugin that created this field. This attribute cannot be changed."
                    access_mode:
                      type: string
                      description: "Access mode of the field"
                      enum: ["", "source_only", "shared_only"]
                      default: ""
                    display_name:
                      type: string
                      description: >
                        Human-readable label shown in the UI. Maximum 255 characters.
      responses:
        "200":
          description: Custom Profile Attribute field patch successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyField"
        "400":
          description: >
            The request is invalid, or the field is linked to a global
            attribute template (error ID
            `api.custom_profile_attributes.linked_field.app_error`), as fields
            created before v12.0 or in Attribute Management are. Change a
            linked field through the Properties API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            Validation error. Returned when a `name` change does not match
            the required identifier pattern, is a CEL reserved word, or
            when `attrs.display_name` exceeds 255 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"

