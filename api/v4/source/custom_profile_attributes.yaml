  "/api/v4/custom_profile_attributes/values":
    patch:
      deprecated: true
      tags:
        - custom profile attributes
      summary: Patch Custom Profile Attribute values
      description: |
        Update the requester's own Custom Profile Attribute values. The body
        and the response are maps from field ID to value; fields left out
        are unchanged. Values of fields with `attrs.protected = true` can't be
        updated.

        Replaced by
        `PATCH /api/v4/properties/groups/access_control/user/values/{user_id}`
        with your own user ID.

        __Minimum server version__: 10.5

        ##### Permissions
        Must be authenticated.
      operationId: PatchCPAValues
      requestBody:
        description: Custom Profile Attribute values that are to be updated
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                A map from field ID to the new value, with between 1 and 50
                entries. A `text`, `select`, `rank`, `date` or `user` value is
                a string (an option ID for `select` and `rank`); a
                `multiselect`, `graph` or `multiuser` value is an array of
                strings (option IDs or user IDs). JSON `null` clears a value.
              minProperties: 1
              maxProperties: 50
              additionalProperties:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                  - nullable: true
                    enum:
                      - null
      responses:
        "200":
          description: Custom Profile Attribute values patch successful
          content:
            application/json:
              schema:
                type: object
                description: >
                  A map from field ID to the value that was saved. JSON `null`
                  means the value was cleared.
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                    - nullable: true
                      enum:
                        - null
        "400":
          description: >
            The request is invalid, including a map with no entries or more
            than 50.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: A field ID in the request doesn't exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
