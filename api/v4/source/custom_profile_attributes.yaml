  "/api/v4/custom_profile_attributes/fields":
    get:
      deprecated: true
      tags:
        - custom profile attributes
      summary: List all the Custom Profile Attributes fields
      description: |
        List all the Custom Profile Attributes fields, including those linked
        to a global attribute template. A field with more than 1000 options
        omits `attrs.options` and sets `attrs.options_count` and
        `attrs.options_omitted`.

        Replaced by `GET /api/v4/properties/groups/access_control/user/fields`.

        __Minimum server version__: 10.5

        ##### Permissions
        Must be authenticated.
      operationId: ListAllCPAFields
      responses:
        "200":
          description: Custom Profile Attributes fetch successful. Result may be empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PropertyField"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      deprecated: true
      tags:
        - custom profile attributes
      summary: Create a Custom Profile Attribute field
      description: |
        Create a Custom Profile Attribute field. The field isn't linked to a
        global attribute template.

        Replaced by the Properties API: to add a user attribute the way
        Attribute Management does, create a `template` field, then a `user`
        field with `linked_field_id` set to the template's ID.

        __Minimum server version__: 10.5

        ##### Permissions
        Must have `manage_system` permission.
      operationId: CreateCPAField
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
              properties:
                name:
                  type: string
                  description: >
                    The internal identifier for this attribute. Must match
                    `^[A-Za-z_][A-Za-z0-9_]*$` and must not be a CEL reserved
                    word (true, false, null, in, as, break, const, continue, else,
                    for, function, if, import, let, loop, package, namespace,
                    return, var, void, while). This name is used in ABAC policy
                    expressions as `user.attributes.<name>`.
                type:
                  type: string
                  description: >
                    The type of attribute. `rank` is a select with ordered
                    options; `graph` is a multiselect whose options can sit
                    below other options.
                  enum: [text, select, multiselect, date, user, multiuser, rank, graph]
                attrs:
                  type: object
                  properties:
                    visibility:
                      type: string
                      description: "Visibility of the attribute"
                      enum: ["hidden", "when_set", "always"]
                      default: "when_set"
                    sort_order:
                      type: number
                      description: "Sort order for displaying this attribute"
                    options:
                      type: array
                      description: "Options for select, multiselect, rank and graph fields"
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          color:
                            type: string
                          rank:
                            type: integer
                            description: >
                              `rank` fields only, required: the option's
                              position, a unique positive integer.
                          parents:
                            type: array
                            items:
                              type: string
                            description: >
                              `graph` fields only: the names of the options
                              directly above this one. Options read back from
                              `attrs.options` don't include `parents`.
                    value_type:
                      type: string
                      description: "Type of text value"
                      enum: ["email", "url", "phone"]
                    ldap:
                      type: string
                      description: >
                        AD/LDAP attribute to sync the value from. `text` fields
                        only; cleared on other types.
                    saml:
                      type: string
                      description: >
                        SAML attribute to sync the value from. `text` fields
                        only; cleared on other types.
                    managed:
                      type: string
                      description: >
                        `admin` lets only system administrators set the
                        attribute's values. Only system administrators can set `managed`.
                      enum: ["", "admin"]
                      default: ""
                    protected:
                      type: boolean
                      description: "If true, the field is read-only and cannot be modified."
                    source_plugin_id:
                      type: string
                      description: "The ID of the plugin that created this field. This attribute cannot be changed."
                    access_mode:
                      type: string
                      description: "Access mode of the field"
                      enum: ["", "source_only", "shared_only"]
                      default: ""
                    display_name:
                      type: string
                      description: >
                        Human-readable label shown in the UI. Defaults to the field
                        `name` when omitted or empty. Maximum 255 characters.
      responses:
        "201":
          description: Custom Profile Attribute field creation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyField"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            Validation error. Returned when `name` does not match the
            required identifier pattern, is a CEL reserved word, or when
            `attrs.display_name` exceeds 255 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"

