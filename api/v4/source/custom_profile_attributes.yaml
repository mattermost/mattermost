      summary: Patch a Custom Profile Attribute field
      description: |
        Partially update a Custom Profile Attribute field. Only the fields
        in the request body can be updated; omitted fields are unchanged.
        Fields with `attrs.protected = true`, and fields linked to a global
        attribute template, can't be changed.

        Replaced by
        `PATCH /api/v4/properties/groups/access_control/user/fields/{field_id}`.

        __Minimum server version__: 10.5

        ##### Permissions
        Must have `manage_system` permission.
      operationId: PatchCPAField
      parameters:
        - name: field_id
          in: path
          description: Custom Profile Attribute field GUID
          required: true
          schema:
            type: string
      requestBody:
        description: Custom Profile Attribute field that is to be updated
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: >
                    New name for the attribute. When changed, must match
                    `^[A-Za-z_][A-Za-z0-9_]*$` and must not be a CEL reserved
                    word. Pre-existing fields with non-conforming names remain
                    patchable on all other attributes; the validation only fires
                    when `name` actually changes.
                type:
                  type: string
                  description: >
