  "/api/v4/custom_profile_attributes/fields":
    get:
      deprecated: true
      tags:
        - custom profile attributes
      summary: List all the Custom Profile Attributes fields
      description: |
        List all the Custom Profile Attributes fields.

        The list includes every user attribute, whether or not it's linked
        to a global attribute template. A field with more than 1000 options is
        returned without `attrs.options`; `attrs.options_count` holds the
        number of options and `attrs.options_omitted` is `true`.

        **Deprecated since v12.0.** Use the Properties API
        (`GET /api/v4/properties/groups/access_control/user/fields`) instead.
        This endpoint will be removed in a future release.

        **License:** requires an Entry, Enterprise or Enterprise Advanced
        license (403 otherwise).

        __Minimum server version__: 10.5

        ##### Permissions
        Must be authenticated.
      operationId: ListAllCPAFields
      responses:
        "200":
          description: Custom Profile Attributes fetch successful. Result may be empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PropertyField"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      deprecated: true
      tags:
        - custom profile attributes
      summary: Create a Custom Profile Attribute field
      description: |
        Create a new Custom Profile Attribute field on the system.

        The new field isn't linked to a global attribute template. To add a
        user attribute the way the System Console's Attribute Management page
        does, create a template with
        `POST /api/v4/properties/groups/access_control/template/fields`, then
        a user field linked to it with
        `POST /api/v4/properties/groups/access_control/user/fields`, setting
        `linked_field_id` to the template's ID.

        **Deprecated since v12.0.** Use the Properties API
        (`/api/v4/properties/groups/access_control/user/...`) instead. This
        endpoint will be removed in a future release.

        **License:** requires an Entry, Enterprise or Enterprise Advanced
        license (403 otherwise).

        __Minimum server version__: 10.5

        ##### Permissions
        Must have `manage_system` permission.
      operationId: CreateCPAField
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
              properties:
                name:
                  type: string
                  description: >
                    The internal identifier for this attribute. Must match
                    `^[A-Za-z_][A-Za-z0-9_]*$` and must not be a CEL reserved
                    word (true, false, null, in, as, break, const, continue, else,
                    for, function, if, import, let, loop, package, namespace,
                    return, var, void, while). This name is used in ABAC policy
                    expressions as `user.attributes.<name>`.
                type:
                  type: string
                  description: >
                    The type of attribute. `rank` is a select whose options are
                    ordered by the `rank` each option carries. `graph` is a
                    hierarchical multiselect: its options can sit below other
                    options.
                  enum: [text, select, multiselect, date, user, multiuser, rank, graph]
                attrs:
                  type: object
                  properties:
                    visibility:
                      type: string
                      description: "Visibility of the attribute"
                      enum: ["hidden", "when_set", "always"]
                      default: "when_set"
                    sort_order:
                      type: number
                      description: "Sort order for displaying this attribute"
                    options:
                      type: array
                      description: "Options for select, multiselect, rank and graph fields"
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          color:
                            type: string
                          rank:
                            type: integer
                            description: >
                              `rank` fields only: the option's position in the
                              field's order. Every option of a `rank` field
                              needs one, and ranks must be unique positive
                              integers.
                          parents:
                            type: array
                            items:
                              type: string
                            description: >
                              `graph` fields only: the names of the options
                              directly above this one. Options read back from
                              `attrs.options` don't include `parents`.
                    value_type:
                      type: string
                      description: "Type of text value"
                      enum: ["email", "url", "phone"]
                    ldap:
                      type: string
                      description: >
                        AD/LDAP attribute to sync the value from. Only `text`
                        fields can be synced; the server clears this on other
                        types.
                    saml:
                      type: string
                      description: >
                        SAML attribute to sync the value from. Only `text`
                        fields can be synced; the server clears this on other
                        types.
                    managed:
                      type: string
                      description: >
                        Set to `admin` so that only system administrators can
                        set the attribute's values. Only a system administrator
                        can set it.
                      enum: ["", "admin"]
                      default: ""
                    protected:
                      type: boolean
                      description: "If true, the field is read-only and cannot be modified."
                    source_plugin_id:
                      type: string
                      description: "The ID of the plugin that created this field. This attribute cannot be changed."
                    access_mode:
                      type: string
                      description: "Access mode of the field"
                      enum: ["", "source_only", "shared_only"]
                      default: ""
                    display_name:
                      type: string
                      description: >
                        Human-readable label shown in the UI. Defaults to the field
                        `name` when omitted or empty. Maximum 255 characters.
      responses:
        "201":
          description: Custom Profile Attribute field creation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyField"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            Validation error. Returned when `name` does not match the
            required identifier pattern, is a CEL reserved word, or when
            `attrs.display_name` exceeds 255 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"

  "/api/v4/custom_profile_attributes/fields/{field_id}":
    patch:
      deprecated: true
      tags:
        - custom profile attributes
      summary: Patch a Custom Profile Attribute field
      description: |
        Partially update a Custom Profile Attribute field by providing
        only the fields you want to update. Omitted fields will not be
        updated. The fields that can be updated are defined in the
        request body, all other provided fields will be ignored.

        **Note:** Fields with `attrs.protected = true` cannot be
        modified and will return an error.

        A field linked to a global attribute template can't be changed
        through this endpoint and returns 400. Change the template, or the
        linked user field, through the Properties API instead.

        **Deprecated since v12.0.** Use the Properties API
        (`PATCH /api/v4/properties/groups/access_control/user/fields/{field_id}`)
        instead. This endpoint will be removed in a future release.

        **License:** requires an Entry, Enterprise or Enterprise Advanced
        license (403 otherwise).

        __Minimum server version__: 10.5

        ##### Permissions
        Must have `manage_system` permission.
      operationId: PatchCPAField
      parameters:
        - name: field_id
          in: path
          description: Custom Profile Attribute field GUID
          required: true
          schema:
            type: string
      requestBody:
        description: Custom Profile Attribute field that is to be updated
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: >
                    New name for the attribute. When changed, must match
                    `^[A-Za-z_][A-Za-z0-9_]*$` and must not be a CEL reserved
                    word. Pre-existing fields with non-conforming names remain
                    patchable on all other attributes; the validation only fires
                    when `name` actually changes.
                type:
                  type: string
                  description: >
                    The type of attribute. `rank` is a select whose options are
                    ordered by the `rank` each option carries. `graph` is a
                    hierarchical multiselect: its options can sit below other
                    options.
                  enum: [text, select, multiselect, date, user, multiuser, rank, graph]
                attrs:
                  type: object
                  properties:
                    visibility:
                      type: string
                      description: "Visibility of the attribute"
                      enum: ["hidden", "when_set", "always"]
                      default: "when_set"
                    sort_order:
                      type: number
                      description: "Sort order for displaying this attribute"
                    options:
                      type: array
                      description: "Options for select, multiselect, rank and graph fields"
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          color:
                            type: string
                          rank:
                            type: integer
                            description: >
                              `rank` fields only: the option's position in the
                              field's order. Every option of a `rank` field
                              needs one, and ranks must be unique positive
                              integers.
                          parents:
                            type: array
                            items:
                              type: string
                            description: >
                              `graph` fields only: the names of the options
                              directly above this one. Options read back from
                              `attrs.options` don't include `parents`.
                    value_type:
                      type: string
                      description: "Type of text value"
                      enum: ["email", "url", "phone"]
                    ldap:
                      type: string
                      description: >
                        AD/LDAP attribute to sync the value from. Only `text`
                        fields can be synced; the server clears this on other
                        types.
                    saml:
                      type: string
                      description: >
                        SAML attribute to sync the value from. Only `text`
                        fields can be synced; the server clears this on other
                        types.
                    managed:
                      type: string
                      description: >
                        Set to `admin` so that only system administrators can
                        set the attribute's values. Only a system administrator
                        can set it.
                      enum: ["", "admin"]
                      default: ""
                    protected:
                      type: boolean
                      description: "If true, the field is read-only and cannot be modified."
                    source_plugin_id:
                      type: string
                      description: "The ID of the plugin that created this field. This attribute cannot be changed."
                    access_mode:
                      type: string
                      description: "Access mode of the field"
                      enum: ["", "source_only", "shared_only"]
                      default: ""
                    display_name:
                      type: string
                      description: >
                        Human-readable label shown in the UI. Maximum 255 characters.
      responses:
        "200":
          description: Custom Profile Attribute field patch successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyField"
        "400":
          description: >
            The request is invalid, or the field is linked to a global
            attribute template (error ID
            `api.custom_profile_attributes.linked_field.app_error`). Fields
            created before v12.0 are linked to a template when the server is
            upgraded, and fields created in Attribute Management are always
            linked. Change a linked field through the Properties API instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            Validation error. Returned when a `name` change does not match
            the required identifier pattern, is a CEL reserved word, or
            when `attrs.display_name` exceeds 255 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"

    delete:
      deprecated: true
      tags:
        - custom profile attributes
      summary: Delete a Custom Profile Attribute field
      description: |
        Marks a Custom Profile Attribute field and all its values as
        deleted.

        A field linked to a global attribute template can't be deleted
        through this endpoint and returns 400.

        **Deprecated since v12.0.** Use the Properties API
        (`DELETE /api/v4/properties/groups/access_control/user/fields/{field_id}`)
        instead. This endpoint will be removed in a future release.

        **License:** requires an Entry, Enterprise or Enterprise Advanced
        license (403 otherwise).

        __Minimum server version__: 10.5

        ##### Permissions
        Must have `manage_system` permission.
      operationId: DeleteCPAField
      parameters:
        - name: field_id
          in: path
          description: Custom Profile Attribute field GUID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Custom Profile Attribute field deletion successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          description: >
            The request is invalid, or the field is linked to a global
            attribute template (error ID
            `api.custom_profile_attributes.linked_field.app_error`). Fields
            created before v12.0 are linked to a template when the server is
            upgraded, and fields created in Attribute Management are always
            linked. Change a linked field through the Properties API instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  "/api/v4/custom_profile_attributes/values":
    patch:
      deprecated: true
      tags:
        - custom profile attributes
      summary: Patch Custom Profile Attribute values
      description: |
        Partially update a set of values on the requester's Custom
        Profile Attribute fields by providing only the information you
        want to update. Omitted fields will not be updated. The fields
        that can be updated are defined in the request body, all other
        provided fields will be ignored.

        **Note:** Values for fields with `attrs.protected = true` cannot be
        updated and will return an error.

        The body and the response are maps from field ID to value. A request
        with no entries or more than 50 entries returns 400, and an unknown
        field ID returns 404.

        **Deprecated since v12.0.** Use the Properties API
        (`PATCH /api/v4/properties/groups/access_control/user/values/{user_id}`,
        with your own user ID) instead. This endpoint will be removed in a
        future release.

        **License:** requires an Entry, Enterprise or Enterprise Advanced
        license (403 otherwise).

        __Minimum server version__: 10.5

        ##### Permissions
        Must be authenticated.
      operationId: PatchCPAValues
      requestBody:
        description: Custom Profile Attribute values that are to be updated
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                A map from field ID to the new value, with between 1 and 50
                entries. A `text`, `select`, `rank`, `date` or `user` value is
                a string (an option ID for `select` and `rank`); a
                `multiselect`, `graph` or `multiuser` value is an array of
                strings (option IDs or user IDs).
              minProperties: 1
              maxProperties: 50
              additionalProperties:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
      responses:
        "200":
          description: Custom Profile Attribute values patch successful
          content:
            application/json:
              schema:
                type: object
                description: A map from field ID to the value that was saved.
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/api/v4/custom_profile_attributes/group":
    get:
      deprecated: true
      tags:
        - custom profile attributes
      summary: Get Custom Profile Attribute property group data
      description: |
        Get the property group used for Custom Profile Attributes: the
        `access_control` group.

        **Deprecated since v12.0.** The Properties API
        (`/api/v4/properties/groups/access_control/user/...`) addresses the
        group by name, so it doesn't need the group ID. This endpoint will be
        removed in a future release.

        **License:** requires an Entry, Enterprise or Enterprise Advanced
        license (403 otherwise).

        __Minimum server version__: 10.8

        ##### Permissions
        Must be authenticated.
      operationId: GetCPAGroup
      responses:
        "200":
          description: Group fetch successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the custom profile attributes group
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

