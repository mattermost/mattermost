  /api/v4/access_control_policies:
    put:
      tags:
        - access control
      summary: Create an access control policy
      description: |
        Creates a new access control policy, or updates the policy with the
        same `id`.

        Plugin-owned policy types are rejected with a 400. A `channel` policy
        can only be saved for a public or private channel that isn't a team's
        default channel, a shared channel, or group-constrained.

        Returns a 501 when `type` is `permission` and permission policies are
        disabled, or when a `channel` policy has permission rules and channel
        permission policies are disabled.

        __Minimum server version__: 10.9

        ##### Permissions
        Depends on the policy `type`:
        * `parent`: the `manage_system` permission, or the
          `manage_team_access_rules` permission on the team given in the
          `team_id` query parameter. A policy saved by a team admin belongs to
          that team. To update an existing policy, a team admin's policy must
          already belong to the team: its `scope_id` is the team, or every
          channel it's assigned to is in the team.
        * `channel`: the `manage_system` permission, or the
          `manage_channel_access_rules` permission on the channel. The policy
          `id` is the channel ID.
        * `team`: the `manage_system` permission, or the
          `manage_team_access_rules` permission on the team. The policy `id`
          is the team ID.
        * `permission`: the `manage_system` permission.

        A caller without the `manage_system` permission can't save rules that
        they don't satisfy themselves, and can't change a policy's `imports`,
        `scope` or `scope_id`.
      operationId: CreateAccessControlPolicy
      parameters:
        - name: team_id
          in: query
          description: >
            For a `parent` policy, the ID of the team the policy belongs to.
            Required for a team admin. For a caller with the `manage_system`
            permission, it sets the policy's `scope` to that team when the
            request body doesn't set one.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessControlPolicy"
      responses:
        "200":
          description: Access control policy created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessControlPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v4/access_control_policies/cel/check:
    post:
      tags:
        - access control
      summary: Check an access control policy expression
      description: |
        Checks the syntax and validity of an access control policy expression.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or one of:
        * the `manage_team_access_rules` permission on the team given in
          `teamId`. If `channelId` is also given, the channel must be in that
          team.
        * the `manage_channel_access_rules` permission on the channel given in
          `channelId`.
      operationId: CheckAccessControlPolicyExpression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expression:
                  type: string
                  description: The expression to check.
                channelId:
                  type: string
                  description: The channel ID, required for channel admins.
                teamId:
                  type: string
                  description: The team ID, required for team admins.
      responses:
        "200":
          description: Expression check result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpressionError"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/access_control_policies/cel/validate_requester:
    post:
      tags:
        - access control
      summary: Validate if the current user matches a CEL expression
      description: |
        Validates whether the current authenticated user matches the given CEL expression.
        This is used to determine if a channel admin can test expressions they match.

        __Minimum server version__: 11.0

        ##### Permissions
        Must have the `manage_system` permission, or one of:
        * the `manage_team_access_rules` permission on the team given in
          `teamId`. If `channelId` is also given, the channel must be in that
          team.
        * the `manage_channel_access_rules` permission on the channel given in
          `channelId`.
      operationId: ValidateExpressionAgainstRequester
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expression:
                  type: string
                  description: The CEL expression to validate against the current user.
                channelId:
                  type: string
                  description: The channel ID for channel-specific permission checks (required for channel admins).
                teamId:
                  type: string
                  description: The team ID, required for team admins.
              required:
                - expression
      responses:
        "200":
          description: Validation result returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requester_matches:
                    type: boolean
                    description: Whether the current user matches the expression.
                required:
                  - requester_matches
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/access_control_policies/cel/test:
    post:
      tags:
        - access control
      summary: Test an access control policy expression
      description: |
        Tests an access control policy expression against users to see who would be affected.

        For a caller without the `manage_system` permission, the result is
        empty unless the caller satisfies the expression themselves, and user
        profiles have the same fields hidden as for any user who isn't a
        system admin. With `teamId`, a system admin or team admin gets only
        members of that team.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or one of:
        * the `manage_team_access_rules` permission on the team given in
          `teamId`. If `channelId` is also given, the channel must be in that
          team.
        * the `manage_channel_access_rules` permission on the channel given in
          `channelId`.
      operationId: TestAccessControlPolicyExpression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryExpressionParams"
      responses:
        "200":
          description: Expression test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessControlPolicyTestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/access_control_policies/cel/simulate_users:
    post:
      tags:
        - access control
      summary: Simulate an access control policy decision for an explicit user list
      description: |
        Runs the dual-lane PDP simulation against a draft (unsaved) access
        control policy for an explicit set of users (with optional per-user
        session-attribute overrides). The server compiles the draft
        in-memory, layers on persisted higher-scoped permission policies,
        and returns per-user, per-action ALLOW/DENY decisions plus blame
        attribution for any deny.

        Backs the picker-driven "Simulate access" UX in the System Console
        and Channel Settings so authors can see how a draft interacts with
        persisted higher-scoped policies before saving.

        Available only when permission policies and policy simulation are
        both enabled and the server's license includes attribute-based
        access control. Returns 501 (Not Implemented) otherwise.

        Accepts at most 50 users. For each user, the simulation uses up to 10
        of their most recent sessions.

        For a caller without the `manage_system` permission, the response
        leaves out evaluation trees and the values of attributes that are
        hidden from user profiles or otherwise protected, and user profiles
        have the same fields hidden as for any user who isn't a system admin.

        __Minimum server version__: 11.8

        ##### Permissions
        Must have the `manage_system` permission, OR be a team admin with
        `manage_team_access_rules` on the request's `team_id` (when any
        provided `channel_id` resolves to a channel in that team), OR be a
        channel admin with `manage_channel_access_rules` on the request's
        `channel_id`.

        A caller without the `manage_system` permission can simulate only
        users who are members of the channel in `channel_id`, or, when
        `channel_id` isn't set, of the team in `team_id`.
      operationId: SimulateAccessControlPolicyForUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicySimulationByUsersParams"
      responses:
        "200":
          description: Per-user, per-action simulation results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySimulationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v4/access_control_policies/search:
    post:
      tags:
        - access control
      summary: Search access control policies
      description: |
        Searches for access control policies based on given criteria.

        Without `team_id`, every policy is searched. When permission policies
        are disabled, `permission` policies are left out of the results, and
        a search with `type` set to `permission` returns a 501.

        With `team_id`, only `parent` policies that belong to the team are
        returned: those whose `scope_id` is the team, and those whose assigned
        channels are all in the team. A policy that covers a private channel
        is left out when the caller doesn't satisfy its rules.

        __Minimum server version__: 10.9

        ##### Permissions
        Without `team_id`, must have the `manage_system` permission. With
        `team_id`, must have the `manage_team_access_rules` permission on the
        team.
      operationId: SearchAccessControlPolicies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessControlPolicySearch"
      responses:
        "200":
          description: Search results for access control policies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessControlPoliciesWithCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v4/access_control_policies/cel/autocomplete/fields:
    get:
      tags:
        - access control
      summary: Get autocomplete fields for access control policies
      description: |
        Provides a list of fields that can be used for autocompletion when creating/editing access control policy expressions.

        The list holds user attributes, plus channel attributes when
        `channelId` is given or `include_resource_fields` is `true`. The first
        page also includes the built-in user fields `email`, `verified`,
        `isbot` and `createat`.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or one of:
        * the `manage_team_access_rules` permission on the team given in
          `team_id`. If `channelId` is also given, the channel must be in that
          team.
        * the `manage_channel_access_rules` permission on the channel given in
          `channelId`.
      operationId: GetAccessControlPolicyAutocompleteFields
      parameters:
        - name: after
          in: query
          description: The field ID to start after for pagination.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: The maximum number of fields to return.
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: channelId
          in: query
          description: >
            The channel ID, required for channel admins. When set, channel
            attributes are included.
          required: false
          schema:
            type: string
        - name: team_id
          in: query
          description: The team ID, required for team admins.
          required: false
          schema:
            type: string
        - name: include_resource_fields
          in: query
          description: >
            When `true`, includes channel attributes, for editing a policy
            that isn't tied to a single channel, such as a `parent` policy.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Autocomplete fields retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PropertyField"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/v4/access_control_policies/{policy_id}":
    get:
      tags:
        - access control
      summary: Get an access control policy
      description: |
        Gets a specific access control policy by its ID.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or one of:
        * for a `channel` policy, the `manage_channel_access_rules` permission
          on the channel. The policy ID is the channel ID.
        * for a `parent` policy that belongs to the team given in `team_id`,
          the `manage_team_access_rules` permission on that team. A policy
          belongs to a team when its `scope_id` is the team, or when every
          channel it's assigned to is in the team.

        With `channelId`, a channel admin can also get a `parent` policy that
        the channel imports.
      operationId: GetAccessControlPolicy
      parameters:
      - name: policy_id
        in: path
        description: The ID of the access control policy.
        required: true
        schema:
          type: string
      - name: channelId
        in: query
        description: >
          The ID of a channel that imports the policy, for reading a `parent`
          policy from that channel's settings.
        required: false
        schema:
          type: string
      - name: team_id
        in: query
        description: The team ID, required for team admins.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Access control policy retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessControlPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - access control
      summary: Delete an access control policy
      description: |
        Deletes an access control policy by its ID.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or one of:
        * for a `channel` policy, the `manage_channel_access_rules` permission
          on the channel. The policy ID is the channel ID.
        * with `team_id`, the `manage_team_access_rules` permission on that
          team, for the team's own `team` policy or for a `parent` policy that
          belongs to the team. A policy belongs to a team when its `scope_id`
          is the team, or when every channel it's assigned to is in the team.
      operationId: DeleteAccessControlPolicy
      parameters:
      - name: policy_id
        in: path
        description: The ID of the access control policy.
        required: true
        schema:
          type: string
      - name: team_id
        in: query
        description: The team ID, required for team admins.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Access control policy deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/v4/access_control_policies/{policy_id}/activate":
    get:
      deprecated: true
      tags:
        - access control
      summary: Turn auto-add on or off for an access control policy
      description: |
        Turns auto-add on or off for one access control policy. From
        Mattermost v12.0, `active=true` sets `auto_add` to `always` on the
        policy's membership rule, so users who match are added
        automatically, and `active=false` turns auto-add off.

        **Deprecated:** This endpoint will be removed in a future release. Use `PUT /api/v4/access_control_policies/activate` instead, which also updates several policies at once.
        Link: </api/v4/access_control_policies/activate>; rel="successor-version"

        This endpoint doesn't accept the session cookie: requests that send
        it are rejected with a 401. Send a token in the `Authorization`
        header instead.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or, for a `channel` policy,
        the `manage_channel_access_rules` permission on the channel.
      operationId: UpdateAccessControlPolicyActiveStatus
      parameters:
      - name: policy_id
        in: path
        description: The ID of the access control policy.
        required: true
        schema:
          type: string
      - name: active
        in: query
        description: Set to "true" to turn auto-add on, "false" to turn it off.
        required: true
        schema:
          type: boolean
      responses:
        "200":
          description: Policy active status updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/v4/access_control_policies/{policy_id}/assign":
    post:
      tags:
        - access control
      summary: Assign an access control policy to channels or teams
      description: |
        Assigns an access control policy to a list of channels and/or teams.

        Returns a 501 when `team_ids` is set and team membership policies
        aren't available on the server. They need an Entry or Enterprise
        Advanced license, and attribute-based access control must be enabled.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission. A team admin can instead
        set `team_id` to a team where they have the `manage_team_access_rules`
        permission, for a `parent` policy that belongs to that team: its
        `scope_id` is the team, or every channel it's assigned to is in the
        team. A team admin must give at least one channel in `channel_ids`,
        and every channel must be in the team. `team_ids` always requires the
        `manage_system` permission.
      operationId: AssignAccessControlPolicyToChannels
      parameters:
      - name: policy_id
        in: path
        description: The ID of the access control policy.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_ids:
                  type: array
                  items:
                    type: string
                  description: The IDs of the channels to assign the policy to.
                team_id:
                  type: string
                  description: >
                    The ID of the team, required for a team admin. Every
                    channel in `channel_ids` must be in this team.
                team_ids:
                  type: array
                  items:
                    type: string
                  description: >
                    The IDs of the teams to assign the policy to. Requires the
                    `manage_system` permission. Any unknown team ID is rejected
                    with a 400.
      responses:
        "200":
          description: Policy assigned to the channels and/or teams successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  "/api/v4/access_control_policies/{policy_id}/unassign":
    delete:
      tags:
        - access control
      summary: Unassign an access control policy from channels or teams
      description: |
        Unassigns an access control policy from a list of channels and/or teams.

        Returns a 501 when `team_ids` is set and team membership policies
        aren't available on the server. They need an Entry or Enterprise
        Advanced license, and attribute-based access control must be enabled.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission. A team admin can instead
        set `team_id` to a team where they have the `manage_team_access_rules`
        permission, for a `parent` policy that belongs to that team: its
        `scope_id` is the team, or every channel it's assigned to is in the
        team. A team admin must give at least one channel in `channel_ids`,
        and every channel must be in the team. `team_ids` always requires the
        `manage_system` permission.
      operationId: UnassignAccessControlPolicyFromChannels
      parameters:
      - name: policy_id
        in: path
        description: The ID of the access control policy.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_ids:
                  type: array
                  items:
                    type: string
                  description: The IDs of the channels to unassign the policy from.
                team_id:
                  type: string
                  description: >
                    The ID of the team, required for a team admin. Every
                    channel in `channel_ids` must be in this team.
                team_ids:
                  type: array
                  items:
                    type: string
                  description: >
                    The IDs of the teams to unassign the policy from. Requires the
                    `manage_system` permission. Any unknown team ID is rejected
                    with a 400.
      responses:
        "200":
          description: Policy unassigned from the channels and/or teams successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  "/api/v4/access_control_policies/{policy_id}/resources/channels":
    get:
      tags:
        - access control
      summary: Get channels for an access control policy
      description: |
        Retrieves a paginated list of channels to which a specific access control policy is applied.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or the
        `manage_team_access_rules` permission on the team given in `team_id`,
        for a `parent` policy that belongs to that team. A policy belongs to a
