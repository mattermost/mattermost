  /api/v4/access_control_policies:
    put:
      tags:
        - access control
      summary: Create an access control policy
      description: |
        Creates an access control policy, or updates the policy with the same
        `id`.

        __Minimum server version__: 10.9

        ##### Permissions
        The `manage_system` permission, or by policy `type`:
        * `parent`: `manage_team_access_rules` on the team in `team_id`. The
          policy then belongs to that team, and an existing policy can only
          be updated if it already does (its `scope_id` is the team, or every
          channel it's assigned to is in the team).
        * `channel`: `manage_channel_access_rules` on the channel (the policy
          `id`).
        * `team`: `manage_team_access_rules` on the team (the policy `id`).
        * `permission`: only `manage_system`.

        Without `manage_system`, a caller can't save rules they don't satisfy
        themselves, or change a policy's `imports`, `scope` or `scope_id`.
      operationId: CreateAccessControlPolicy
      parameters:
        - name: team_id
          in: query
          description: >
            For a `parent` policy, the ID of the team the policy belongs to.
            Required for a team admin. For a caller with the `manage_system`
            permission, it sets the policy's `scope` to that team when the
            request body doesn't set one.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessControlPolicy"
      responses:
        "200":
          description: Access control policy created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessControlPolicy"
        "400":
          description: >
            Invalid policy, a plugin-owned policy `type`, or a `channel` policy
            for a channel that isn't public or private, or is a team's default
            channel, shared or group-constrained.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          description: >
            A `permission` policy while permission policies are disabled, or a
            `channel` policy with permission rules while channel permission
            policies are disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
  /api/v4/access_control_policies/cel/check:
    post:
      tags:
        - access control
      summary: Check an access control policy expression
      description: |
        Checks the syntax and validity of an access control policy expression.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, `manage_team_access_rules`
        on the team in `teamId` (a `channelId`, if given, must be in that
        team), or `manage_channel_access_rules` on the channel in `channelId`.
      operationId: CheckAccessControlPolicyExpression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expression:
                  type: string
                  description: The expression to check.
                channelId:
                  type: string
                  description: The channel ID, required for channel admins.
                teamId:
                  type: string
                  description: The team ID, required for team admins.
      responses:
        "200":
          description: Expression check result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpressionError"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/access_control_policies/cel/validate_requester:
    post:
      tags:
        - access control
      summary: Validate if the current user matches a CEL expression
      description: |
        Validates whether the current authenticated user matches the given CEL expression.
        This is used to determine if a channel admin can test expressions they match.

        __Minimum server version__: 11.0

        ##### Permissions
        Must have the `manage_system` permission, `manage_team_access_rules`
        on the team in `teamId` (a `channelId`, if given, must be in that
        team), or `manage_channel_access_rules` on the channel in `channelId`.
      operationId: ValidateExpressionAgainstRequester
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expression:
                  type: string
                  description: The CEL expression to validate against the current user.
                channelId:
                  type: string
                  description: The channel ID for channel-specific permission checks (required for channel admins).
                teamId:
                  type: string
                  description: The team ID, required for team admins.
              required:
                - expression
      responses:
        "200":
          description: Validation result returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requester_matches:
                    type: boolean
                    description: Whether the current user matches the expression.
                required:
                  - requester_matches
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/access_control_policies/cel/test:
    post:
      tags:
        - access control
      summary: Test an access control policy expression
      description: |
        Tests an access control policy expression against users to see who would be affected.

        Without the `manage_system` permission, the result is empty unless
        the caller satisfies the expression, and user profiles are sanitized
        as for any non-admin. With `teamId`, system and team admins get only
        members of that team.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, `manage_team_access_rules`
        on the team in `teamId` (a `channelId`, if given, must be in that
        team), or `manage_channel_access_rules` on the channel in `channelId`.
      operationId: TestAccessControlPolicyExpression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryExpressionParams"
      responses:
        "200":
          description: Expression test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessControlPolicyTestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/access_control_policies/cel/simulate_users:
    post:
      tags:
        - access control
      summary: Simulate an access control policy decision for an explicit user list
      description: |
        Simulates a draft (unsaved) policy for up to 50 users, with optional
        per-user session-attribute overrides, using up to 10 of each user's
        most recent sessions. The draft is evaluated together with persisted
        higher-scoped permission policies, and the response gives each user an
        ALLOW or DENY decision per action, with blame for any deny.

        Without the `manage_system` permission, the response leaves out
        evaluation trees and protected or profile-hidden attribute values, and
        user profiles are sanitized as for any non-admin.

        __Minimum server version__: 11.8

        ##### Permissions
        Must have the `manage_system` permission, `manage_team_access_rules`
        on the team in `team_id` (a `channel_id`, if given, must be in that
        team), or `manage_channel_access_rules` on the channel in
        `channel_id`. Without `manage_system`, only members of the channel in
        `channel_id` (or, without one, the team in `team_id`) can be simulated.
      operationId: SimulateAccessControlPolicyForUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicySimulationByUsersParams"
      responses:
        "200":
          description: Per-user, per-action simulation results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySimulationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          description: >
            Permission policies or policy simulation is disabled, or the
            license doesn't include attribute-based access control.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
  /api/v4/access_control_policies/search:
    post:
      tags:
        - access control
      summary: Search access control policies
      description: |
        Searches for access control policies based on given criteria.

        With `team_id`, returns only `parent` policies that belong to the team
        (its `scope_id` is the team, or all its assigned channels are in the
        team), leaving out any that cover a private channel whose rules the
        caller doesn't satisfy. `permission` policies are left out while
        permission policies are disabled.

        __Minimum server version__: 10.9

        ##### Permissions
        The `manage_system` permission, or with `team_id`, the
        `manage_team_access_rules` permission on the team.
      operationId: SearchAccessControlPolicies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessControlPolicySearch"
      responses:
        "200":
          description: Search results for access control policies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessControlPoliciesWithCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          description: >
            `type` is `permission` while permission policies are disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
  /api/v4/access_control_policies/cel/autocomplete/fields:
    get:
      tags:
        - access control
      summary: Get autocomplete fields for access control policies
      description: |
        Provides a list of fields that can be used for autocompletion when creating/editing access control policy expressions.

        The first page also includes the built-in user fields `email`,
        `verified`, `isbot` and `createat`.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, `manage_team_access_rules`
        on the team in `team_id` (a `channelId`, if given, must be in that
        team), or `manage_channel_access_rules` on the channel in `channelId`.
      operationId: GetAccessControlPolicyAutocompleteFields
      parameters:
        - name: after
          in: query
          description: The field ID to start after for pagination.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: The maximum number of fields to return.
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: channelId
          in: query
          description: >
            The channel ID, required for channel admins. When set, channel
            attributes are included.
          required: false
          schema:
            type: string
        - name: team_id
          in: query
          description: The team ID, required for team admins.
          required: false
          schema:
            type: string
        - name: include_resource_fields
          in: query
          description: >
            When `true`, includes channel attributes, for editing a policy
            that isn't tied to a single channel, such as a `parent` policy.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Autocomplete fields retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PropertyField"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/v4/access_control_policies/{policy_id}":
    get:
      tags:
        - access control
      summary: Get an access control policy
      description: |
        Gets a specific access control policy by its ID.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or one of:
        * for a `channel` policy, `manage_channel_access_rules` on the channel
          (the policy ID).
        * for a `parent` policy that belongs to the team in `team_id` (its
          `scope_id` is the team, or all its assigned channels are in the
          team), `manage_team_access_rules` on that team.
        * for a `parent` policy imported by the channel in `channelId`,
          `manage_channel_access_rules` on that channel.
      operationId: GetAccessControlPolicy
      parameters:
      - name: policy_id
        in: path
        description: The ID of the access control policy.
        required: true
        schema:
          type: string
      - name: channelId
        in: query
        description: >
          The ID of a channel that imports the policy, for reading a `parent`
          policy from that channel's settings.
        required: false
        schema:
          type: string
      - name: team_id
        in: query
        description: The team ID, required for team admins.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Access control policy retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessControlPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - access control
      summary: Delete an access control policy
      description: |
        Deletes an access control policy by its ID.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or one of:
        * for a `channel` policy, `manage_channel_access_rules` on the channel
          (the policy ID).
        * with `team_id`, `manage_team_access_rules` on that team, for the
          team's own `team` policy or a `parent` policy that belongs to the
          team (its `scope_id` is the team, or all its assigned channels are
          in the team).
      operationId: DeleteAccessControlPolicy
      parameters:
      - name: policy_id
        in: path
        description: The ID of the access control policy.
        required: true
        schema:
          type: string
      - name: team_id
        in: query
        description: The team ID, required for team admins.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Access control policy deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/v4/access_control_policies/{policy_id}/activate":
    get:
      deprecated: true
      tags:
        - access control
      summary: Turn auto-add on or off for an access control policy
      description: |
        Turns auto-add on or off for one access control policy. From
        Mattermost v12.0, `active=true` sets `auto_add` to `always` on the
        policy's membership rule, and `active=false` turns auto-add off.
        Doesn't accept the session cookie; send a token in the
        `Authorization` header.

        **Deprecated:** This endpoint will be removed in a future release. Use `PUT /api/v4/access_control_policies/activate` instead.
        Link: </api/v4/access_control_policies/activate>; rel="successor-version"

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or, for a `channel` policy,
        `manage_channel_access_rules` on the channel.
      operationId: UpdateAccessControlPolicyActiveStatus
      parameters:
      - name: policy_id
        in: path
        description: The ID of the access control policy.
        required: true
        schema:
          type: string
      - name: active
        in: query
        description: Set to "true" to turn auto-add on, "false" to turn it off.
        required: true
        schema:
          type: boolean
      responses:
        "200":
          description: Policy active status updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/v4/access_control_policies/{policy_id}/assign":
    post:
      tags:
        - access control
      summary: Assign an access control policy to channels or teams
      description: |
        Assigns an access control policy to a list of channels and/or teams.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or
        `manage_team_access_rules` on the team in `team_id` for a `parent`
        policy that belongs to that team (its `scope_id` is the team, or all
        its assigned channels are in the team). A team admin must give at
        least one channel in `channel_ids`, all in that team, and can't use
        `team_ids`.
      operationId: AssignAccessControlPolicyToChannels
      parameters:
      - name: policy_id
        in: path
        description: The ID of the access control policy.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_ids:
                  type: array
                  items:
                    type: string
                  description: The IDs of the channels to assign the policy to.
                team_id:
                  type: string
                  description: >
                    The ID of the team, required for a team admin. Every
                    channel in `channel_ids` must be in this team.
                team_ids:
                  type: array
                  items:
                    type: string
                  description: >
                    The IDs of the teams to assign the policy to. Requires the
                    `manage_system` permission.
      responses:
        "200":
          description: Policy assigned to the channels and/or teams successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          description: Invalid request, or an unknown team ID in `team_ids`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          description: >
            `team_ids` is set and team membership policies aren't available:
            they need an Entry or Enterprise Advanced license, and
            attribute-based access control must be enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
  "/api/v4/access_control_policies/{policy_id}/unassign":
    delete:
      tags:
        - access control
      summary: Unassign an access control policy from channels or teams
      description: |
        Unassigns an access control policy from a list of channels and/or teams.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or
        `manage_team_access_rules` on the team in `team_id` for a `parent`
        policy that belongs to that team (its `scope_id` is the team, or all
        its assigned channels are in the team). A team admin must give at
        least one channel in `channel_ids`, all in that team, and can't use
        `team_ids`.
      operationId: UnassignAccessControlPolicyFromChannels
      parameters:
      - name: policy_id
        in: path
        description: The ID of the access control policy.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_ids:
                  type: array
                  items:
                    type: string
                  description: The IDs of the channels to unassign the policy from.
                team_id:
                  type: string
                  description: >
                    The ID of the team, required for a team admin. Every
                    channel in `channel_ids` must be in this team.
                team_ids:
                  type: array
                  items:
                    type: string
                  description: >
                    The IDs of the teams to unassign the policy from. Requires the
                    `manage_system` permission.
      responses:
        "200":
          description: Policy unassigned from the channels and/or teams successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          description: Invalid request, or an unknown team ID in `team_ids`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          description: >
            `team_ids` is set and team membership policies aren't available:
            they need an Entry or Enterprise Advanced license, and
            attribute-based access control must be enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
  "/api/v4/access_control_policies/{policy_id}/resources/channels":
    get:
      tags:
        - access control
      summary: Get channels for an access control policy
      description: |
        Retrieves a paginated list of channels to which a specific access control policy is applied.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or
        `manage_team_access_rules` on the team in `team_id` for a `parent`
        policy that belongs to that team (its `scope_id` is the team, or all
        its assigned channels are in the team).
      operationId: GetChannelsForAccessControlPolicy
      parameters:
      - name: policy_id
        in: path
        description: The ID of the access control policy.
        required: true
        schema:
          type: string
      - name: team_id
        in: query
        description: The team ID, required for team admins.
        required: false
        schema:
          type: string
      - name: after
        in: query
        description: The channel ID to start after for pagination.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: The maximum number of channels to return.
        required: true
        schema:
          type: integer
          default: 60
      responses:
        "200":
          description: Channels retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelsWithCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/v4/access_control_policies/{policy_id}/resources/channels/search":
    post:
      tags:
        - access control
      summary: Search channels for an access control policy
      description: |
        Searches for channels associated with a specific access control policy based on search criteria.
        Group-constrained channels are never returned.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or
        `manage_team_access_rules` on the team in `team_id` for a `parent`
        policy that belongs to that team (its `scope_id` is the team, or all
        its assigned channels are in the team). A team admin gets only
        channels in that team.
      operationId: SearchChannelsForAccessControlPolicy
      parameters:
      - name: policy_id
        in: path
        description: The ID of the access control policy.
        required: true
        schema:
          type: string
      - name: team_id
        in: query
        description: The team ID, required for team admins.
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                term:
                  type: string
                  description: The string to search in the channel name, display name, and purpose.
                team_ids:
                  type: array
                  items:
                    type: string
                  description: >
                    Filters results to channels belonging to the given team
                    ids. Ignored for a team admin, whose results are limited to
                    the team given in `team_id`.
                deleted:
                  type: boolean
                  description: Filters results to only return deleted / archived channels.
                include_deleted:
                  type: boolean
                  description: Whether to include deleted channels in the search results.
      responses:
        "200":
          description: Channel search results retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelsWithCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/v4/channels/{channel_id}/access_control/attributes":
    get:
      tags:
        - access control
        - channels
      summary: Get access control attributes for a channel
      description: |
        Retrieves the effective access control policy attributes for a specific channel.
        This can be used to understand what attributes are currently being applied to the channel by the access control system.

        The response maps each attribute name used by the channel's
        membership rules to the values that satisfy them, and is empty while
        `AccessControlSettings.EnableChannelPolicyIndicators` is off.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have `read_channel` permission for the specified channel.
      operationId: GetChannelAccessControlAttributes
      parameters:
        - name: channel_id
          in: path
          description: The ID of the channel.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Access control attributes retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                description: A map of attribute names to their values as applied to the channel.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/access_control_policies/cel/visual_ast:
    post:
      tags:
        - access control
      summary: Get the visual AST for a CEL expression
      description: |
        Retrieves the visual AST for a CEL expression.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, `manage_team_access_rules`
        on the team in `teamId` (a `channelId`, if given, must be in that
        team), or `manage_channel_access_rules` on the channel in `channelId`.
      operationId: GetCELVisualAST
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CELExpression"
      responses:
        "200":
          description: Visual AST retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualExpression" 
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/access_control_policies/activate:
    put:
      tags:
        - access control
      summary: Turn auto-add on or off for access control policies
      description: |
        Turns auto-add on or off for a batch of access control policies. From
        Mattermost v12.0, `active: true` sets `auto_add` to `always` on each
        policy's membership rule, and `active: false` turns auto-add off.
        Returns the updated policies, whose `active` field shows whether
        auto-add is on.

        __Minimum server version__: 11.3

        ##### Permissions
        Must have the `manage_system` permission, or every policy in
        `entries` must be one of:
        * a `channel` policy, with `manage_channel_access_rules` on the
          channel.
        * with `team_id`, and `manage_team_access_rules` on that team, the
          team's own `team` policy or a `parent` policy that belongs to the
          team (its `scope_id` is the team, or all its assigned channels are
          in the team).
      operationId: UpdateAccessControlPoliciesActive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessControlPolicyActiveUpdateRequest"
      responses:
        "200":
          description: Access control policies active status updated successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessControlPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v4/access_control/decisions/actions/search:
    post:
      tags:
        - access control
      summary: Search allowed actions for the current user (render-time decision)
      description: |
        Returns non-authoritative, render-time ABAC decisions for the current
        session user on a resource, for deciding whether to show UI controls.
        Server-side enforcement re-evaluates the full policy on the actual
        request and remains the source of truth.

        Only `channel` resources and the `upload_file_attachment` and
        `download_file_attachment` actions are supported. Leave `actions`
        empty to get every supported action. While attribute-based access
        control or permission policies are disabled, every action is
        `allowed: true, evaluated: true`.

        __Minimum server version__: 12.0

        ##### Permissions
        Must have the `read_channel` permission on the channel in `resource`.
      operationId: SearchAccessControlDecisionActions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionSearchRequest"
      responses:
        "200":
          description: Render-time action decisions returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionSearchResponse"
        "400":
          description: An unsupported resource type or action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No `read_channel` permission on the channel, or a `subject` whose
            `id` isn't the caller's own user ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          $ref: "#/components/responses/InternalServerError"
