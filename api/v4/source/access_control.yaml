        description: The team ID, required for team admins.
        required: false
        schema:
          type: string
      - name: after
        in: query
        description: The channel ID to start after for pagination.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: The maximum number of channels to return.
        required: true
        schema:
          type: integer
          default: 60
      responses:
        "200":
          description: Channels retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelsWithCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/v4/access_control_policies/{policy_id}/resources/channels/search":
    post:
      tags:
        - access control
      summary: Search channels for an access control policy
      description: |
        Searches for channels associated with a specific access control policy based on search criteria.
        Group-constrained channels are never returned.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or the
        `manage_team_access_rules` permission on the team given in `team_id`,
        for a `parent` policy that belongs to that team. A policy belongs to a
        team when its `scope_id` is the team, or when every channel it's
        assigned to is in the team. A team admin gets only channels in that
        team.
      operationId: SearchChannelsForAccessControlPolicy
      parameters:
      - name: policy_id
        in: path
        description: The ID of the access control policy.
        required: true
        schema:
          type: string
      - name: team_id
        in: query
        description: The team ID, required for team admins.
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                term:
                  type: string
                  description: The string to search in the channel name, display name, and purpose.
                team_ids:
                  type: array
                  items:
                    type: string
                  description: >
                    Filters results to channels belonging to the given team
                    ids. Ignored for a team admin, whose results are limited to
                    the team given in `team_id`.
                deleted:
                  type: boolean
                  description: Filters results to only return deleted / archived channels.
                include_deleted:
                  type: boolean
                  description: Whether to include deleted channels in the search results.
      responses:
        "200":
          description: Channel search results retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelsWithCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/v4/channels/{channel_id}/access_control/attributes":
    get:
      tags:
        - access control
        - channels
      summary: Get access control attributes for a channel
      description: |
        Retrieves the effective access control policy attributes for a specific channel.
        This can be used to understand what attributes are currently being applied to the channel by the access control system.

        The response maps each attribute name used by the channel's
        membership rules to the values that satisfy them. It's an empty
        object when **Show channel access indicators**
        (`AccessControlSettings.EnableChannelPolicyIndicators`) is turned off.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have `read_channel` permission for the specified channel.
      operationId: GetChannelAccessControlAttributes
      parameters:
        - name: channel_id
          in: path
          description: The ID of the channel.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Access control attributes retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                description: A map of attribute names to their values as applied to the channel.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/access_control_policies/cel/visual_ast:
    post:
      tags:
        - access control
      summary: Get the visual AST for a CEL expression
      description: |
        Retrieves the visual AST for a CEL expression.

        __Minimum server version__: 10.9

        ##### Permissions
        Must have the `manage_system` permission, or one of:
        * the `manage_team_access_rules` permission on the team given in
          `teamId`. If `channelId` is also given, the channel must be in that
          team.
        * the `manage_channel_access_rules` permission on the channel given in
          `channelId`.
      operationId: GetCELVisualAST
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CELExpression"
      responses:
        "200":
          description: Visual AST retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualExpression" 
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/access_control_policies/activate:
    put:
      tags:
        - access control
      summary: Turn auto-add on or off for access control policies
      description: |
        Turns auto-add on or off for a batch of access control policies. From
        Mattermost v12.0, `active: true` sets `auto_add` to `always` on each
        policy's membership rule, so users who match are added
        automatically, and `active: false` turns auto-add off.

        Returns the updated policies. In the response, each policy's `active`
        field shows whether auto-add is on.

        __Minimum server version__: 11.3

        ##### Permissions
        Must have the `manage_system` permission. Otherwise, every policy in
        `entries` must be one of:
        * a `channel` policy for a channel where the caller has the
          `manage_channel_access_rules` permission.
        * with `team_id` set to a team where the caller has the
          `manage_team_access_rules` permission, that team's own `team`
          policy, or a `parent` policy that belongs to the team. A policy
          belongs to a team when its `scope_id` is the team, or when every
          channel it's assigned to is in the team.
      operationId: UpdateAccessControlPoliciesActive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessControlPolicyActiveUpdateRequest"
      responses:
        "200":
          description: Access control policies active status updated successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessControlPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v4/access_control/decisions/actions/search:
    post:
      tags:
        - access control
      summary: Search allowed actions for the current user (render-time decision)
      description: |
        Returns non-authoritative, render-time ABAC decisions for the current
        session user on a given resource and set of actions. Use these decisions
        to decide whether to show or hide UI controls before the user attempts
        an action.

        The subject is always the authenticated session user; there is no way to
        probe another user's decisions. Server-side enforcement always re-evaluates
        the full policy on the actual request and remains the source of truth.

        Only `channel` resources are supported, and `actions` can contain only
        `upload_file_attachment` and `download_file_attachment`. Anything else
        is rejected with a 400. Leave `actions` empty to get decisions for
        every supported action.

        When attribute-based access control or permission policies are
        disabled, every action is returned as `allowed: true, evaluated: true`.

        __Minimum server version__: 12.0

        ##### Permissions
        Must have the `read_channel` permission on the channel in `resource`.
        If `subject` is set, its `id` must be the caller's own user ID;
        otherwise the request is rejected with a 403.
      operationId: SearchAccessControlDecisionActions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionSearchRequest"
      responses:
        "200":
          description: Render-time action decisions returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
