  /api/v4/health/findings:
    get:
      tags:
        - health
      summary: Get health findings
      description: |
        Get the findings stored by the server's latest health evaluation, for product-surface rules only.
        `title`, `message` and `remediation` are rendered in the locale of the request's `Accept-Language`
        header, falling back to English. Findings whose rule is no longer registered are left out.

        The server evaluates its health rules once an hour, so a finding can be up to an hour old; to
        evaluate now, create a `health_check` job with `POST /api/v4/jobs`. `evaluated_at` is when the
        last successful health check run finished, whatever the `muted` filter; it is 0 if no run has
        succeeded yet.

        __Minimum server version__: 12.1

        ##### Permissions

        Must have `manage_system` permission. Also available over local mode.

        Requires the `HealthDashboard` feature flag and a Professional license or higher.
      operationId: GetHealthFindings
      parameters:
        - name: muted
          in: query
          description: |
            Which findings to return by mute state. Omit to return only unmuted findings; `included`
            returns muted and unmuted findings; `only` returns only muted findings.
          required: false
          schema:
            type: string
            enum:
              - included
              - only
      responses:
        "200":
          description: Health findings retrieval successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthFindingList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          description: The `HealthDashboard` feature flag is off, or the server does not have a Professional license or higher.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
  /api/v4/health/findings/export:
    get:
      tags:
        - health
      summary: Export health findings
      description: |
        Export the findings returned by [Get health findings](#operation/GetHealthFindings), including
        muted and resolved findings, as a shareable report file. The report is rendered in the locale of
        the request's `Accept-Language` header, falling back to English, and shows times in the requesting
        user's timezone, falling back to UTC. The export is recorded in the audit log.

        __Minimum server version__: 12.3

        ##### Permissions

        Must have `manage_system` permission. Not available over local mode.

        Requires the `HealthDashboard` feature flag and a Professional license or higher.
      operationId: ExportHealthFindings
      parameters:
        - name: format
          in: query
          description: The report format, `html` for a self-contained HTML file or `md` for Markdown.
          required: true
          schema:
            type: string
            enum:
              - html
              - md
      responses:
        "200":
          description: |
            Health findings export successful. The response is sent as a download named
            `mm_site_health_<company>_<YYYY-MM-DDTHH-MM>.<format>`, where `<company>` is the license's
            customer name, and the timestamp is in the requesting user's timezone.
          headers:
            Content-Disposition:
              description: '`attachment` with the suggested filename.'
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          description: The `HealthDashboard` feature flag is off, or the server does not have a Professional license or higher.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
  "/api/v4/health/findings/{fingerprint}/mute":
    post:
      tags:
        - health
      summary: Mute a health finding
      description: |
        Mute a health finding so it is no longer returned by default. The mute is kept until the finding
        is unmuted, and muting an already muted finding succeeds. The mute is recorded in the audit log.

        __Minimum server version__: 12.1

        ##### Permissions

        Must have `manage_system` permission. Not available over local mode.

        Requires the `HealthDashboard` feature flag and a Professional license or higher.
      operationId: MuteHealthFinding
      parameters:
        - name: fingerprint
          in: path
          description: The finding's fingerprint, 32 lowercase hexadecimal characters.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Health finding mute successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          description: The `HealthDashboard` feature flag is off, or the server does not have a Professional license or higher.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
    delete:
      tags:
        - health
      summary: Unmute a health finding
      description: |
        Unmute a health finding. Unmuting a finding that is not muted succeeds. The unmute is recorded
        in the audit log.

        __Minimum server version__: 12.1

        ##### Permissions

        Must have `manage_system` permission. Not available over local mode.

        Requires the `HealthDashboard` feature flag and a Professional license or higher.
      operationId: UnmuteHealthFinding
      parameters:
        - name: fingerprint
          in: path
          description: The finding's fingerprint, 32 lowercase hexadecimal characters.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Health finding unmute successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          description: The `HealthDashboard` feature flag is off, or the server does not have a Professional license or higher.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
