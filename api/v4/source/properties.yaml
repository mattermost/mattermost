    delete:
      tags:
        - properties
      summary: Delete property field options
      description: >
        Delete options that a property field owns, together with their parent
        links. Values that refer to a deleted option are kept but ignored.


        On a hierarchical (`graph`) field, an option that still has options
        below it can only be deleted together with them, so a whole branch can
        be removed in one request. Options the field inherits from a template
        (`read_only`) can't be deleted here.


        Returns 400 for a field type without options; for a `rank` field,
        whose options are set through the field's `attrs.options` so that each
        option carries its rank; and for a field linked to a hierarchical
        (`graph`) template, whose options can only be changed on the template.


        **License:** in the `access_control` group, this endpoint requires an
        Entry, Enterprise or Enterprise Advanced license (403 otherwise).
        Fields with object type `channel` in that group, and templates that
        `channel` fields link to, require Entry or Enterprise Advanced (501
        otherwise).


        __Minimum server version__: 12.0


        ##### Permissions


        Requires permission to manage the field's options.
      operationId: DeletePropertyFieldOptions
      parameters:
        - name: group_name
          in: path
          description: The name of the property group
          required: true
          schema:
            type: string
        - name: object_type
          in: path
          description: The object type of the property field
          required: true
          schema:
            type: string
        - name: field_id
          in: path
          description: Property field ID
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 200
              items:
                type: string
        description: The IDs of the options to delete
        required: true
      responses:
        "200":
          description: Property field options deletion successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
