  "/api/v4/properties/groups/{group_name}/{object_type}/fields":
    post:
      tags:
        - properties
      summary: Create a property field
      description: >
        Create a new property field for a specific group and object type.


        The `access_control` group holds at most 200 fields, and at most 20 of
        them can have object type `user`. Creating a field past either limit
        returns 422.


        **License:** in the `access_control` group, this endpoint requires an
        Entry, Enterprise or Enterprise Advanced license (403 otherwise).
        Fields with object type `channel` in that group require Entry or
        Enterprise Advanced (501 otherwise).


        __Minimum server version__: 11.7


        ##### Permissions


        Depends on the field's `target_type`: `create_post` on the channel for
        `channel`, `manage_team` on the team for `team`, and `manage_system`
        for `system`. Creating a field with object type `template` always
        requires `manage_system`.
      operationId: CreatePropertyField
      parameters:
        - name: group_name
          in: path
          description: The name of the property group
          required: true
          schema:
            type: string
        - name: object_type
          in: path
          description: The type of object this property field applies to
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - target_type
              properties:
                name:
                  type: string
                  description: The name of the property field
                type:
                  type: string
                  description: >
                    The type of property field. `rank` is a select whose
                    options are ordered by the `rank` each option carries.
                    `graph` is a hierarchical multiselect: its options can sit
                    below other options.
                  enum: [text, select, multiselect, date, user, multiuser, rank, graph]
                attrs:
                  type: object
                  description: Additional attributes for the property field
                target_type:
                  type: string
                  description: The scope level of the property
                target_id:
                  type: string
                  description: The ID of the target
                permission_field:
                  type: string
                  enum: [none, sysadmin, member, admin, creator]
                  description: >
                    Permission level for editing (and deleting) the field
                    definition. `creator` grants the user recorded in the
                    field's `created_by`, in addition to everyone `admin`
                    grants. It is only valid on fields whose object type is
                    `post` or `channel`; any other object type is rejected
                    with 400.
                    Only system admins can set this; ignored for non-admin users.
                  default: member
                permission_values:
                  type: string
                  enum: [none, sysadmin, member, admin, creator]
                  description: >
                    Permission level for setting values on objects.
                    `creator` grants the creator of the object the value is
                    attached to — the post's author for `post` fields, the
                    channel's creator for `channel` fields — in addition to
                    everyone `admin` grants. It is only valid on fields whose
                    object type is `post` or `channel`; any other object type
                    is rejected with 400.
                    Only system admins can set this; ignored for non-admin users.
                  default: member
                permission_options:
                  type: string
                  enum: [none, sysadmin, member, admin, creator]
                  description: >
                    Permission level for managing options on select/multiselect fields.
                    `creator` grants the user recorded in the field's
                    `created_by`, in addition to everyone `admin` grants. It is
                    only valid on fields whose object type is `post` or
                    `channel`; any other object type is rejected with 400.
                    Only system admins can set this; ignored for non-admin users.
                  default: member
                linked_field_id:
                  type: string
                  description: >
                    The ID of a template field to link to. The source must be a
                    template field in the same group, must not itself be linked, and must
                    not be deleted. When set, the created field inherits the source's type,
                    options, and security attributes; the `type` field in the request body
                    is ignored. Can only be set at creation time. To unlink the
                    field later, patch `linked_field_id` to an empty string.
        description: Property field object to create
        required: true
      responses:
        "201":
          description: Property field creation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyField"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            A property field with the same name already exists at the same or a
            conflicting hierarchy level.
          $ref: "#/components/responses/Conflict"
        "422":
          description: The group's field limit has been reached.
        "501":
          $ref: "#/components/responses/NotImplemented"
    get:
      tags:
        - properties
      summary: Get property fields
      description: >
        Get a list of property fields for a specific group and object type. Uses cursor-based pagination.


        **Scope modes (mutually exclusive):**


        - **Hierarchical scope** (`channel_id` and/or `team_id`): returns fields scoped to the named resource *and every ancestor scope above it*. System-level rows are always included; team-level rows are included when `team_id` is set; channel-level rows are included only when `channel_id` is set. When `channel_id` is provided, the channel's team is resolved server-side, so any `team_id` the caller passes is ignored. For DM and GM channels there is no parent team, so the hierarchy collapses to `system → channel` and no team-scoped rows are returned. Requires the caller to have `read_channel` for the channel and/or `view_team` for the team.


        - **Single-target scope** (`target_type` + `target_id`): returns fields scoped to exactly one resource. `target_type` must be `system`, `team`, or `channel`; `target_id` is required for `team` and `channel`.


        Mixing the two modes (any of `channel_id`/`team_id` together with any of `target_type`/`target_id`) returns 400. Omitting both modes also returns 400, except for the system case below.


        **System-object:** when `object_type` is `system`, the endpoint always resolves to `target_type=system` and ignores any `channel_id`, `team_id`, `target_type`, or `target_id` the caller may have passed. System-object fields can only live at the system scope by invariant, so any other scope is a semantic no-op rather than an error.


        **Delta sync via `since`:** When `since > 0`, the endpoint returns rows whose `update_at` is **greater than or equal to** the cutoff, *including* tombstoned rows (`delete_at > 0`). The inclusive boundary lets clients safely re-use the highest `update_at` seen on a previous page as the next `since` value without missing rows that happened to share that millisecond. Rows within a delta page are ordered by `(update_at, id)` and the cursor disambiguates same-millisecond rows across pages.


        **Cursor source:** the client owns the cursor. The initial delta-sync request omits `since` (or sends `since=0`). For subsequent requests the client persists the `update_at` and `id` of the last row in the response and passes them back as `cursor_update_at` and `cursor_id` alongside the same `since` value. This mirrors the cursor convention used by the shared-channel post-sync API.


        **Cursor key must match the active ordering:** in delta mode (`since > 0`) the endpoint orders by `update_at` and pagination requires `cursor_update_at`; otherwise it orders by `create_at` and pagination requires `cursor_create_at`. Passing the wrong key for the active mode returns 400.


        **Large option lists:** a field with more than 1000 options is
        returned without `attrs.options`; `attrs.options_count` gives the
        number of options and `attrs.options_omitted` is `true`. Use the get
        property field options endpoint to page through them.


        **License:** in the `access_control` group, this endpoint requires an
        Entry, Enterprise or Enterprise Advanced license (403 otherwise).
        Fields with object type `channel` in that group require Entry or
        Enterprise Advanced (501 otherwise).


        __Minimum server version__: 11.7
      operationId: GetPropertyFields
      parameters:
        - name: group_name
          in: path
          description: The name of the property group
          required: true
          schema:
            type: string
        - name: object_type
          in: path
          description: The type of object to retrieve property fields for
          required: true
          schema:
            type: string
        - name: channel_id
          in: query
          description: >
            Hierarchical scope. When set, the response includes system-level
            rows, team-level rows for the channel's team, and channel-level
            rows for this channel. Mutually exclusive with `target_type` and
            `target_id`. Requires `read_channel` on the channel.
          schema:
            type: string
        - name: team_id
          in: query
          description: >
            Hierarchical scope. When set without `channel_id`, the response
            includes system-level and team-level rows for this team. When
            `channel_id` is also set, this value is ignored — the channel's
            team is resolved server-side and used instead. Mutually exclusive
            with `target_type` and `target_id`. Requires `view_team` on the
            team.
          schema:
            type: string
        - name: target_type
          in: query
          description: >
            Single-target scope. One of `system`, `team`, or `channel`.
            Required in single-target mode. Mutually exclusive with `channel_id`
            and `team_id`.
          schema:
            type: string
            enum:
              - system
              - team
              - channel
        - name: target_id
          in: query
          description: >
            Single-target scope. Required when `target_type` is `channel` or
            `team`. Mutually exclusive with `channel_id` and `team_id`.
          schema:
            type: string
        - name: since
          in: query
          description: >
            Unix timestamp in milliseconds. When greater than 0, returns
            fields with `update_at` greater than or equal to this value,
            including tombstones.
          schema:
            type: integer
            format: int64
        - name: cursor_id
          in: query
          description: The ID of the last property field from the previous page, for cursor-based pagination.
          schema:
            type: string
        - name: cursor_create_at
          in: query
          description: >
            The `create_at` timestamp of the last property field from the
            previous page. Required alongside `cursor_id` when `since` is
            absent. Mutually exclusive with `cursor_update_at`.
          schema:
            type: integer
            format: int64
        - name: cursor_update_at
          in: query
          description: >
            The `update_at` timestamp of the last property field from the
            previous page. Required alongside `cursor_id` when `since` is
            present. Mutually exclusive with `cursor_create_at`.
          schema:
            type: integer
            format: int64
        - name: per_page
          in: query
          description: The number of property fields per page.
          schema:
            type: integer
            default: 60
      responses:
        "200":
          description: Property fields retrieval successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PropertyField"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  "/api/v4/properties/groups/{group_name}/fields/search":
    post:
      tags:
        - properties
      summary: Search property fields across multiple object types
      description: >
        Returns matching fields across every requested object type in one
        response. The request body is a `PropertyFieldSearch` object whose
        `object_types` field lists the object types to include.

        Scope, `since`, cursor, and permission semantics are identical to the
        get property fields endpoint, including the system-object collapse:
        when `object_types` is exactly `["system"]`, any scope or target
        params in the body are ignored and the endpoint resolves to
        `target_type=system`. Any other combination without an explicit
        scope returns 400.

        Requesting a single value in `object_types` is equivalent to calling
        the singular endpoint and is supported for client uniformity.


        **License:** in the `access_control` group, this endpoint requires an
        Entry, Enterprise or Enterprise Advanced license (403 otherwise).
        Including `channel` in `object_types` for that group requires Entry or
        Enterprise Advanced (501 otherwise).


        __Minimum server version__: 11.10
      operationId: SearchPropertyFields
      parameters:
        - name: group_name
          in: path
          description: The name of the property group
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - object_types
              properties:
                object_types:
                  type: array
                  minItems: 1
                  description: >
                    One or more object types to include in the response. At
                    least one value is required; unknown values return 400.
                  items:
                    type: string
                    enum:
                      - post
                      - channel
                      - user
                      - template
                      - session
                      - system
                channel_id:
                  type: string
                  description: >
                    Hierarchical scope. When set, the response includes
                    system-level rows, team-level rows for the channel's
                    team, and channel-level rows for this channel across
                    every requested `object_types`. Mutually exclusive with
                    `target_type`/`target_id`. Requires `read_channel` on
                    the channel.
                team_id:
                  type: string
                  description: >
                    Hierarchical scope. When set without `channel_id`, the
                    response includes system-level and team-level rows for
                    this team across every requested `object_types`. When
                    `channel_id` is also set, this value is ignored — the
                    channel's team is resolved server-side and used instead.
                    Mutually exclusive with `target_type`/`target_id`.
                    Requires `view_team` on the team.
                target_type:
                  type: string
                  enum:
                    - system
                    - team
                    - channel
                  description: >
                    Single-target scope. Mutually exclusive with `channel_id`
                    and `team_id`. Required if no hierarchical scope is
                    given, except when `object_types` is exactly `["system"]`
                    — in that case any scope or target params are ignored
                    and the endpoint resolves to `target_type=system`.
                target_id:
                  type: string
                  description: >
                    Single-target scope. Required when `target_type` is
                    `channel` or `team`. Mutually exclusive with `channel_id`
                    and `team_id`.
                since:
                  type: integer
                  format: int64
                  description: >
                    Unix timestamp in milliseconds. When greater than 0,
                    returns fields with `update_at` greater than or equal
                    to this value, including tombstones.
                cursor_id:
                  type: string
                  description: The ID of the last property field from the previous page, for cursor-based pagination.
                cursor_create_at:
                  type: integer
                  format: int64
                  description: >
                    The `create_at` timestamp of the last property field
                    from the previous page. Required alongside `cursor_id`
                    when `since` is absent. Mutually exclusive with
                    `cursor_update_at`.
                cursor_update_at:
                  type: integer
                  format: int64
                  description: >
                    The `update_at` timestamp of the last property field
                    from the previous page. Required alongside `cursor_id`
                    when `since` is present. Mutually exclusive with
                    `cursor_create_at`.
                per_page:
                  type: integer
                  default: 60
                  description: The number of property fields per page.
      responses:
        "200":
          description: Property fields retrieval successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PropertyField"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/api/v4/properties/groups/{group_name}/{object_type}/fields/{field_id}":
    patch:
      tags:
        - properties
      summary: Update a property field
      description: >
        Partially update a property field by providing only the fields you want to update. Omitted fields will not be updated.
        The `attrs` object uses merge semantics: only the keys present in the patch are updated; omitted keys are preserved. Setting a key to `null` removes it from attrs.


        **Immutable fields:** `target_type`, `target_id`, and `object_type` cannot be changed after creation and are ignored if included in the patch.


        **Linked fields:** Fields with a `linked_field_id` cannot have their `type` or `attrs.options` modified (returns 400).
        The `linked_field_id` can only be cleared (set to empty string `""`) to unlink the field; it cannot be changed to a different value.
        For non-linked fields, `linked_field_id` cannot be set to a new value (linking is only allowed at creation time).


        **Propagation:** When a template field's options are updated, the changes propagate atomically to all fields that link to it.


        **Large option lists:** a field with more than 1000 options is read
        without `attrs.options`; `attrs.options_count` gives the number of
        options and `attrs.options_omitted` is `true`. Patching such a field
        with an option list returns 400; change its options through the
        property field options endpoints instead.


        **License:** in the `access_control` group, this endpoint requires an
        Entry, Enterprise or Enterprise Advanced license (403 otherwise).
        Fields with object type `channel` in that group, and templates that
        `channel` fields link to, require Entry or Enterprise Advanced (501
        otherwise).


        __Minimum server version__: 11.7
      operationId: UpdatePropertyField
      parameters:
        - name: group_name
          in: path
          description: The name of the property group
          required: true
          schema:
            type: string
        - name: object_type
          in: path
          description: The type of object this property field applies to
          required: true
          schema:
            type: string
        - name: field_id
          in: path
          description: Property field ID
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyFieldPatch"
        description: Property field patch object
        required: true
      responses:
        "200":
          description: Property field update successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyField"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Name conflict with an existing field, or cannot change type of a
            field that has active linked dependents.
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      tags:
        - properties
      summary: Delete a property field
      description: >
        Deletes a property field and all its associated values.
        Returns 409 Conflict if the field has active linked dependents;
        unlink or delete dependent fields first.


        **License:** in the `access_control` group, this endpoint requires an
        Entry, Enterprise or Enterprise Advanced license (403 otherwise).
        Fields with object type `channel` in that group, and templates that
        `channel` fields link to, require Entry or Enterprise Advanced (501
        otherwise).


        __Minimum server version__: 11.7
      operationId: DeletePropertyField
      parameters:
        - name: group_name
          in: path
          description: The name of the property group
          required: true
          schema:
            type: string
        - name: object_type
          in: path
          description: The type of object this property field applies to
          required: true
          schema:
            type: string
        - name: field_id
          in: path
          description: Property field ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Property field deletion successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The field has active linked dependents. Unlink or delete dependent
            fields before deleting the source.
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  "/api/v4/properties/groups/{group_name}/{object_type}/fields/{field_id}/options":
    get:
      tags:
        - properties
      summary: Get property field options
      description: >
        Get one page of a property field's options, in the order they were
        created. This is how to read the options of a field with more than
        1000 options, which is read without `attrs.options`.


        The page includes the options the field inherits from the template
        it's linked to, marked `read_only`. On a hierarchical (`graph`) field,
        each option lists the names of the options directly above it in
        `parents`.


        Keep requesting pages while `has_more` is `true`, passing the
        response's `next_cursor_create_at` and `next_cursor_id` back as
        `cursor_create_at` and `cursor_id`. A short or empty page doesn't mean
        the listing has ended.


        Returns 400 for a field type without options.


        **License:** in the `access_control` group, this endpoint requires an
        Entry, Enterprise or Enterprise Advanced license (403 otherwise).
        Fields with object type `channel` in that group, and templates that
        `channel` fields link to, require Entry or Enterprise Advanced (501
        otherwise).


        __Minimum server version__: 12.0


        ##### Permissions


        The same as reading the field: any authenticated user for a
        system-level field, `view_team` on the team for a team-level field,
        and `read_channel` on the channel for a channel-level field.
      operationId: GetPropertyFieldOptions
      parameters:
        - name: group_name
          in: path
          description: The name of the property group
          required: true
          schema:
            type: string
        - name: object_type
          in: path
          description: The object type of the property field
          required: true
          schema:
            type: string
        - name: field_id
          in: path
          description: Property field ID
          required: true
          schema:
            type: string
        - name: cursor_id
          in: query
          description: >
            The `next_cursor_id` from the previous page. Send it together with
            `cursor_create_at`, or send neither; sending only one returns 400.
          schema:
            type: string
        - name: cursor_create_at
          in: query
          description: >
            The `next_cursor_create_at` from the previous page. Send it
            together with `cursor_id`, or send neither.
          schema:
            type: integer
            format: int64
        - name: per_page
          in: query
          description: The number of options per page. The maximum is 200.
          schema:
            type: integer
            default: 60
            maximum: 200
      responses:
        "200":
          description: Property field options retrieval successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyFieldOptionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags:
        - properties
      summary: Create property field options
      description: >
        Add options to a property field. Either every option in the request is
        created or none is.


        Send each option's `name`, and optionally its `color`, `attrs` and, on
        a hierarchical (`graph`) field, `parents`. Don't send an `id`; the
        server assigns one. A parent can be an option the field already has or
        another option in the same request. A new option's name can't match
        the name of an option the field already has, including inherited
        options. A hierarchical field holds at most 100,000 options.


        Returns 400 for a field type without options; for a `rank` field,
        whose options are set through the field's `attrs.options` so that each
        option carries its rank; and for a field linked to a hierarchical
        (`graph`) template, whose options can only be changed on the template.


        **License:** in the `access_control` group, this endpoint requires an
        Entry, Enterprise or Enterprise Advanced license (403 otherwise).
        Fields with object type `channel` in that group, and templates that
        `channel` fields link to, require Entry or Enterprise Advanced (501
        otherwise).


        __Minimum server version__: 12.0


        ##### Permissions


        Requires permission to manage the field's options.
      operationId: CreatePropertyFieldOptions
      parameters:
        - name: group_name
          in: path
          description: The name of the property group
          required: true
          schema:
            type: string
        - name: object_type
          in: path
          description: The object type of the property field
          required: true
          schema:
            type: string
        - name: field_id
          in: path
          description: Property field ID
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 200
              items:
                $ref: "#/components/schemas/PropertyFieldOption"
        description: The options to create
        required: true
      responses:
        "201":
          description: Property field options creation successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PropertyFieldOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The field changed while the request was being processed. Retry the
            request.
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
    patch:
      tags:
        - properties
      summary: Update property field options
      description: >
        Update options that a property field owns. Identify each option by its
        `id` and include its `name`, even if the name isn't changing. A
        `color`, `attrs` or `parents` value that's left out stays as it was.
        On a hierarchical (`graph`) field, sending `parents` replaces the
        option's parents; send an empty array to make it a top-level option.


        Options the field inherits from a template (`read_only`) can't be
        changed here; change them on the template.


        Returns 400 for a field type without options; for a `rank` field,
        whose options are set through the field's `attrs.options` so that each
        option carries its rank; and for a field linked to a hierarchical
        (`graph`) template, whose options can only be changed on the template.


        **License:** in the `access_control` group, this endpoint requires an
        Entry, Enterprise or Enterprise Advanced license (403 otherwise).
        Fields with object type `channel` in that group, and templates that
        `channel` fields link to, require Entry or Enterprise Advanced (501
        otherwise).


        __Minimum server version__: 12.0


        ##### Permissions


        Requires permission to manage the field's options.
      operationId: UpdatePropertyFieldOptions
      parameters:
        - name: group_name
          in: path
