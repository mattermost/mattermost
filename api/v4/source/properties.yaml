        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The field changed while the request was being processed. Retry the
            request.
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  "/api/v4/properties/groups/{group_name}/{object_type}/values/{target_id}":
    get:
      tags:
        - properties
      summary: Get property values for a target
      description: >
        Get all property values for a specific target within a group. Uses cursor-based pagination.
        The `template` object type cannot have values and will return 400.
        The `system` object type must use the dedicated `/api/v4/properties/groups/{group_name}/system/values` endpoint and will return 400 on this route.


        **Delta sync via `since`:** When `since > 0`, the endpoint returns only rows whose `update_at` is greater than or equal to the cutoff, *including* tombstoned rows.


        **Cursor key must match the active ordering:** in delta mode (`since > 0`) the endpoint orders by `update_at` and pagination requires `cursor_update_at`; otherwise it orders by `create_at` and pagination requires `cursor_create_at`.


        **License:** in the `access_control` group, this endpoint requires an
        Entry, Enterprise or Enterprise Advanced license (403 otherwise), and
        values of objects of type `channel` require Entry or Enterprise
        Advanced (501 otherwise).


        __Minimum server version__: 11.7


        ##### Permissions


        Depends on the object type: `read_channel` on the channel for
        `channel`, `read_channel` on the post's channel for `post`, and for
        `user`, being the user or being able to see them. Other object types
        return 400.
      operationId: GetPropertyValues
      parameters:
        - name: group_name
          in: path
          description: The name of the property group
          required: true
          schema:
            type: string
        - name: object_type
          in: path
          description: The type of object
          required: true
          schema:
            type: string
        - name: target_id
          in: path
          description: The ID of the target object
          required: true
          schema:
            type: string
        - name: since
          in: query
          description: >
            Unix timestamp in milliseconds. When greater than 0, returns
            values with `update_at` greater than or equal to this value,
            including tombstones.
          schema:
            type: integer
            format: int64
        - name: cursor_id
          in: query
          description: The ID of the last property value from the previous page, for cursor-based pagination.
          schema:
            type: string
        - name: cursor_create_at
          in: query
          description: >
            The `create_at` timestamp of the last property value from the
            previous page. Required alongside `cursor_id` when `since` is
            absent. Mutually exclusive with `cursor_update_at`.
          schema:
            type: integer
            format: int64
        - name: cursor_update_at
          in: query
          description: >
            The `update_at` timestamp of the last property value from the
            previous page. Required alongside `cursor_id` when `since` is
            present. Mutually exclusive with `cursor_create_at`.
          schema:
            type: integer
            format: int64
        - name: per_page
          in: query
          description: The number of property values per page.
          schema:
            type: integer
            default: 60
      responses:
        "200":
          description: Property values retrieval successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PropertyValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    patch:
      tags:
        - properties
      summary: Update property values for a target
      description: >
        Update one or more property values for a specific target within a group. Uses upsert semantics: creates the value if it doesn't exist, updates it if it does. All field IDs must belong to the specified group.
        The `template` object type cannot have values and will return 400.
        The `system` object type must use the dedicated `/api/v4/properties/groups/{group_name}/system/values` endpoint and will return 400 on this route.


        The request can set up to 50 values, each for a different field. An
        empty request, more than 50 items, or the same `field_id` twice returns
        400. A `field_id` that doesn't exist in the group, or that belongs to a
        field of another object type, returns 404.


        **License:** in the `access_control` group, this endpoint requires an
        Entry, Enterprise or Enterprise Advanced license (403 otherwise), and
        values of objects of type `channel` require Entry or Enterprise
        Advanced (501 otherwise).


        __Minimum server version__: 11.7


        ##### Permissions


        Depends on the object type: for `channel`,
        `manage_public_channel_properties` or
        `manage_private_channel_properties` on the channel, or membership of a
        direct or group message channel; for `post`, `create_post` in the
        post's channel; for `user`, being the user or having
        `edit_other_users`. Other object types return 400. The caller also
        needs permission to set values of each field in the request (403
        otherwise).
      operationId: UpdatePropertyValues
      parameters:
        - name: group_name
          in: path
          description: The name of the property group
          required: true
          schema:
            type: string
        - name: object_type
          in: path
          description: The type of object
          required: true
          schema:
            type: string
        - name: target_id
          in: path
          description: The ID of the target object
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - field_id
                  - value
                properties:
                  field_id:
                    type: string
                    description: The ID of the property field
                  value:
                    description: >
                      The value to set for this property. Can be any JSON type.
                      For `text` fields it's a string, for `select` and `rank`
                      fields an option ID, and for `multiselect` and `graph`
                      fields an array of option IDs.
        description: Array of property values to update
        required: true
      responses:
        "200":
          description: Property values update successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PropertyValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
